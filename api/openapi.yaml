        qty:
          type: integer
          minimum: 1
        unitCost:
          type: integer
          minimum: 0
        expiryDate:
          type: string
          format: date
          nullable: true
    ReceiptEdit:
      type: object
      description: Semua baris nota (tepat sama dengan lineId yang ada); baris tidak bisa ditambah atau dihapus.
      required: [supplierName, notaDate, lines, payment]
      properties:
        supplierName:
          type: string
          minLength: 1
          maxLength: 100
        notaDate:
          type: string
          format: date
        lines:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/ReceiptLineEdit"
        payment:
          $ref: "#/components/schemas/ReceiptPayment"
    ReceiptStatus:
      type: string
