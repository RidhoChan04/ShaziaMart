        kasirName:
          type: string
        openedAt:
          type: integer
          format: int64
    StaffShift:
      type: object
      description: Shift laci untuk orang toko; tanpa uang modal atau angka kas.
      required: [shift]
      properties:
        shift:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/DrawerShift"
    SupplierDebtList:
      type: object
      required: [debts, drawerShift]
      properties:
        debts:
          type: array
          description: Belum lunas urut jatuh tempo, lalu lunas terbaru dulu.
          items:
            $ref: "#/components/schemas/SupplierDebt"
        drawerShift:
          nullable: true
          description: null bila tidak ada shift buka (Dari laci kasir tidak tersedia).
          allOf:
            - $ref: "#/components/schemas/DrawerShift"
    PayDebtInput:
      type: object
      description: cashSource wajib bila tunai, null bila transfer.
      required: [method, cashSource]
      properties:
        method:
          type: string
          enum: [tunai, transfer]
        cashSource:
          type: string
          nullable: true
          enum: [laci, pemilik]
    ReceiptField:
      type: string
      description: |
        Isian nota yang salah. Tingkat nota (lineId null): supplierName, notaDate, lines, photoId,
        payment, dueDate, cashSource. Tingkat baris: product, unit, qty, unitCost, expiryDate, dan
        isian barang baru newName, newSellUnit, newNotaUnit, newNotaUnitSize, newBarcode.
      enum: [supplierName, notaDate, lines, photoId, payment, dueDate, cashSource, product, unit, qty, unitCost, expiryDate, newName, newSellUnit, newNotaUnit, newNotaUnitSize, newBarcode]
    ReceiptError:
      type: object
      required: [lineId, field, message]
      properties:
        lineId:
          type: string
          nullable: true
          description: null = galat tingkat nota.
        field:
          $ref: "#/components/schemas/ReceiptField"
        message:
          type: string
    ReceiptProblem:
      description: Problem VALIDATION dengan galat per baris/field nota barang masuk.
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [code, errors]
          properties:
            code:
              type: string
              enum: [VALIDATION]
            errors:
              type: array
              items:
                $ref: "#/components/schemas/ReceiptError"
    OpnameScope:
      type: object
      description: |
        Lingkup opname. kategori = barang berkategori category; tanpa_kategori = barang berkategori
        null (mis. barang baru dari nota); semua = semua barang. category wajib iff kind = kategori
        (selain itu null).
      required: [kind, category]
      properties:
        kind:
          type: string
          enum: [kategori, tanpa_kategori, semua]
        category:
          type: string
          nullable: true
    OpnameReason:
      type: string
      description: |
        Alasan selisih opname. rusak, hilang, kedaluwarsa, dan salah_input dipilih staf;
        tidak_diketahui = salah_input tanpa nota rujukan (J4).
      enum: [rusak, hilang, kedaluwarsa, salah_input, tidak_diketahui]
    OpnameItemState:
      type: string
      description: |
        cocok = selisih 0; stok_awal = hitungan pertama barang stockCounted false, langsung jadi
        stok (J1); menunggu_alasan = selisih, alasan belum disimpan; disesuaikan = stok sudah
        dikoreksi; ditahan = menunggu persetujuan pemilik (nilai > Rp100.000 atau HPP belum ada);
        disetujui = disetujui pemilik; dihitung_ulang = dihitung ulang pemilik; diganti = kalah
        oleh hitungan barang yang sama dengan countedAt lebih baru, tidak pernah diterapkan.
      enum: [cocok, stok_awal, menunggu_alasan, disesuaikan, ditahan, disetujui, dihitung_ulang, diganti]
    OpnameSessionStatus:
      type: string
      description: |
        menunggu_alasan = ada barang menunggu_alasan; selesai = alasan sudah disimpan, atau tidak
        ada (lagi) barang menunggu_alasan — sesi yang semua barang menunggu_alasan-nya menjadi
        diganti otomatis selesai (finishedAt = saat itu).
      enum: [menunggu_alasan, selesai]
    StaffOpnameCategory:
      type: object
      description: Satu lingkup opname; scope.kind kategori atau tanpa_kategori.
      required: [scope, productCount, lastCountedAt]
      properties:
        scope:
          $ref: "#/components/schemas/OpnameScope"
        productCount:
          type: integer
        lastCountedAt:
          type: integer
          format: int64
          nullable: true
          description: submittedAt sesi terakhir dengan lingkup ini atau semua; null = belum pernah dihitung.
    StaffOpnameCategories:
      type: object
      required: [categories, allCount, suggested]
      properties:
        categories:
          type: array
          description: Belum pernah dihitung dulu, lalu paling lama dihitung.
          items:
            $ref: "#/components/schemas/StaffOpnameCategory"
        allCount:
          type: integer
          description: Jumlah barang berstatus selain nonaktif (lingkup semua).
        suggested:
          nullable: true
          description: Lingkup pertama di categories; null bila kosong.
          allOf:
            - $ref: "#/components/schemas/OpnameScope"
    OpnameCountInput:
      type: object
      required: [productId, qtyBase, countedAt]
      properties:
        productId:
          type: string
        qtyBase:
          type: integer
          minimum: 0
          description: Jumlah fisik dalam satuan dasar; 0 sah.
        countedAt:
          type: integer
          format: int64
          description: Jam HP saat barang dibuka untuk dihitung (scan/ketuk); membuka ulang memperbarui jamnya.
    OpnameSessionInput:
      type: object
      required: [id, scope, deviceNow, items]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 64
          description: ID draf dari HP (idempotensi).
        scope:
          $ref: "#/components/schemas/OpnameScope"
        deviceNow:
          type: integer
          format: int64
          description: Jam HP saat mengirim; dipakai menggeser countedAt ke jam server (K6).
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/OpnameCountInput"
    OpnameReceiptOption:
      type: object
      description: Nota barang masuk aktif yang memuat barang itu (rujukan salah input sebelumnya).
      required: [receiptId, supplierName, notaDate]
      properties:
        receiptId:
          type: string
        supplierName:
          type: string
        notaDate:
          type: string
          format: date
    StaffOpnameItem:
      type: object
      description: |
        Satu barang yang dihitung. systemQtyBase baru dikirim setelah hitungan diterima server
        (hitung buta, K8): stok pada jam hitung (countedAt server), diffQtyBase = countedQtyBase −
        systemQtyBase. Tanpa nilai rupiah.
      required: [productId, productName, unitName, unitSize, isCurah, countedQtyBase, countedAt, clockEstimated, systemQtyBase, diffQtyBase, state, reason, receiptRef, receiptOptions]
      properties:
        productId:
          type: string
        productName:
          type: string
        unitName:
          type: string
          description: Satuan eceran.
        unitSize:
          type: integer
          minimum: 1
          description: Isi satuan eceran dalam satuan dasar.
        isCurah:
          type: boolean
        countedQtyBase:
          type: integer
        countedAt:
          type: integer
          format: int64
          description: Jam hitung setelah digeser ke jam server (K6).
        clockEstimated:
          type: boolean
          description: Jam HP melenceng > 5 menit dari jam server, atau jam hasil geser dijepit ke jam server.
        systemQtyBase:
          type: integer
        diffQtyBase:
          type: integer
        state:
          $ref: "#/components/schemas/OpnameItemState"
        reason:
          nullable: true
          description: Alasan tersimpan; null bila belum ada atau tidak perlu.
          allOf:
            - $ref: "#/components/schemas/OpnameReason"
        receiptRef:
          nullable: true
          description: Nota rujukan untuk salah_input (J4).
          allOf:
            - $ref: "#/components/schemas/OpnameReceiptOption"
        receiptOptions:
          type: array
          description: |
            Barang selisih: paling banyak 5 nota aktif terakhir yang memuat barang itu (notaDate lalu
            createdAt terbaru dulu); kosong untuk barang lain.
          maxItems: 5
          items:
            $ref: "#/components/schemas/OpnameReceiptOption"
    StaffOpnameSession:
      type: object
      required: [id, scope, status, createdByName, submittedAt, finishedAt, items]
      properties:
        id:
          type: string
        scope:
          $ref: "#/components/schemas/OpnameScope"
        status:
          $ref: "#/components/schemas/OpnameSessionStatus"
        createdByName:
          type: string
        submittedAt:
          type: integer
          format: int64
          description: Waktu server saat hitungan diterima.
        finishedAt:
          type: integer
          format: int64
          nullable: true
        items:
          type: array
          description: Urut nama barang.
          items:
            $ref: "#/components/schemas/StaffOpnameItem"
    StaffOpnameRow:
      type: object
      required: [id, scope, status, submittedAt, finishedAt, itemCount, diffCount, heldCount]
      properties:
        id:
          type: string
        scope:
          $ref: "#/components/schemas/OpnameScope"
        status:
          $ref: "#/components/schemas/OpnameSessionStatus"
        submittedAt:
          type: integer
          format: int64
        finishedAt:
          type: integer
          format: int64
          nullable: true
        itemCount:
          type: integer
          description: Jumlah barang dihitung.
        diffCount:
          type: integer
          description: Jumlah barang selisih (bukan cocok, stok_awal, atau diganti).
        heldCount:
          type: integer
          description: Jumlah barang ditahan.
    OpnameReasonInput:
      type: object
      required: [productId, reason, receiptId]
      properties:
        productId:
          type: string
        reason:
          type: string
          enum: [rusak, hilang, kedaluwarsa, salah_input]
        receiptId:
          type: string
          nullable: true
          description: Hanya untuk salah_input; dari receiptOptions barang itu; null = tidak tahu notanya.
    OpnameFinishInput:
      type: object
      required: [reasons]
      properties:
        reasons:
          type: array
          items:
            $ref: "#/components/schemas/OpnameReasonInput"
    OpnameRecount:
      type: object
      description: Hitung ulang pemilik; systemQtyBase = stok saat hitung ulang.
      required: [countedQtyBase, countedAt, systemQtyBase, diffQtyBase, value]
      properties:
        countedQtyBase:
          type: integer
        countedAt:
          type: integer
          format: int64
        systemQtyBase:
          type: integer
        diffQtyBase:
          type: integer
        value:
          type: integer
          nullable: true
          description: Nilai rupiah |diffQtyBase| (K3); null bila HPP belum ada.
    OwnerOpnameItem:
      description: Barang opname versi pemilik (field StaffOpnameItem ditambah nilai rupiah dan penyelesaian).
      allOf:
        - $ref: "#/components/schemas/StaffOpnameItem"
        - type: object
          required: [value, units, resolvedByName, resolvedAt, replacedBySessionId, replacedByName, recount]
          properties:
            value:
              type: integer
              nullable: true
              description: |
                round_half_up(|diffQtyBase| × cost.amount ÷ cost.qtyBase) dari HPP saat dinilai (K3);
                null bila HPP belum ada (selisih ≠ 0 selalu ditahan, J3). Barang yang ditahan lalu
                diganti menyimpan nilai saat ditahan.
            units:
              type: array
              description: Satuan aktif barang sekarang (untuk penghitung hitung ulang); units[0] = eceran.
              items:
                $ref: "#/components/schemas/StaffUnit"
            resolvedByName:
              type: string
              nullable: true
              description: Pemilik yang menyetujui atau menghitung ulang.
            resolvedAt:
              type: integer
              format: int64
              nullable: true
            replacedBySessionId:
              type: string
              nullable: true
              description: Sesi yang hitungannya menggantikan barang ini (state diganti).
            replacedByName:
              type: string
              nullable: true
              description: |
                Nama pembuat sesi pengganti, hanya bila barang ini menunggu pemilik saat diganti:
                berstate ditahan, atau pengganti hitungan tertahan yang alasannya belum disimpan
                (selisih tertahan tetap terlihat pemilik, I2); null untuk barang lain, termasuk
                hitungan biasa yang diganti saat masih menunggu_alasan.
            recount:
              nullable: true
              allOf:
                - $ref: "#/components/schemas/OpnameRecount"
    OwnerOpnameSession:
      type: object
      description: |
        lossValue / gainValue (K26) = Σ value barang menunggu_alasan, disesuaikan, ditahan,
        disetujui, dan recount.value barang dihitung_ulang (kurang → loss, lebih → gain); cocok,
        stok_awal, dan diganti tidak dihitung. totalValue = lossValue + gainValue. flagged
        ditetapkan saat alasan disimpan (Σ > sessionLimit) dan tidak berubah.
      required: [id, scope, status, createdByName, submittedAt, finishedAt, items, lossValue, gainValue, totalValue, flagged, sessionLimit, reviewedByName, reviewedAt]
      properties:
        id:
          type: string
        scope:
          $ref: "#/components/schemas/OpnameScope"
        status:
          $ref: "#/components/schemas/OpnameSessionStatus"
        createdByName:
          type: string
        submittedAt:
          type: integer
          format: int64
        finishedAt:
          type: integer
          format: int64
          nullable: true
        items:
          type: array
          items:
            $ref: "#/components/schemas/OwnerOpnameItem"
        lossValue:
          type: integer
        gainValue:
          type: integer
        totalValue:
          type: integer
        flagged:
          type: boolean
        sessionLimit:
          type: integer
          description: Batas total selisih per sesi (rupiah) dari pengaturan server sekarang (J8; Rp250.000).
        reviewedByName:
          type: string
          nullable: true
        reviewedAt:
          type: integer
          format: int64
          nullable: true
    OwnerOpnameRow:
      type: object
      required: [id, scope, status, createdByName, submittedAt, finishedAt, itemCount, diffCount, heldCount, totalValue, flagged, reviewed]
      properties:
        id:
          type: string
        scope:
          $ref: "#/components/schemas/OpnameScope"
        status:
          $ref: "#/components/schemas/OpnameSessionStatus"
        createdByName:
          type: string
        submittedAt:
          type: integer
          format: int64
        finishedAt:
          type: integer
          format: int64
          nullable: true
        itemCount:
          type: integer
        diffCount:
          type: integer
        heldCount:
          type: integer
        totalValue:
          type: integer
        flagged:
          type: boolean
        reviewed:
          type: boolean
    OpnameRecountInput:
      type: object
      required: [qtyBase]
      properties:
        qtyBase:
          type: integer
          minimum: 0
    OpnameError:
      type: object
      required: [productId, message]
      properties:
        productId:
          type: string
          nullable: true
          description: null = galat tingkat sesi.
        message:
          type: string
    OpnameProblem:
      description: Problem VALIDATION dengan galat per barang opname.
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [code, errors]
          properties:
            code:
              type: string
              enum: [VALIDATION]
            errors:
              type: array
              items:
                $ref: "#/components/schemas/OpnameError"
    ExpiryStage:
      type: string
      description: lewat = ED sebelum hari ini; segera = 0–soonDays hari lagi (ED hari ini termasuk).
      enum: [lewat, segera]
    StaffExpiryLot:
      type: object
      description: |
        Satu kiriman (baris nota) ber-ED. estimateQtyBase = perkiraan sisa FIFO (K9);
        capacityQtyBase = batas keluarkan dari kiriman ini.
      required: [lineId, receiptId, productId, productName, unitName, unitSize, isCurah, estimateQtyBase, capacityQtyBase, expiryDate, stage, supplierName, notaDate]
      properties:
        lineId:
          type: string
        receiptId:
          type: string
        productId:
          type: string
        productName:
          type: string
        unitName:
          type: string
          description: Satuan eceran.
        unitSize:
          type: integer
          minimum: 1
        isCurah:
          type: boolean
        estimateQtyBase:
          type: integer
        capacityQtyBase:
          type: integer
        expiryDate:
          type: string
          format: date
        stage:
          $ref: "#/components/schemas/ExpiryStage"
        supplierName:
          type: string
        notaDate:
          type: string
          format: date
    ExpiryEvent:
      type: object
      description: keluar = dikeluarkan dari stok (qtyBase positif, tanggal null); ubah_ed = tanggal ED dibetulkan (qtyBase null).
      required: [id, at, actorName, kind, receiptId, lineId, productId, productName, unitName, unitSize, isCurah, qtyBase, fromDate, toDate]
      properties:
        id:
          type: string
        at:
          type: integer
          format: int64
        actorName:
          type: string
        kind:
          type: string
          enum: [keluar, ubah_ed]
        receiptId:
          type: string
        lineId:
          type: string
        productId:
          type: string
        productName:
          type: string
        unitName:
          type: string
        unitSize:
          type: integer
          minimum: 1
        isCurah:
          type: boolean
        qtyBase:
          type: integer
          nullable: true
        fromDate:
          type: string
          format: date
          nullable: true
        toDate:
          type: string
          format: date
          nullable: true
    StaffExpiryList:
      type: object
      required: [today, soonDays, lots, recent]
      properties:
        today:
          type: string
          format: date
          description: |
            Hari ini menurut server (Asia/Jakarta), dasar tahap tiap kiriman; app memakainya untuk
            teks "Lewat {n} hari" / "Hari ini" / "{n} hari lagi", bukan tanggal HP.
        soonDays:
          type: integer
          description: Batas tahap segera (hari), dari pengaturan server.
        lots:
          type: array
          items:
            $ref: "#/components/schemas/StaffExpiryLot"
        recent:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/ExpiryEvent"
    OwnerExpiryLot:
      description: Kiriman ber-ED versi pemilik.
      allOf:
        - $ref: "#/components/schemas/StaffExpiryLot"
        - type: object
          required: [lossValue]
          properties:
            lossValue:
              type: integer
              nullable: true
              description: round_half_up(estimateQtyBase × cost.amount ÷ cost.qtyBase) dari HPP sekarang; null bila HPP belum ada.
    OwnerExpiryEvent:
      description: Log kedaluwarsa versi pemilik.
      allOf:
        - $ref: "#/components/schemas/ExpiryEvent"
        - type: object
          required: [lossValue]
          properties:
            lossValue:
              type: integer
              nullable: true
              description: Nilai yang dikeluarkan dari HPP saat kejadian (K28, tidak dihitung ulang); null untuk ubah_ed atau tanpa HPP.
    OwnerExpiryList:
      type: object
      required: [today, soonDays, lots, recent, expiredLossValue]
      properties:
        today:
          type: string
          format: date
          description: Hari ini menurut server (Asia/Jakarta); lihat StaffExpiryList.today.
        soonDays:
          type: integer
        lots:
          type: array
          items:
            $ref: "#/components/schemas/OwnerExpiryLot"
        recent:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/OwnerExpiryEvent"
        expiredLossValue:
          type: integer
          description: Perkiraan kerugian = Σ lossValue yang diketahui pada kiriman tahap lewat.
    ExpiryRemovalInput:
      type: object
      required: [id, receiptId, lineId, qtyBase]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 64
          description: ID dari HP (idempotensi).
        receiptId:
          type: string
        lineId:
          type: string
        qtyBase:
          type: integer
          minimum: 1
          description: Jumlah dalam satuan dasar; paling banyak capacityQtyBase kiriman itu.
    ExpiryDateInput:
      type: object
      required: [expiryDate]
      properties:
        expiryDate:
          type: string
          format: date
    StaffLowStockItem:
      type: object
      description: Barang menipis untuk orang toko; tanpa angka sisa stok (J7).
      required: [productId, productName, unitName, unitSize, isCurah, minQtyBase]
      properties:
        productId:
          type: string
        productName:
          type: string
        unitName:
          type: string
          description: Satuan eceran.
        unitSize:
          type: integer
          minimum: 1
        isCurah:
          type: boolean
        minQtyBase:
          type: integer
          description: Batas menipis (minStock) dalam satuan dasar.
    ExpiryAttention:
      type: object
      description: Jumlah barang berbeda yang punya ≥ 1 kiriman di tahap lewat / segera (K19).
      required: [expiredCount, soonCount, soonDays]
      properties:
        expiredCount:
          type: integer
        soonCount:
          type: integer
        soonDays:
          type: integer
    OpnameFlag:
      type: object
      description: Sesi opname bertanda selisih besar yang belum ditinjau.
      required: [sessionId, scope, finishedAt, totalValue]
      properties:
        sessionId:
          type: string
        scope:
          $ref: "#/components/schemas/OpnameScope"
        finishedAt:
          type: integer
          format: int64
        totalValue:
          type: integer
    ReportPeriod:
      type: string
      description: |
        Periode laporan (K12), kalender Asia/Jakarta: hari; minggu = Senin–Minggu; bulan = tanggal 1
        sampai akhir bulan; tanggal = rentang bebas maksimal 92 hari.
      enum: [hari, minggu, bulan, tanggal]
    ReportRange:
      type: object
      description: Rentang tanggal Asia/Jakarta YYYY-MM-DD; kedua ujung ikut.
      required: [from, to]
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
    ProductSalesSort:
      type: string
      description: Urutan listOwnerProductSales (K15); bawaan omzet.
      enum: [omzet, jumlah, laba]
    StockReportSort:
      type: string
      description: Urutan StockReport.unsold.items; bawaan modal.
      enum: [modal, lama]
    SalesTotals:
      type: object
      description: |
        Aturan sama dengan OwnerTodaySummary: hanya penjualan berstatus selesai (sekarang). Uang
        integer rupiah.
      required: [revenue, grossProfit, salesCount, avgTicket, newCredit, marginPermille]
      properties:
        revenue:
          type: integer
          description: Σ total penjualan selesai.
        grossProfit:
          type: integer
          description: revenue − Σ HPP yang disalin saat penjualan (HPP kosong dihitung 0); boleh negatif.
        salesCount:
          type: integer
        avgTicket:
          type: integer
          description: round_half_up(revenue / salesCount); 0 bila salesCount 0.
        newCredit:
          type: integer
          description: Σ bagian kasbon (metode pembayaran credit).
        marginPermille:
          type: integer
          nullable: true
          description: |
            (jawaban pemilik Q5) Margin laba kotor dalam permil bulat bertanda (164 = 16,4%):
            tanda(grossProfit) × round_half_up(|grossProfit| × 1000 / revenue); null bila revenue 0.
    ReportBucket:
      type: object
      required: [key, revenue, grossProfit, marginPermille]
      properties:
        key:
          type: string
          description: 'Jam "0".."23" (kind jam) atau tanggal YYYY-MM-DD (kind hari).'
        revenue:
          type: integer
          nullable: true
          description: Omzet penjualan selesai di bucket ini; null bila bucket belum terjadi.
        grossProfit:
          type: integer
          nullable: true
          description: Laba kotor bucket ini (HPP kosong = 0, boleh negatif); null bila bucket belum terjadi.
        marginPermille:
          type: integer
          nullable: true
          description: |
            Margin laba kotor bucket ini dalam permil bulat bertanda, aturan sama dengan
            SalesTotals.marginPermille: tanda(grossProfit) × round_half_up(|grossProfit| × 1000 /
            revenue); null bila revenue 0 atau bucket belum terjadi.
    ReportSeries:
      type: object
      required: [kind, buckets]
      properties:
        kind:
          type: string
          enum: [jam, hari]
        buckets:
          type: array
          items:
            $ref: "#/components/schemas/ReportBucket"
    ProductSales:
      type: object
      description: Penjualan selesai satu barang di rentang; semua satuan dijumlah dalam satuan dasar.
      required: [productId, productName, unitName, unitSize, isCurah, qtyBase, revenue, grossProfit]
      properties:
        productId:
          type: string
          nullable: true
          description: |
            null bila barangnya sudah tidak ada; barisnya dikelompokkan menurut nama barang di struk
            dengan satuan terkecil di struk.
        productName:
          type: string
        unitName:
          type: string
          description: Satuan eceran (satuan pertama barang).
        unitSize:
          type: integer
          minimum: 1
          description: Isi satuan eceran dalam satuan dasar.
        isCurah:
          type: boolean
        qtyBase:
          type: integer
          description: Σ qtyBase baris (2 dus isi 40 + 5 pcs = 85; curah 1,5 kg = 1500).
        revenue:
          type: integer
          description: Σ subtotal baris.
        grossProfit:
          type: integer
          nullable: true
          description: revenue − Σ HPP baris yang disalin saat penjualan; null bila ada baris tanpa HPP.
    CategorySales:
      type: object
      required: [category, revenue, grossProfit, productCount]
      properties:
        category:
          type: string
          nullable: true
          description: Kategori barang sekarang; null = tanpa kategori atau barang sudah tidak ada.
        revenue:
          type: integer
        grossProfit:
          type: integer
          description: revenue − Σ HPP baris (HPP kosong = 0), sama dengan aturan SalesTotals.
        productCount:
          type: integer
          description: Jumlah barang berbeda yang terjual di kategori ini.
    KasirSales:
      type: object
      required: [kasirName, revenue, salesCount, voidedCount]
      properties:
        kasirName:
          type: string
          description: Nama kasir saat penjualan.
        revenue:
          type: integer
          description: Omzet penjualan selesai kasir ini.
        salesCount:
          type: integer
          description: Jumlah penjualan selesai kasir ini.
        voidedCount:
          type: integer
          description: |
            (K14) Penjualan kasir ini yang dibuat di rentang dan kini berstatus dibatalkan (kapan pun
            dibatalkan, oleh siapa pun).
    SalesReport:
      type: object
      required: [period, range, previous, running, current, previousTotals, series, topProducts, categories, kasir]
      properties:
        period:
          $ref: "#/components/schemas/ReportPeriod"
        range:
          description: Rentang sesudah dijepit ke hari ini.
          allOf:
            - $ref: "#/components/schemas/ReportRange"
        previous:
          description: Rentang pembanding (K12, jawaban pemilik Q7).
          allOf:
            - $ref: "#/components/schemas/ReportRange"
        running:
          type: boolean
          description: Rentang memuat hari ini (periode berjalan).
        current:
          $ref: "#/components/schemas/SalesTotals"
        previousTotals:
          description: Total pembanding; dipotong di akhir menit sekarang hanya bila periode berjalan dan hari terakhirnya sejajar (tidak dijepit) (Q7).
          allOf:
            - $ref: "#/components/schemas/SalesTotals"
        series:
          $ref: "#/components/schemas/ReportSeries"
        topProducts:
          type: array
          maxItems: 3
          items:
            $ref: "#/components/schemas/ProductSales"
        categories:
          type: array
          items:
            $ref: "#/components/schemas/CategorySales"
        kasir:
          type: array
          items:
            $ref: "#/components/schemas/KasirSales"
    UnsoldItem:
      type: object
      description: |
        (K17) Barang tidak terjual: patokan = terakhir terjual (penjualan selesai). Belum pernah
        terjual → patokan = mulai ada: entri stok positif pertama, atau awal katalog bila tidak ada
        entri atau stok sudah ada sebelum entri itu (stok awal tanpa entri).
      required: [productId, productName, unitName, unitSize, isCurah, stockQtyBase, lastSoldAt, sinceDate, days, heldValue]
      properties:
        productId:
          type: string
        productName:
          type: string
        unitName:
          type: string
          description: Satuan eceran.
        unitSize:
          type: integer
          minimum: 1
        isCurah:
          type: boolean
        stockQtyBase:
          type: integer
        lastSoldAt:
          type: integer
          format: int64
          nullable: true
          description: Jam penjualan selesai terakhir; null = belum pernah terjual.
        sinceDate:
          type: string
          format: date
          description: Tanggal patokan Asia/Jakarta.
        days:
          type: integer
          description: isoDaysBetween(sinceDate, hari ini).
        heldValue:
          type: integer
          nullable: true
          description: Modal tertahan = round_half_up(stok × HPP); null bila HPP belum ada.
    ThinMarginItem:
      type: object
      description: |
        (K18) Barang aktif ber-HPP dengan harga eceran > 0 yang margin eceran-nya di bawah batas:
        (price − unitCost) × 1000 < thresholdPermille × price.
      required: [productId, productName, unitName, price, unitCost, marginPermille]
      properties:
        productId:
          type: string
        productName:
          type: string
        unitName:
          type: string
          description: Satuan eceran.
        price:
          type: integer
          description: Harga eceran.
        unitCost:
          type: integer
          description: HPP per satuan eceran.
        marginPermille:
          type: integer
          description: Margin bertanda dalam permil bulat; negatif = rugi (koreksi mockup M3).
    StockReport:
      type: object
      required: [today, unsold, thinMargin]
      properties:
        today:
          type: string
          format: date
        unsold:
          type: object
          description: |
            Barang dengan days ≥ minDays; tidak ikut stok ≤ 0, status nonaktif atau menunggu_harga,
            dan barang baru (belum pernah terjual dan mulai ada < minDays hari; barang yang pernah
            terjual tidak pernah dianggap baru). heldValue = Σ heldValue yang tidak null;
            noCostCount = barang tanpa HPP (tidak dijumlah).
          required: [minDays, count, heldValue, noCostCount, items]
          properties:
            minDays:
              type: integer
            count:
              type: integer
            heldValue:
              type: integer
            noCostCount:
              type: integer
            items:
              type: array
              items:
                $ref: "#/components/schemas/UnsoldItem"
        thinMargin:
          type: object
          description: Tidak masuk Perlu perhatian (P10).
          required: [thresholdPermille, count, items]
          properties:
            thresholdPermille:
              type: integer
            count:
              type: integer
            items:
              type: array
              items:
                $ref: "#/components/schemas/ThinMarginItem"
    DutyEntry:
      type: object
      description: Satu orang yang bertugas di jeda hitungan (K20).
      required: [name, shifts, records]
      properties:
        name:
          type: string
        shifts:
          type: integer
          description: Shift kasir yang tumpang dengan jeda.
        records:
          type: integer
          description: Catatan barang ini di jeda (nota barang masuk aktif, keluarkan kedaluwarsa, sesi opname lain).
    OpnameCountRow:
      type: object
      required: [sessionId, countedAt, counterName, diffQtyBase, value, reason, state, previousCountedAt, duty]
      properties:
        sessionId:
          type: string
        countedAt:
          type: integer
          format: int64
        counterName:
          type: string
        diffQtyBase:
          type: integer
          description: Selisih final (hasil hitung ulang bila dihitung_ulang); 0 = cocok.
        value:
          type: integer
          nullable: true
          description: Nilai rupiah |diffQtyBase|; null bila HPP belum ada.
        reason:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/OpnameReason"
        state:
          $ref: "#/components/schemas/OpnameItemState"
        previousCountedAt:
          type: integer
          format: int64
          nullable: true
          description: Hitungan sebelumnya (awal jeda); null = hitungan pertama.
        duty:
          type: array
          description: Yang bertugas di jeda; kosong untuk hitungan pertama. Urut nama.
          items:
            $ref: "#/components/schemas/DutyEntry"
    OpnameReportItem:
      type: object
      required: [productId, productName, unitName, unitSize, isCurah, countTotal, shortCount, overCount, repeated, shortQtyBase, overQtyBase, lossValue, gainValue]
      properties:
        productId:
          type: string
        productName:
          type: string
        unitName:
          type: string
          description: Satuan eceran.
        unitSize:
          type: integer
          minimum: 1
        isCurah:
          type: boolean
        countTotal:
          type: integer
          description: Hitungan final barang ini di rentang (termasuk cocok).
        shortCount:
          type: integer
        overCount:
          type: integer
        repeated:
          type: boolean
          description: Kurang di ≥ 2 hitungan final berturut-turut.
        shortQtyBase:
          type: integer
          description: Σ |selisih| hitungan kurang (positif).
        overQtyBase:
          type: integer
          description: Σ selisih hitungan lebih.
        lossValue:
          type: integer
          nullable: true
          description: Σ nilai hitungan kurang yang ber-HPP (positif); 0 bila tidak ada hitungan kurang; null bila semua hitungan kurangnya tanpa HPP.
        gainValue:
          type: integer
          nullable: true
          description: Σ nilai hitungan lebih yang ber-HPP; 0 bila tidak ada hitungan lebih; null bila semua hitungan lebihnya tanpa HPP.
    OpnameReport:
      type: object
      description: Kartu kotor (kurang dan lebih tidak saling mengurangi).
      required: [range, lossValue, lossCount, gainValue, gainCount, unknownValueCount, items]
      properties:
        range:
          $ref: "#/components/schemas/ReportRange"
        lossValue:
          type: integer
          description: Σ nilai hitungan kurang yang ber-HPP (positif).
        lossCount:
          type: integer
          description: Barang berbeda yang punya hitungan kurang.
        gainValue:
          type: integer
        gainCount:
          type: integer
        unknownValueCount:
          type: integer
          description: Hitungan selisih tanpa HPP (tidak dijumlah).
        items:
          type: array
          items:
            $ref: "#/components/schemas/OpnameReportItem"
    OpnameProductReport:
      allOf:
        - $ref: "#/components/schemas/OpnameReportItem"
        - type: object
          required: [range, dutyOnShort, counts]
          properties:
            range:
              $ref: "#/components/schemas/ReportRange"
            dutyOnShort:
              type: array
              description: |
                Per nama: di berapa jeda hitungan kurang orang itu bertugas (intervals dari shortCount),
                urut nama.
              items:
                type: object
                required: [name, intervals]
                properties:
                  name:
                    type: string
                  intervals:
                    type: integer
            counts:
              type: array
              description: Hitungan final di rentang, terbaru dulu.
              items:
                $ref: "#/components/schemas/OpnameCountRow"
    StoreSettings:
      type: object
      description: Identitas toko & struk (K13); name = KasirSettings.storeName.
      required: [name, address, receiptFooter, qrisImageUrl]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 40
        address:
          type: string
          maxLength: 120
        receiptFooter:
          type: string
          maxLength: 120
        qrisImageUrl:
          type: string
          description: Diubah hanya lewat putOwnerQrisImage.
    StoreSettingsInput:
      type: object
      description: Bagian store pada PATCH (tanpa qrisImageUrl); teks di-trim server.
      required: [name, address, receiptFooter]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 40
        address:
          type: string
          maxLength: 120
        receiptFooter:
          type: string
          maxLength: 120
    KasirScreenSettings:
      type: object
      description: Perilaku layar kasir; nilainya menjadi KasirSettings dengan nama field yang sama.
      required: [autoPrint, allowNegativeStock, curahFractions, quickCurahProductIds]
      properties:
        autoPrint:
          type: boolean
        allowNegativeStock:
          type: boolean
        curahFractions:
          type: array
          description: Pecahan curah dalam qtyBase; 1..8 angka unik, naik, masing-masing 1..100.000.
          minItems: 1
          maxItems: 8
          uniqueItems: true
          items:
            type: integer
            minimum: 1
            maximum: 100000
        quickCurahProductIds:
          type: array
          description: Paling banyak 12 id barang curah yang aktif.
          maxItems: 12
          items:
            type: string
    CreditSettings:
      type: object
      required: [defaultCreditLimit]
      properties:
        defaultCreditLimit:
          type: integer
          minimum: 0
          maximum: 100000000
          description: Limit kasbon pelanggan baru yang dibuat dari kasir (createCustomer).
    StockSettings:
      type: object
      description: Batas stok (J8); opnameItemLimit ≤ opnameSessionLimit (selain itu 422).
      required: [expirySoonDays, opnameItemLimit, opnameSessionLimit]
      properties:
        expirySoonDays:
          type: integer
          minimum: 1
          maximum: 90
        opnameItemLimit:
          type: integer
          minimum: 0
          maximum: 10000000
          description: Tahan selisih opname per barang di atas nilai ini (rupiah).
        opnameSessionLimit:
          type: integer
          minimum: 0
          maximum: 10000000
          description: Tandai sesi opname dengan total selisih di atas nilai ini (rupiah).
    ReportSettings:
      type: object
      required: [thinMarginPermille, unsoldDays]
      properties:
        thinMarginPermille:
          type: integer
          minimum: 0
          maximum: 1000
          description: Batas untung tipis dalam permil (UI persen bulat × 10).
        unsoldDays:
          type: integer
          minimum: 7
          maximum: 365
    AttentionRules:
      type: object
      description: |
        Ambang Perlu perhatian (S2, S3, S6, K7), semua dibandingkan ketat dan dibaca saat ini (bukan
        salinan saat kejadian). Selisih kas |d| ≥ cashDiffMin = kejadian selisih_kas; −cashDiffMin <
        d < 0 = selisih kecil, butir bila Σ satu kasir dalam 7 hari > smallShortageWeekMax; kas
        keluar > expenseSingleMax atau Σ satu shift > expenseShiftMax = kas_keluar; shift buka >
        shiftMaxHours jam = shift_lama. qrisDailyReconcile (Pencocokan QRIS harian, bawaan aktif):
        false → Attention.qrisUnreconciled selalu null (endpoint QRIS harian tetap berjalan). Aturan
        murni yang sama dipakai app (shared/lib/attention-rules).
      required: [cashDiffMin, smallShortageWeekMax, expenseSingleMax, expenseShiftMax, shiftMaxHours, qrisDailyReconcile]
      properties:
        cashDiffMin:
          type: integer
          minimum: 0
          maximum: 10000000
        smallShortageWeekMax:
          type: integer
          minimum: 0
          maximum: 10000000
        expenseSingleMax:
          type: integer
          minimum: 0
          maximum: 10000000
        expenseShiftMax:
          type: integer
          minimum: 0
          maximum: 10000000
        shiftMaxHours:
          type: integer
          minimum: 1
          maximum: 24
        qrisDailyReconcile:
          type: boolean
          description: |
            Pencocokan QRIS harian (bawaan true). false → butir QRIS belum dicocokkan tidak pernah
            muncul (Attention.qrisUnreconciled null); daftar, rincian, dan tanda QRIS harian tetap bisa
            dipakai.
    OwnerSettings:
      type: object
      description: Pengaturan lengkap pemilik; hanya di /api/owner.
      required: [store, kasir, credit, stock, report, attention, ownerPhone]
      properties:
        store:
          $ref: "#/components/schemas/StoreSettings"
        kasir:
          $ref: "#/components/schemas/KasirScreenSettings"
        credit:
          $ref: "#/components/schemas/CreditSettings"
        stock:
          $ref: "#/components/schemas/StockSettings"
        report:
          $ref: "#/components/schemas/ReportSettings"
        attention:
          $ref: "#/components/schemas/AttentionRules"
        ownerPhone:
          type: string
          nullable: true
          minLength: 8
          maxLength: 16
          pattern: '^[0-9+ -]+$'
          description: Ditampilkan di dialog alasan kasir (R11) lewat KasirSettings.ownerPhone.
    OwnerSettingsPatch:
      type: object
      description: |
        Satu bagian per PATCH (K13): setiap bagian opsional, bagian yang dikirim harus utuh.
        ownerPhone tidak dikirim = tidak berubah; null = dihapus.
      properties:
        store:
          $ref: "#/components/schemas/StoreSettingsInput"
        kasir:
          $ref: "#/components/schemas/KasirScreenSettings"
        credit:
          $ref: "#/components/schemas/CreditSettings"
        stock:
          $ref: "#/components/schemas/StockSettings"
        report:
          $ref: "#/components/schemas/ReportSettings"
        attention:
          $ref: "#/components/schemas/AttentionRules"
        ownerPhone:
          type: string
          nullable: true
          minLength: 8
          maxLength: 16
          pattern: '^[0-9+ -]+$'
    ThinMarginPreview:
      type: object
      required: [flagged, total]
      properties:
        flagged:
          type: integer
          minimum: 0
          description: Barang yang tertandai untung tipis pada batas yang diminta.
        total:
          type: integer
          minimum: 0
          description: Barang yang dinilai (aktif, ber-HPP, harga eceran > 0).
    OwnerKasirAccount:
      type: object
      description: Akun kasir untuk pemilik; tanpa PIN.
      required: [id, name, active, onShift, lockedUntil]
      properties:
        id:
          type: string
        name:
          type: string
        active:
          type: boolean
          description: false = tidak bisa masuk di kasir maupun HP toko; riwayat tetap.
        onShift:
          type: boolean
          description: Memegang shift yang sedang buka (tidak bisa dinonaktifkan).
        lockedUntil:
          type: integer
          format: int64
          nullable: true
          description: Akhir kunci PIN yang masih berlaku (terlama dari dua realm); null bila tidak terkunci.
    KasirAccountInput:
      type: object
      required: [name, pin]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 30
          description: 1..30 karakter setelah trim; unik tanpa beda huruf besar/kecil.
        pin:
          type: string
          pattern: '^\d{6}$'
    KasirAccountPatch:
      type: object
      description: Field yang tidak dikirim tidak berubah.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 30
        active:
          type: boolean
    KasirPinReset:
      type: object
      required: [pin]
      properties:
        pin:
          type: string
          pattern: '^\d{6}$'
    OwnerShiftRow:
      type: object
      required: [id, kasirName, openedAt, closedAt, countedCash, difference]
      properties:
        id:
          type: string
        kasirName:
          type: string
        openedAt:
          type: integer
          format: int64
        closedAt:
          type: integer
          format: int64
          nullable: true
          description: null = shift sedang buka.
        countedCash:
          type: integer
          nullable: true
          description: Uang fisik saat tutup; null bila shift buka.
        difference:
          type: integer
          nullable: true
          description: Selisih tutup shift; null bila shift buka.
    OwnerShiftList:
      type: object
      required: [date, items, takes, openKasirName]
      properties:
        date:
          type: string
          format: date
        items:
          type: array
          description: Shift tanggal itu, openedAt terbaru dulu.
          items:
            $ref: "#/components/schemas/OwnerShiftRow"
        takes:
          type: array
          description: Pengambilan uang pemilik di sela shift (shiftId null) pada tanggal itu, terbaru dulu.
          items:
            $ref: "#/components/schemas/OwnerCashTake"
        openKasirName:
          type: string
          nullable: true
          description: Kasir shift yang sedang buka sekarang; null bila tidak ada.
    OwnerShiftDetail:
      type: object
      description: |
        Rincian laci satu shift: semua field ShiftClosure (countedCash dan difference null selagi
        shift buka; expectedCash shift buka = uang seharusnya sejauh ini) ditambah data pemilik.
        Rumus tunggal: expectedCash = openingCash + cashSales − supplierPayments + creditPayments −
        saleRefunds − expenses − ownerTakes.
      required: [shiftId, openingCash, cashSales, supplierPayments, creditPayments, saleRefunds, expenses, ownerTakes, expectedCash, countedCash, difference, salesCount, kasirName, openedAt, closedAt, suggestedOpening, openingNote, expenseItems, ownerTakeItems, qrisSales, qrisRepayments]
      properties:
        shiftId:
          type: string
        openingCash:
          type: integer
        cashSales:
          type: integer
        supplierPayments:
          type: integer
        creditPayments:
          type: integer
        saleRefunds:
          type: integer
        expenses:
          type: integer
        ownerTakes:
          type: integer
        expectedCash:
          type: integer
        countedCash:
          type: integer
          nullable: true
        difference:
          type: integer
          nullable: true
        salesCount:
          type: integer
        kasirName:
          type: string
        openedAt:
          type: integer
          format: int64
        closedAt:
          type: integer
          format: int64
          nullable: true
        suggestedOpening:
          type: integer
          nullable: true
          description: Saran modal saat shift dibuka (S4); null bila tanpa saran.
        openingNote:
          type: string
          nullable: true
          description: Alasan modal berbeda dari saran; null bila modal sama atau tanpa saran.
        expenseItems:
          type: array
          description: Semua kas keluar shift ini termasuk yang dibatalkan, urut jam.
          items:
            $ref: "#/components/schemas/OwnerDrawerExpense"
        ownerTakeItems:
          type: array
          description: Pengambilan uang pemilik di dalam shift ini termasuk yang dibatalkan, urut jam.
          items:
            $ref: "#/components/schemas/OwnerCashTake"
        qrisSales:
          type: integer
          description: Σ bagian QRIS penjualan shift ini yang tidak dibatalkan (tidak masuk laci).
        qrisRepayments:
          type: integer
          description: Σ pelunasan kasir QRIS shift ini yang tidak dibatalkan (tidak masuk laci).
    OwnerCashTakeInput:
      type: object
      required: [id, amount]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 64
          description: ID dari klien (idempotensi per pembuat).
        amount:
          type: integer
          minimum: 1
        note:
          type: string
          nullable: true
          maxLength: 200
          description: Catatan opsional; kosong setelah trim disimpan null.
    CashTakeCancel:
      type: object
      required: [at, byName, reason]
      properties:
        at:
          type: integer
          format: int64
          description: Jam server saat dibatalkan (epoch ms UTC).
        byName:
          type: string
        reason:
          type: string
    OwnerCashTake:
      type: object
      description: |
        Pengambilan uang dari laci oleh pemilik (S5). cancellable = bisa dibatalkan sekarang (K9):
        belum dibatalkan dan (shiftId ≠ null dan shift itu masih buka, atau shiftId null dan belum
        terpakai). Keterangan terkunci di UI: consumedByKasirName ≠ null → sudah dipakai modal shift
        kasir itu; shiftId ≠ null → shift tempatnya sudah tutup.
      required: [id, at, amount, note, shiftId, shiftKasirName, consumedByKasirName, cancelled, cancellable]
      properties:
        id:
          type: string
        at:
          type: integer
          format: int64
          description: Jam server saat dicatat (epoch ms UTC).
        amount:
          type: integer
          minimum: 1
        note:
          type: string
          nullable: true
        shiftId:
          type: string
          nullable: true
          description: Shift yang sedang buka saat diambil (masuk ownerTakes shift itu); null = diambil di sela shift.
        shiftKasirName:
          type: string
          nullable: true
          description: Kasir shift shiftId; null bila shiftId null.
        consumedByKasirName:
          type: string
          nullable: true
          description: Pengambilan sela yang sudah terpakai modal shift berikutnya → kasir shift itu; selain itu null.
        cancelled:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/CashTakeCancel"
        cancellable:
          type: boolean
    QrisDayStatus:
      type: string
      description: belum = belum ditandai, atau total berubah setelah ditandai (K21).
      enum: [belum, cocok, tidak_cocok]
    QrisDay:
      type: object
      description: |
        Total QRIS satu hari Asia/Jakarta (S7, K11). total = sales + repayments (tidak termasuk yang
        dibatalkan); voidedCount/voidedTotal = transaksi QRIS yang dibatalkan (bagian QRIS saja).
        changedAfterMark = sudah ditandai tetapi total sekarang ≠ total saat ditandai → status
        dibaca belum (note, markedByName, markedAt tetap tanda lama). closed = hari sudah selesai
        (sebelum hari ini); hanya hari closed yang bisa ditandai.
      required: [date, sales, repayments, total, voidedCount, voidedTotal, status, note, markedByName, markedAt, closed, changedAfterMark]
      properties:
        date:
          type: string
          format: date
        sales:
          type: integer
        repayments:
          type: integer
        total:
          type: integer
        voidedCount:
          type: integer
        voidedTotal:
          type: integer
        status:
          $ref: "#/components/schemas/QrisDayStatus"
        note:
          type: string
          nullable: true
        markedByName:
          type: string
          nullable: true
        markedAt:
          type: integer
          format: int64
          nullable: true
        closed:
          type: boolean
        changedAfterMark:
          type: boolean
    QrisDayList:
      type: object
      required: [month, items]
      properties:
        month:
          type: string
          nullable: true
          description: Bulan YYYY-MM yang diminta; null untuk unreconciled = true.
        items:
          type: array
          items:
            $ref: "#/components/schemas/QrisDay"
    QrisMarkInput:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [cocok, tidak_cocok]
        note:
          type: string
          nullable: true
          maxLength: 200
          description: Wajib untuk tidak_cocok (1..200 setelah trim); opsional untuk cocok.
    QrisTransaction:
      type: object
      description: Satu transaksi QRIS hari itu (S11); amount = bagian QRIS saja.
      required: [at, amount, kind, kasirName, ref, status]
      properties:
        at:
          type: integer
          format: int64
        amount:
          type: integer
        kind:
          type: string
          enum: [penjualan, pelunasan]
        kasirName:
          type: string
        ref:
          type: string
          description: Nomor struk (penjualan) atau nama pelanggan (pelunasan).
        status:
          type: string
          enum: [aktif, dibatalkan]
    QrisDayDetail:
      allOf:
        - $ref: "#/components/schemas/QrisDay"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              description: Transaksi QRIS hari itu urut jam, termasuk yang dibatalkan.
              items:
                $ref: "#/components/schemas/QrisTransaction"
