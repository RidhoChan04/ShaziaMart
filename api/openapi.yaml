          type: string
        productName:
          type: string
        unitId:
          type: string
        unitName:
          type: string
        unitSize:
          type: integer
          minimum: 1
        qty:
          type: integer
        unitCost:
          type: integer
        subtotal:
          type: integer
        expiryDate:
          type: string
          format: date
          nullable: true
        newProduct:
          type: boolean
          description: Barang dibuat dari baris ini.
    StaffReceipt:
