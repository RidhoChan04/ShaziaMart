  /api/owner/customers/{customerId}/payments:
    post:
      tags: [owner]
      operationId: createOwnerCreditPayment
      summary: Catat pelunasan kasbon langsung ke pemilik
      description: |
        Jalur pemilik (channel pemilik): method hanya transfer atau titip (tunai ke pemilik). Uang
        pemilik tidak pernah masuk laci kasir: tanpa shift (shiftId null), tanpa baris laci, tanpa
        struk. Jumlah: bilangan bulat 1 ≤ amount ≤ saldo kasbon (boleh sebagian, maksimal sisa
        kasbon; lebih → 422 VALIDATION). Cicilan FIFO: melunasi kasbon belum lunas tertua dulu.
        Waktu dari jam server.
        Idempoten menurut (pembuat, id); id global lintas jalur kasir dan pemilik. id yang sama milik
        pengguna ini → 200 pelanggan sekarang tanpa entri buku kedua; id sudah dipakai pengguna lain
        → 409 ID_TAKEN. Replay id yang sudah dibatalkan mengembalikan 200 dengan rekaman berstatus
        dibatalkan (baris riwayat dengan payment.id itu memuat cancelled); klien wajib
        memperlakukannya sebagai belum tersimpan (lepas id, tanpa pesan tersimpan, simpan berikutnya
        memakai id baru).
      security:
        - ownerCookieAuth: []
      parameters:
        - $ref: "#/components/parameters/CustomerId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OwnerCreditPaymentInput"
      responses:
        "200":
          description: id sudah pernah disimpan pengguna ini (replay); pelanggan dikembalikan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerCustomer"
        "201":
          description: Pelunasan dicatat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerCustomer"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/IdTaken"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/owner/credit-payments/{paymentId}/cancel:
    post:
      tags: [owner]
      operationId: cancelOwnerCreditPayment
      summary: Batalkan pelunasan dari app pemilik (alasan wajib)
      description: |
        Pembatalan dari app pemilik tidak pernah mengoreksi laci: buku kasbon bertambah lagi sebesar
        amount (entri pembalik dengan paymentId sama), laci tidak dikoreksi, termasuk untuk
        pelunasan tunai jalur kasir (uang dikembalikan pemilik). Urutan pemeriksaan: id tidak dikenal
        → 404; sudah dibatalkan → 200 pelanggan apa adanya tanpa perubahan; reason kosong (setelah
        trim) atau > 200 karakter → 422 VALIDATION; pelunasan jalur kasir dari shift yang sedang buka
        → 409 IN_OPEN_SHIFT (batalkan dari kasir). Tercatat cancelledAt (jam server), pembatal,
        channel pemilik, dan alasan. Respons = pelanggan pemilik pelunasan itu.
      security:
        - ownerCookieAuth: []
      parameters:
        - $ref: "#/components/parameters/PaymentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelCreditPaymentInput"
      responses:
        "200":
          description: Pelunasan dibatalkan (atau sudah dibatalkan sebelumnya)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerCustomer"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: IN_OPEN_SHIFT — pelunasan kasir di shift yang masih buka
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/owner/sales:
    get:
      tags: [owner]
      operationId: listOwnerSales
      summary: Transaksi satu hari (Lainnya > Transaksi)
      description: |
        Penjualan semua status dengan createdAt pada tanggal Asia/Jakarta date (bawaan hari ini),
        terbaru dulu; q = sebagian nomor struk (disaring di tanggal itu). date bukan tanggal
        YYYY-MM-DD yang sah → 422 VALIDATION. methodLabel = label metode kasir (Tunai, QRIS, Kasbon,
        atau Campuran bila lebih dari satu metode). shiftOpen = penjualan milik shift yang sedang
        buka (batal hanya dari kasir).
      security:
        - ownerCookieAuth: []
      parameters:
        - name: date
          in: query
          required: false
          description: Tanggal Asia/Jakarta YYYY-MM-DD; bawaan hari ini.
          schema:
            type: string
            format: date
        - name: q
          in: query
          required: false
          description: Sebagian nomor struk.
          schema:
            type: string
            maxLength: 20
      responses:
        "200":
          description: Transaksi hari itu
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OwnerSaleRow"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/owner/sales/{saleId}:
    get:
      tags: [owner]
      operationId: getOwnerSale
      summary: Detail transaksi untuk pemilik
      description: |
        Barang, pembayaran, pelanggan, dan (bila dibatalkan) siapa, jam, alasan, jalur, serta
        pengembaliannya; kasbon lewat limit membawa kelebihan dan alasannya. Tanpa HPP.
      security:
        - ownerCookieAuth: []
      parameters:
        - $ref: "#/components/parameters/SaleId"
      responses:
        "200":
          description: Detail transaksi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerSale"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/owner/sales/{saleId}/void:
    post:
      tags: [owner]
      operationId: voidOwnerSale
      summary: Batalkan transaksi dari app pemilik (alasan wajib)
      description: |
        Pembatalan dari app pemilik tidak pernah mengoreksi laci (jawaban pemilik Q1): cashSales
        shift penjualan dan shift yang sedang buka tidak berubah, tanpa ShiftClosure.saleRefunds;
        uang dikembalikan pemilik. Urutan pemeriksaan: id tidak dikenal → 404; sudah dibatalkan →
        200 apa adanya tanpa perubahan; reason kosong (setelah trim) atau > 200 karakter → 422
        VALIDATION; penjualan dari shift yang masih buka → 409 IN_OPEN_SHIFT (batalkan dari kasir).
        Umur transaksi tidak dibatasi. Berhasil: stok kembali, bagian kasbon dibatalkan di buku
        (saldo boleh minus — Lebih bayar; pelunasan yang sudah diterima tidak ikut batal).
        qrisRefundSource diabaikan (bagian QRIS dicatat pemilik). Tercatat jam server, pembatal (id
        + nama), alasan, dan jalur pemilik; bukan butir Perlu perhatian.
      security:
        - ownerCookieAuth: []
      parameters:
        - $ref: "#/components/parameters/SaleId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoidRequest"
      responses:
        "200":
          description: Transaksi dibatalkan (atau sudah dibatalkan sebelumnya)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerSale"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: IN_OPEN_SHIFT — transaksi dari shift yang masih buka
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/owner/exceptions:
    get:
      tags: [owner]
      operationId: listOwnerExceptions
      summary: Kejadian Perlu perhatian satu jenis sejak terakhir ditinjau
      description: |
        Kejadian jenis kind dengan at > reviewedAt (semua kejadian bila belum pernah ditinjau),
        tanpa batas umur kecuali selisih_kecil, terbaru dulu. Kejadian adalah tampilan turunan dari
        rekaman (penjualan, pelunasan, shift tutup dan buka, kas keluar, catatan modal); ambang
        dibaca dari AttentionRules saat ini (K7), bukan salinan saat kejadian, jadi mengubah
        Pengaturan langsung mengubah daftar. Semua ambang dibandingkan ketat. batal_transaksi =
        penjualan yang dibatalkan kasir (amount = total transaksi); batal_pelunasan = pelunasan
        yang dibatalkan kasir (amount = nominal pelunasan); kasbon_lewat_limit = penjualan kasbon
        lewat limit yang tidak dibatalkan (amount = kelebihan limit); batal_kas_keluar = kas keluar
        yang dibatalkan kasir (S10; at = jam batal, amount = nominal, reason = alasan batal,
        kasirName = pembatal); selisih_kas = shift tutup dengan |difference| ≥ cashDiffMin (at =
        closedAt, amount = difference bertanda, reason null); kas_keluar (K4) = (a) tiap kas keluar
        aktif dengan amount > expenseSingleMax (id = id kas keluar, at = jam catat, amount =
        nominal, reason = alasannya) dan (b) tiap shift yang Σ kas keluar aktifnya >
        expenseShiftMax, satu kejadian per shift (id = kas_keluar_shift-{shiftId}, at = jam kas
        keluar yang pertama membuat Σ lewat, amount = Σ shift saat ini, reason null), keduanya bisa
        muncul untuk shift yang sama; serah_terima (K22) = shift dengan suggestedOpening ≠ null dan
        openingCash ≠ suggestedOpening (at = openedAt, amount = openingCash − suggestedOpening,
        reason = openingNote); shift_lama (K5) = shift tutup atau buka dengan (closedAt ?? jam
        server) − openedAt > shiftMaxHours jam (at = openedAt + shiftMaxHours jam, amount 0,
        durationMinutes = menit penuh sampai tutup atau sampai jam server, reason null);
        selisih_kecil (K6, K18) = shift tutup milik kasirId dengan −cashDiffMin < difference < 0 dan
        closedAt > jam server − 7 hari dan closedAt > reviewedAt kasir itu (amount = difference,
        reason null); kasirId wajib untuk selisih_kecil (tanpa → 422) dan diabaikan jenis lain.
        Kas keluar yang dibatalkan tidak ikut kas_keluar. Pembatalan oleh pemilik bukan kejadian.
        kind tidak dikenal → 422.
      security:
        - ownerCookieAuth: []
      parameters:
        - name: kind
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/ExceptionKind"
        - name: kasirId
          in: query
          required: false
          description: Wajib untuk selisih_kecil (penanda tinjau per kasir, K18); diabaikan jenis lain.
          schema:
            type: string
      responses:
        "200":
          description: Pengecualian yang belum ditinjau
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerExceptionList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/owner/exceptions/review:
    post:
      tags: [owner]
      operationId: reviewOwnerExceptions
      summary: Tandai kejadian satu jenis sudah ditinjau
      description: |
        reviewedAt = max(reviewedAt lama, min(upTo, jam server)); idempoten dan tidak pernah
        mundur. upTo = jam kejadian terbaru yang dilihat pemilik (ExceptionAttention.latestAt saat
        ditinjau langsung dari daftar Perlu perhatian, S8), sehingga kejadian yang masuk setelah
        daftar dimuat tetap muncul. selisih_kecil memakai penanda per kasir (K18): kasirId wajib
        (tanpa → 422 VALIDATION) dan hanya penanda kasir itu yang maju; jenis lain mengabaikan
        kasirId. Respons = daftar jenis itu (untuk selisih_kecil: kasir itu) setelah ditinjau.
      security:
        - ownerCookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExceptionReviewInput"
      responses:
        "200":
          description: Daftar setelah ditinjau
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerExceptionList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/owner/settings:
    get:
      tags: [owner]
      operationId: getOwnerSettings
      summary: Pengaturan toko pemilik (semua bagian)
      description: |
        Satu sumber nilai (K19): store.name = KasirSettings.storeName, attention.shiftMaxHours =
        KasirSettings.shiftMaxHours, stock = batas opname & kedaluwarsa (J8), report = batas
        laporan stok, credit.defaultCreditLimit = limit pelanggan baru dari kasir.
      security:
        - ownerCookieAuth: []
      responses:
        "200":
          description: Pengaturan lengkap
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      tags: [owner]
      operationId: updateOwnerSettings
      summary: Ubah satu bagian Pengaturan
      description: |
        (K13) Satu PATCH per bagian: setiap bagian opsional, tetapi bagian yang dikirim harus utuh;
        bagian yang tidak dikirim tidak berubah. ownerPhone tidak dikirim = tidak berubah, null =
        dihapus. Validasi (galat → 422 VALIDATION dengan detail berbahasa Indonesia, tanpa menyimpan
        bagian mana pun): store.name 1..40 karakter setelah trim; store.address dan
        store.receiptFooter 0..120 karakter setelah trim; kasir.curahFractions 1..8 angka unik naik
        1..100.000; kasir.quickCurahProductIds ≤ 12 id barang curah aktif; credit.defaultCreditLimit
        0..100.000.000; stock.expirySoonDays 1..90; stock.opnameItemLimit dan
        stock.opnameSessionLimit 0..10.000.000 dengan opnameItemLimit ≤ opnameSessionLimit;
        report.thinMarginPermille 0..1000; report.unsoldDays 7..365; attention: batas uang
        0..10.000.000 dan shiftMaxHours 1..24; ownerPhone null atau 8..16 karakter ^[0-9+ -]+$.
        store.name sekaligus menjadi KasirSettings.storeName (K19); attention.shiftMaxHours menjadi
        KasirSettings.shiftMaxHours. Ambang baru langsung berlaku untuk butir Perlu perhatian (K7)
        dan batas stok/laporan. Identitas toko dan catatan kaki dipakai struk yang dicetak server.
        Respons = OwnerSettings lengkap.
      security:
        - ownerCookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OwnerSettingsPatch"
      responses:
        "200":
          description: Pengaturan setelah diubah
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/owner/settings/thin-margin-preview:
    get:
      tags: [owner]
      operationId: getOwnerThinMarginPreview
      summary: Pratinjau jumlah barang untung tipis pada batas tertentu
      description: |
        Hitungan sama dengan laporan stok untung tipis pada batas permille ini, tanpa menyimpan
        apa pun: flagged = barang aktif ber-HPP dengan harga eceran > 0 yang (harga − modal) × 1000 <
        permille × harga; total = semua barang aktif ber-HPP dengan harga eceran > 0. permille di
        luar 0..1000 atau bukan bilangan bulat → 422 VALIDATION.
      security:
        - ownerCookieAuth: []
      parameters:
        - name: permille
          in: query
          required: true
          description: Batas margin eceran dalam permil (UI persen bulat × 10).
          schema:
            type: integer
            minimum: 0
            maximum: 1000
      responses:
        "200":
          description: Pratinjau
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThinMarginPreview"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/owner/settings/qris-image:
    put:
      tags: [owner]
      operationId: putOwnerQrisImage
      summary: Unggah gambar QRIS toko
      description: |
        PNG atau JPEG (Content-Type sesuai berkas; server memeriksa isi berkas), paling besar 1 MB;
        selain itu 422 VALIDATION. Gambar lama diganti; URL baru
        (getQrisImage) menjadi store.qrisImageUrl dan KasirSettings.qrisImageUrl. Respons =
        OwnerSettings lengkap.
      security:
        - ownerCookieAuth: []
      requestBody:
        required: true
        content:
          image/png:
            schema:
              type: string
              format: binary
          image/jpeg:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Gambar tersimpan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/owner/kasir-accounts:
    get:
      tags: [owner]
      operationId: listOwnerKasirAccounts
      summary: Akun kasir (aktif dan nonaktif)
      description: |
        Semua pengguna ber-role kasir, urut nama; pemilik tidak pernah ada di daftar. PIN tidak
        pernah dikirim. onShift = orang itu memegang shift yang sedang buka. lockedUntil = jam
        berakhirnya kunci PIN yang masih berlaku, yang terlama dari dua realm (PIN kasir di PC dan
        PIN HP toko); null bila tidak terkunci.
      security:
        - ownerCookieAuth: []
      responses:
        "200":
          description: Akun kasir
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OwnerKasirAccount"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [owner]
      operationId: createOwnerKasirAccount
      summary: Tambah akun kasir
      description: |
        (K12) name 1..30 karakter setelah trim, unik tanpa beda huruf besar/kecil di semua pengguna
        termasuk pemilik → 409 NAME_TAKEN; pin tepat 6 angka → selain itu 422 VALIDATION. Akun baru
        aktif, role kasir, langsung muncul di listKasirUsers (PC) dan listStaffUsers (HP toko).
        Klik ganda aman: permintaan kedua dengan nama sama → 409 NAME_TAKEN.
      security:
        - ownerCookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KasirAccountInput"
      responses:
        "201":
          description: Akun dibuat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerKasirAccount"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: NAME_TAKEN — nama sudah dipakai pengguna lain
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/owner/kasir-accounts/{userId}:
    patch:
      tags: [owner]
      operationId: updateOwnerKasirAccount
      summary: Ubah nama atau aktif/nonaktifkan akun kasir
      description: |
        (K12) Urutan pemeriksaan: id tidak dikenal atau bukan kasir → 404; name (bila dikirim) 1..30
        karakter setelah trim → 422 VALIDATION, dipakai pengguna lain (tanpa beda huruf besar/kecil)
        → 409 NAME_TAKEN; active false saat orang itu memegang shift yang sedang buka → 409
        KASIR_ON_SHIFT. Nonaktif: hilang dari listKasirUsers dan listStaffUsers, login PIN di kedua
        realm → 401 PIN_INVALID tanpa menambah hitungan kunci, sesi kasir dan sesi HP toko orang itu
        dihapus (request berikutnya 401; requireSession menolak pengguna nonaktif, K22). Riwayat
        tetap tersimpan. Ganti nama tidak mengubah salinan nama lama (shift, penjualan, nota).
        Mengaktifkan lagi → bisa login dengan PIN lama.
      security:
        - ownerCookieAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KasirAccountPatch"
      responses:
        "200":
          description: Akun setelah diubah
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerKasirAccount"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: NAME_TAKEN (nama dipakai pengguna lain) atau KASIR_ON_SHIFT (masih memegang shift buka)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/owner/kasir-accounts/{userId}/pin:
    post:
      tags: [owner]
      operationId: resetOwnerKasirPin
      summary: Atur ulang PIN kasir
      description: |
        (K12) pin tepat 6 angka → selain itu 422 VALIDATION; id tidak dikenal atau bukan kasir → 404.
        Sekaligus mengosongkan hitungan PIN salah dan kunci orang itu di kedua realm (PC kasir dan
        HP toko). PIN tidak pernah dikirim balik.
      security:
        - ownerCookieAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KasirPinReset"
      responses:
        "200":
          description: PIN diganti
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerKasirAccount"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/owner/shifts:
    get:
      tags: [owner]
      operationId: listOwnerShifts
      summary: Shift satu hari (Lainnya > Shift & kas)
      description: |
        items = shift yang openedAt-nya jatuh pada tanggal Asia/Jakarta date (bawaan hari ini),
        ditambah shift yang sedang buka bila date = hari ini walau dibuka kemarin; urut openedAt
        terbaru dulu. Shift buka: closedAt, countedCash, dan difference null. takes = pengambilan
        uang pemilik di sela shift (shiftId null) dengan at pada tanggal itu, termasuk yang
        dibatalkan, terbaru dulu (pengambilan di dalam shift ada di rincian shift itu).
        openKasirName = kasir shift yang sedang buka sekarang (apa pun tanggalnya), null bila tidak
        ada; dipakai keterangan lembar Ambil uang dari laci. date bukan tanggal YYYY-MM-DD yang sah →
        422 VALIDATION.
      security:
        - ownerCookieAuth: []
      parameters:
        - name: date
          in: query
          required: false
          description: Tanggal Asia/Jakarta YYYY-MM-DD; bawaan hari ini.
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Shift hari itu
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerShiftList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/owner/shifts/{shiftId}:
    get:
      tags: [owner]
      operationId: getOwnerShift
      summary: Rincian laci satu shift
      description: |
        Shift tutup: angka closure tersimpan apa adanya (tidak pernah dihitung ulang). Shift buka:
        angka laci sekarang dari rumus laci yang sama dengan tutup shift, countedCash dan difference
        null. Satu rumus: expectedCash = openingCash + cashSales − supplierPayments + creditPayments −
        saleRefunds − expenses − ownerTakes. expenseItems = semua kas keluar shift itu termasuk yang
        dibatalkan, urut jam; ownerTakeItems = pengambilan uang pemilik di dalam shift itu (shiftId
        = shift ini) termasuk yang dibatalkan, urut jam. qrisSales = Σ bagian QRIS penjualan shift
        ini yang tidak dibatalkan; qrisRepayments = Σ pelunasan kasir QRIS shift ini yang tidak
        dibatalkan (keduanya tidak masuk laci). id tidak dikenal → 404.
      security:
        - ownerCookieAuth: []
      parameters:
        - $ref: "#/components/parameters/ShiftId"
      responses:
        "200":
          description: Rincian shift
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerShiftDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/owner/cash-takes:
    post:
      tags: [owner]
      operationId: createOwnerCashTake
      summary: Ambil uang dari laci (pemilik)
      description: |
        (S5, K9) Kapan saja. Ada shift buka → shiftId = shift itu dan masuk ShiftClosure.ownerTakes
        shift itu (uang seharusnya turun, baris Diambil pemilik). Tanpa shift buka → shiftId null,
        mengurangi saran modal shift berikutnya (OpeningSuggestion.ownerTakes) sampai terpakai saat
        shift berikutnya dibuka. Bukan kejadian Perlu perhatian. Urutan pemeriksaan: sesi → id
        kosong atau > 64 karakter → 422 VALIDATION → id sudah dipakai: milik pengguna ini → 200
        rekaman tersimpan apa adanya tanpa pengambilan kedua (isi body baru diabaikan), milik
        pengguna lain → 409 ID_TAKEN → amount bukan bilangan bulat ≥ 1 atau note > 200 karakter →
        422 VALIDATION. Idempoten menurut (pembuat, id). note kosong setelah trim disimpan null.
        Replay id yang sudah dibatalkan mengembalikan 200 dengan rekaman berstatus dibatalkan
        (cancelled terisi); klien wajib memperlakukannya sebagai belum tersimpan (lepas id, simpan
        berikutnya memakai id baru). at = jam server.
      security:
        - ownerCookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OwnerCashTakeInput"
      responses:
        "200":
          description: id sudah pernah disimpan pengguna ini; rekaman lama dikembalikan (replay)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerCashTake"
        "201":
          description: Pengambilan dicatat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerCashTake"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/IdTaken"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/owner/cash-takes/{takeId}/cancel:
    post:
      tags: [owner]
      operationId: cancelOwnerCashTake
      summary: Batalkan pengambilan uang yang salah (alasan wajib)
      description: |
        (S5, K9) Efeknya dibalik di shift atau modal yang sama, hanya selagi masih bisa dibalik.
        Urutan pemeriksaan: id tidak dikenal → 404; sudah dibatalkan → 200 rekaman apa adanya tanpa
        perubahan; reason kosong (setelah trim) atau > 200 karakter → 422 VALIDATION; tidak bisa
        dibalik lagi → 409 CASH_TAKE_LOCKED tanpa mengubah angka apa pun. Bisa dibalik bila shiftId ≠
        null dan shift itu masih buka (ShiftClosure.ownerTakes shift itu turun), atau shiftId null dan
        belum terpakai shift berikutnya (saran modal naik lagi). Shift tempatnya sudah tutup, atau
        pengambilan sela sudah terpakai modal shift berikutnya → terkunci. Tercatat cancelledAt (jam
        server), pembatal, dan alasan.
      security:
        - ownerCookieAuth: []
      parameters:
        - $ref: "#/components/parameters/TakeId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelCreditPaymentInput"
      responses:
        "200":
          description: Pengambilan dibatalkan (atau sudah dibatalkan sebelumnya)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerCashTake"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: CASH_TAKE_LOCKED — shift tempatnya sudah tutup atau sudah dipakai modal shift berikutnya
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/owner/expenses/{expenseId}/cancel:
    post:
      tags: [owner]
      operationId: cancelOwnerExpense
      summary: Batalkan kas keluar dari app pemilik (alasan wajib)
      description: |
        (S10) Pembatalan dari app pemilik tidak pernah menyentuh laci: closure shift tutup tidak
        berubah dan shift yang sedang buka tidak berubah. Urutan pemeriksaan: id tidak dikenal →
        404; sudah dibatalkan → 200 rekaman apa adanya tanpa perubahan; reason kosong (setelah trim)
        atau > 200 karakter → 422 VALIDATION; kas keluar dari shift yang masih buka → 409
        IN_OPEN_SHIFT (batalkan dari kasir). Tercatat cancelledAt (jam server), pembatal, channel
        pemilik, dan alasan; bukan kejadian Perlu perhatian. Kas keluar yang dibatalkan tidak lagi
        ikut kejadian kas_keluar.
      security:
        - ownerCookieAuth: []
      parameters:
        - $ref: "#/components/parameters/ExpenseId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelCreditPaymentInput"
      responses:
        "200":
          description: Kas keluar dibatalkan (atau sudah dibatalkan sebelumnya)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerDrawerExpense"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: IN_OPEN_SHIFT — kas keluar di shift yang masih buka
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/owner/qris-days:
    get:
      tags: [owner]
      operationId: listOwnerQrisDays
      summary: Total QRIS per hari dan tanda pencocokan (Lainnya > QRIS harian)
      description: |
        (S7, K11, K21) Hari = tanggal Asia/Jakarta createdAt. sales = Σ bagian QRIS penjualan yang
        tidak dibatalkan; repayments = Σ pelunasan kasir QRIS yang tidak dibatalkan; total = sales +
        repayments; voidedCount/voidedTotal = penjualan QRIS dan pelunasan QRIS yang dibatalkan
        (bagian QRIS saja; info, tidak masuk total). Status dibaca: tanda tersimpan, kecuali total
        sekarang ≠ total saat ditandai → belum dengan changedAfterMark true (dihitung lagi di butir).
        Tanpa unreconciled: hari di bulan month (bawaan bulan ini) sampai hari ini dengan total > 0,
        voidedCount > 0, atau bertanda; terbaru dulu; QrisDayList.month = bulan itu. unreconciled =
        true: semua hari yang dihitung butir QRIS belum dicocokkan (sejak QRIS harian mulai dipakai,
        sebelum hari ini, total > 0, status belum), lintas bulan, terlama dulu; month diabaikan dan
        QrisDayList.month null. Tetap berjalan walau AttentionRules.qrisDailyReconcile false (hanya
        butir Perlu perhatiannya yang mati). month bukan YYYY-MM yang sah → 422 VALIDATION.
      security:
        - ownerCookieAuth: []
      parameters:
        - name: month
          in: query
          required: false
          description: Bulan Asia/Jakarta YYYY-MM; bawaan bulan ini.
          schema:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])$'
        - name: unreconciled
          in: query
          required: false
          description: true = hanya hari yang belum dicocokkan (lembar Cocokkan, S11).
          schema:
            type: boolean
      responses:
        "200":
          description: Hari QRIS
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QrisDayList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/owner/qris-days/{date}:
    get:
      tags: [owner]
      operationId: getOwnerQrisDay
      summary: Rincian QRIS satu hari beserta transaksinya
      description: |
        (S11) QrisDay hari itu (aturan sama dengan listOwnerQrisDays) + items = transaksi QRIS hari
        itu urut jam: penjualan dengan bagian QRIS (amount = bagian QRIS saja, ref = nomor struk,
        kasirName = kasir penjual) dan pelunasan kasir QRIS (ref = nama pelanggan, kasirName =
        pencatat); yang dibatalkan ikut dengan status dibatalkan. Σ amount items aktif = total.
        Hari tanpa transaksi → 200 dengan angka 0 dan items kosong. date tidak sah atau sesudah hari
        ini → 422 VALIDATION.
      security:
        - ownerCookieAuth: []
      parameters:
        - $ref: "#/components/parameters/QrisDate"
      responses:
        "200":
          description: Rincian hari
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QrisDayDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    put:
      tags: [owner]
      operationId: markOwnerQrisDay
      summary: Tandai QRIS satu hari Cocok atau Tidak cocok
      description: |
        (S7, K11, K21) Hanya hari yang sudah selesai: date tidak sah, hari ini, atau sesudahnya →
        422 VALIDATION. tidak_cocok wajib note (kosong setelah trim → 422 VALIDATION); note > 200
        karakter → 422; note cocok yang kosong disimpan null. Tandai ulang boleh dan menimpa (satu
        rekaman per tanggal, diganti utuh); server menyimpan total saat ditandai (dasar
        changedAfterMark), penanda (nama), dan jam server. Tidak ada tandai semua.
      security:
        - ownerCookieAuth: []
      parameters:
        - $ref: "#/components/parameters/QrisDate"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QrisMarkInput"
      responses:
        "200":
          description: Hari setelah ditandai
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QrisDay"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/owner/reports/sales:
    get:
      tags: [owner]
      operationId: getOwnerSalesReport
      summary: Laporan penjualan satu periode dengan pembanding sepanjang rentang yang sama
      description: |
        Omzet, laba kotor, transaksi, rata-rata per struk, kasbon baru, grafik, 3 barang teratas,
        per kategori, dan per kasir untuk satu periode (K12/K16), kalender Asia/Jakarta (hari mulai
        00.00 WIB; minggu = Senin–Minggu; bulan = tanggal 1 sampai akhir bulan; tanggal = rentang
        bebas). Urutan pemeriksaan (pesan sama dengan checkRange di shared/lib/report-period.ts):
        period tidak dikenal → 422 VALIDATION "Periode tidak valid"; from/to bukan tanggal sah →
        "Tanggal tidak valid"; to < from → "Tanggal akhir sebelum tanggal awal"; from > hari ini →
        "Tanggal di masa depan"; period hari/minggu/bulan dengan rentang yang tidak sama dengan
        periode yang memuat from → "Periode tidak cocok"; period tanggal lebih dari 92 hari
        (kedua ujung ikut) → "Rentang maksimal 92 hari". Lolos pemeriksaan: to > hari ini dijepit
        ke hari ini dan running = true (running = rentang memuat hari ini); range = rentang sesudah
        dijepit.

        Pembanding previous dihitung dari range (sesudah dijepit): hari → hari yang sama minggu
        lalu; minggu → 7 hari sebelumnya; bulan yang sudah lewat → bulan sebelumnya penuh; bulan
        berjalan (running, termasuk hari terakhirnya) → tanggal 1 sampai tanggal sejajar bulan
        sebelumnya (30 Nov → 1–30 Okt), dijepit ke akhir bulan itu bila bulan itu lebih pendek
        (1–30 Mar vs 1–28 Feb); tanggal → rentang tepat sebelumnya sepanjang sama. Bila running dan
        hari terakhir previous sejajar dengan hari ini (selalu untuk hari, minggu, tanggal; untuk
        bulan bila tanggal sejajar tidak dijepit), previousTotals berhenti di akhir menit sekarang
        pada hari terakhir pembanding (menit berjalan ikut), seperti Beranda; bila tanggal sejajar
        dijepit, bulan pembanding yang lebih pendek dihitung penuh. (jawaban pemilik Q7)

        Status penjualan dibaca sekarang (K14): penjualan yang kemudian dibatalkan keluar dari
        current, series, topProducts, dan categories, tetapi dihitung di kasir[].voidedCount. HPP =
        yang disalin per baris saat penjualan (HPP sekarang tidak dipakai). Hari ini (period hari,
        from = to = hari ini): current sama dengan getOwnerTodaySummary (revenue, grossProfit,
        salesCount, avgTicket, newCredit) dan previousTotals.revenue = lastWeekRevenue.

        series: period hari → kind jam, 24 bucket berkunci "0".."23" (jam Asia/Jakarta); period
        lain → kind hari, satu bucket per tanggal from..to permintaan (sebelum dijepit), berkunci
        YYYY-MM-DD. Bucket yang belum terjadi (jam yang mulai sesudah sekarang, tanggal sesudah hari
        ini) bernilai null. topProducts = 3 teratas listOwnerProductSales urut omzet. categories urut
        omzet terbesar lalu nama, category null terakhir. kasir urut omzet terbesar lalu nama
        (kasir yang hanya punya transaksi dibatalkan tetap ada).
      security:
        - ownerCookieAuth: []
      parameters:
        - $ref: "#/components/parameters/ReportPeriodQuery"
        - $ref: "#/components/parameters/ReportFrom"
        - $ref: "#/components/parameters/ReportTo"
      responses:
        "200":
          description: Laporan penjualan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalesReport"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/owner/reports/products:
    get:
      tags: [owner]
      operationId: listOwnerProductSales
      summary: Semua barang terjual di satu periode (Paling laku > Lihat semua)
      description: |
        Periode, pemeriksaan, dan jepit sama dengan getOwnerSalesReport; hanya penjualan berstatus
        selesai di range. Satu baris per barang (semua satuan dijumlah dalam satuan dasar). Urutan
        ditentukan server (K15): omzet = revenue terbesar; jumlah = qtyBase ÷ unitSize eceran
        terbesar, seri → omzet lebih besar; laba = grossProfit terbesar, null terakhir, seri → omzet
        lebih besar; seri terakhir → nama barang. sort tidak dikenal → 422 VALIDATION "Urutan
        tidak valid".
      security:
        - ownerCookieAuth: []
      parameters:
        - $ref: "#/components/parameters/ReportPeriodQuery"
        - $ref: "#/components/parameters/ReportFrom"
        - $ref: "#/components/parameters/ReportTo"
        - name: sort
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ProductSalesSort"
      responses:
        "200":
          description: Barang terjual, terurut
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProductSales"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/owner/reports/stock:
    get:
      tags: [owner]
      operationId: getOwnerStockReport
      summary: Tidak terjual ≥ 30 hari dan untung tipis (posisi sekarang)
      description: |
        Posisi hari ini (Asia/Jakarta), tanpa periode. Urutan angka uang ditentukan server, bukan
        di layar (label pemilik): unsold.items menurut sort (default: modal) — modal = heldValue
        terbesar, null terakhir; lama = days terbesar, seri → heldValue terbesar (null terakhir);
        seri terakhir → nama barang. thinMargin.items urut marginPermille naik (rugi dulu), lalu
        nama. Batas dari state server (reportRules; pengaturannya di F3c-2). sort tidak dikenal →
        422 VALIDATION "Urutan tidak valid".
      security:
        - ownerCookieAuth: []
      parameters:
        - name: sort
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/StockReportSort"
      responses:
        "200":
          description: Laporan stok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockReport"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/owner/reports/opname:
    get:
      tags: [owner]
      operationId: getOwnerOpnameReport
      summary: Selisih opname per barang di satu rentang (pengaman 4)
      description: |
        from/to diperiksa seperti period tanggal di getOwnerSalesReport (pesan checkRange,
        maksimal 92 hari); to > hari ini dijepit ke hari ini; range = rentang sesudah dijepit.
        Hitungan final (K19) = state cocok, disesuaikan, disetujui, dihitung_ulang (memakai hasil
        hitung ulang) dengan jam hitung di range; ditahan, menunggu_alasan, dan diganti tidak ikut;
        stok_awal hanya patokan. Selisih yang sudah diberi alasan tetap dihitung. Hitungan tanpa HPP
        tidak dijumlah (unknownValueCount). items hanya barang yang punya selisih, urut lossValue
        terbesar (null terakhir), seri → gainValue terbesar, lalu nama.
      security:
        - ownerCookieAuth: []
      parameters:
        - $ref: "#/components/parameters/ReportFrom"
        - $ref: "#/components/parameters/ReportTo"
      responses:
        "200":
          description: Selisih opname
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpnameReport"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/owner/reports/opname/{productId}:
    get:
      tags: [owner]
      operationId: getOwnerOpnameProductReport
      summary: Detail selisih opname satu barang dengan yang bertugas
      description: |
        Rentang & hitungan final sama dengan getOwnerOpnameReport. counts = semua hitungan final
        barang ini di range, terbaru dulu, masing-masing dengan yang bertugas di antara hitungan
        sebelumnya (final atau stok_awal, boleh sebelum range) dan hitungan ini (K20): kasir yang
        shift-nya tumpang dengan jeda itu (termasuk shift yang masih buka) dan orang toko yang punya
        catatan barang itu (nota barang masuk aktif, keluarkan kedaluwarsa, sesi opname lain; catatan
        pemilik tidak ikut), digabung per nama, urut nama. Jeda = (hitungan sebelumnya; hitungan
        ini]. Hitungan dihitung_ulang memakai jam & selisih hitung ulang, counterName = pemilik yang
        menghitung ulang. Petunjuk, bukan bukti. 404 bila barang tidak dikenal atau tidak punya
        hitungan final di range.
      security:
        - ownerCookieAuth: []
      parameters:
        - $ref: "#/components/parameters/ProductId"
        - $ref: "#/components/parameters/ReportFrom"
        - $ref: "#/components/parameters/ReportTo"
      responses:
        "200":
          description: Detail selisih satu barang
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpnameProductReport"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/staff/users:
    get:
      tags: [staff]
      operationId: listStaffUsers
      summary: Daftar akun yang bisa masuk di HP orang toko
      description: Hanya pengguna ber-role kasir.
      responses:
        "200":
          description: Pengguna kasir
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "403":
          $ref: "#/components/responses/LanOnly"
  /api/staff/login:
    post:
      tags: [staff]
      operationId: staffLogin
      summary: Masuk orang toko dengan PIN kasir
      description: |
        PIN_INVALID (401) bila PIN salah atau akun bukan kasir; LOCKED_OUT (423) bila terlalu banyak
        percobaan. Hitungan PIN salah dan kunci realm orang toko terpisah dari login kasir; gagal di
        HP tidak mengunci PC kasir, dan sebaliknya. Sukses mengeset cookie staff_session tanpa
        menyentuh kasir_session atau owner_session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PinLoginRequest"
      responses:
        "200":
          description: Sesi orang toko dibuat (cookie staff_session diset)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/PinInvalid"
        "403":
          $ref: "#/components/responses/LanOnly"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "423":
          $ref: "#/components/responses/LockedOut"
  /api/staff/session:
    get:
      tags: [staff]
      operationId: getStaffSession
      summary: Sesi orang toko aktif
      security:
        - staffCookieAuth: []
      responses:
        "200":
          description: Sesi aktif
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/LanOnly"
  /api/staff/logout:
    post:
      tags: [staff]
      operationId: staffLogout
      summary: Keluar orang toko
      description: Selalu 204 (idempoten), juga tanpa sesi; hanya menghapus staff_session.
      responses:
        "204":
          description: Sesi orang toko dihapus
        "403":
          $ref: "#/components/responses/LanOnly"
  /api/staff/shift:
    get:
      tags: [staff]
