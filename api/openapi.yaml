        status:
          $ref: "#/components/schemas/SaleStatus"
        printStatus:
          $ref: "#/components/schemas/PrintStatus"
    SaleStatus:
      type: string
      enum: [selesai, dibatalkan]
    PrintStatus:
      type: string
      enum: [tercetak, tidak_dicetak, gagal]
    PrintResult:
      type: object
      required: [printStatus]
      properties:
        printStatus:
          $ref: "#/components/schemas/PrintStatus"
    VoidRequest:
      type: object
      description: |
        Tanpa PIN pemilik; alasan wajib. qrisRefundSource wajib bila kasir membatalkan transaksi
        yang punya bagian QRIS: laci = dikembalikan tunai dari laci shift yang sedang buka (masuk
        ShiftClosure.saleRefunds), pemilik = ditransfer pemilik nanti (di luar laci). Tanpa nilai
        laci/pemilik → 422 VALIDATION "Pilih cara mengembalikan QRIS". Transaksi tanpa bagian QRIS:
        nilainya diabaikan. qrisRefundSource diabaikan di jalur pemilik (voidOwnerSale): pemilik
        tidak pernah memakai laci.
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 200
          description: Alasan pembatalan, wajib (1..200 karakter setelah trim); tanpa PIN pemilik.
        qrisRefundSource:
          type: string
          nullable: true
          enum: [laci, pemilik]
    KasirLookupSale:
      description: |
        Penjualan untuk Cari nomor struk di kasir: key Sale ditambah customerName (null bila tanpa
        pelanggan); tanpa HPP, laba, atau data pengecualian.
      allOf:
        - $ref: "#/components/schemas/Sale"
        - type: object
          required: [customerName]
          properties:
            customerName:
              type: string
              nullable: true
    ExceptionKind:
      type: string
      description: |
        Jenis kejadian Perlu perhatian (ruling R1/R9, K2), urutan tetap: batal_transaksi (penjualan
        dibatalkan kasir), batal_pelunasan (pelunasan dibatalkan kasir), kasbon_lewat_limit (kasbon
        melewati limit dengan alasan; penjualan yang kemudian dibatalkan tidak ikut),
        batal_kas_keluar (kas keluar dibatalkan kasir, S10), selisih_kas (|selisih tutup shift| ≥
        cashDiffMin, S6), kas_keluar (kas keluar besar, S2/K4), serah_terima (modal berbeda dari
        saran, S4), shift_lama (shift buka > shiftMaxHours jam, S3), selisih_kecil (Σ selisih
        kurang kecil satu kasir dalam 7 hari > smallShortageWeekMax, S6/K18).
      enum: [batal_transaksi, batal_pelunasan, kasbon_lewat_limit, batal_kas_keluar, selisih_kas, kas_keluar, serah_terima, shift_lama, selisih_kecil]
    CashierException:
      type: object
      description: |
        Satu kejadian. batal_transaksi: at = jam batal, kasirName = pembatal, amount = total
        transaksi, saleId/saleNumber terisi; fromClosedShift = transaksi dari shift yang sudah tutup
        (ruling R12); refund = uang yang keluar dari laci shift yang sedang buka saat itu (0 bila
        tidak ada); qrisToOwner = bagian QRIS yang dipilih Transfer oleh pemilik nanti (pemilik
        harus mentransfer). batal_pelunasan: at = jam batal, kasirName = pembatal, amount = nominal
        pelunasan, paymentId terisi. kasbon_lewat_limit: at = jam jual, kasirName = kasir, amount =
        kelebihan limit bagian kasbon ini, saleId/saleNumber terisi. customerName = pelanggan (null
        bila tanpa pelanggan). Untuk selain batal_transaksi fromClosedShift false, refund dan
        qrisToOwner 0. overLimitExcess (batal_transaksi) = kelebihan limit kasbon transaksi yang
        dibatalkan (CreditOverLimit.excess yang tercatat), null bila transaksi itu tidak lewat limit;
        selain batal_transaksi selalu null. Butir kasbon_lewat_limit transaksi itu tetap hilang
        saat transaksinya dibatalkan.
        Jenis F3c-2a (K3, K4, K5, K22): batal_kas_keluar: id = id kas keluar, at = jam batal,
        kasirName = pembatal, amount = nominal, reason = alasan batal. selisih_kas: id = shiftId, at
        = closedAt, kasirName = kasir shift, amount = difference (bertanda), reason null.
        kas_keluar: (a) id = id kas keluar, at = jam catat, amount = nominal, reason = alasannya;
        (b) id = kas_keluar_shift-{shiftId}, at = jam kas keluar yang membuat Σ shift lewat, amount =
        Σ kas keluar aktif shift saat ini, reason null; kasirName = kasir shift. serah_terima: id =
        shiftId, at = openedAt, kasirName = kasir yang membuka, amount = openingCash −
        suggestedOpening (bertanda), reason = openingNote. shift_lama: id = shiftId, at = openedAt +
        shiftMaxHours jam, amount 0, durationMinutes = menit penuh (closedAt ?? jam server) −
        openedAt, reason null. selisih_kecil: id = shiftId, at = closedAt, amount = difference (< 0),
        reason null. shiftId = shift kejadian (null untuk tiga jenis F3c-1); shiftOpenedAt /
        shiftClosedAt = jam buka/tutup shift itu (rentang baris tanpa alasan di halaman tinjau, tanpa
        memuat shift per baris); keduanya null bila shiftId null, shiftClosedAt null selama shift
        masih buka; durationMinutes hanya
        shift_lama (selain itu null); kasirId = id kasir pelaku (pembatal untuk jenis batal; null
        bila rekaman tidak menyimpannya). customerName, saleId, saleNumber, paymentId null untuk
        jenis F3c-2a.
      required: [id, kind, at, kasirId, kasirName, amount, reason, customerName, saleId, saleNumber, paymentId, shiftId, shiftOpenedAt, shiftClosedAt, durationMinutes, fromClosedShift, refund, qrisToOwner, overLimitExcess]
      properties:
        id:
          type: string
        kind:
          $ref: "#/components/schemas/ExceptionKind"
        at:
          type: integer
          format: int64
          description: Jam server kejadian (epoch ms UTC).
        kasirId:
          type: string
          nullable: true
        kasirName:
          type: string
        amount:
          type: integer
        reason:
          type: string
          nullable: true
          description: Alasan dari kasir; null untuk selisih_kas, shift_lama, selisih_kecil, dan kas_keluar per shift.
        shiftId:
          type: string
          nullable: true
        shiftOpenedAt:
          type: integer
          format: int64
          nullable: true
          description: Jam buka shift kejadian (epoch ms UTC); null bila shiftId null.
        shiftClosedAt:
          type: integer
          format: int64
          nullable: true
          description: Jam tutup shift kejadian (epoch ms UTC); null bila shiftId null atau shift masih buka.
        durationMinutes:
          type: integer
          nullable: true
          description: Hanya shift_lama; lama shift dalam menit penuh.
        customerName:
          type: string
          nullable: true
        saleId:
          type: string
          nullable: true
        saleNumber:
          type: string
          nullable: true
        paymentId:
          type: string
          nullable: true
        fromClosedShift:
          type: boolean
        refund:
          type: integer
        qrisToOwner:
          type: integer
        overLimitExcess:
          type: integer
          nullable: true
          minimum: 1
    ExceptionAttention:
      type: object
      description: |
        Butir Perlu perhatian satu jenis (selisih_kecil: satu kasir): semua kejadian dengan at >
        reviewedAt (tanpa batas umur kecuali selisih_kecil 7 hari). total = Σ amount, kecuali
        kas_keluar = Σ kas keluar unik yang tercakup (kejadian satuan dan kejadian shift di shift
        yang sama tidak dijumlah dua kali, K22); shortage = Σ amount yang < 0 (≤ 0); from/to =
        tanggal Asia/Jakarta kejadian tertua/terbaru; latestAt = at kejadian terbaru (dipakai upTo
        saat ditinjau langsung, S8). selisih_kecil muncul hanya bila Σ |amount| >
        smallShortageWeekMax (ketat). kasirId/kasirName hanya selisih_kecil (kunci butir UI
        exception-selisih_kecil-{kasirId}); jenis lain null. longestMinutes hanya shift_lama =
        durationMinutes terbesar kejadian di butir (teks "terlama {j} jam"); jenis lain null.
      required: [kind, count, total, shortage, from, to, latestAt, kasirId, kasirName, longestMinutes]
      properties:
        kind:
          $ref: "#/components/schemas/ExceptionKind"
        count:
          type: integer
          minimum: 1
        total:
          type: integer
        shortage:
          type: integer
          maximum: 0
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        latestAt:
          type: integer
          format: int64
        kasirId:
          type: string
          nullable: true
        kasirName:
          type: string
          nullable: true
        longestMinutes:
          type: integer
          nullable: true
          minimum: 0
          description: Hanya shift_lama — durationMinutes terbesar di butir ini; jenis lain null.
    OwnerExceptionList:
      type: object
      required: [kind, reviewedAt, items]
      properties:
        kind:
          $ref: "#/components/schemas/ExceptionKind"
        reviewedAt:
          type: integer
          format: int64
          nullable: true
          description: Terakhir ditinjau (epoch ms UTC; selisih_kecil = penanda kasir itu); null bila belum pernah.
        items:
          type: array
          description: Kejadian dengan at > reviewedAt, terbaru dulu.
          items:
            $ref: "#/components/schemas/CashierException"
    ExceptionReviewInput:
      type: object
      required: [kind, upTo]
      properties:
        kind:
          $ref: "#/components/schemas/ExceptionKind"
        upTo:
          type: integer
          format: int64
          description: Jam kejadian terbaru yang sudah dilihat pemilik (epoch ms UTC); dijepit ke jam server.
        kasirId:
          type: string
          nullable: true
          description: Wajib untuk selisih_kecil (penanda per kasir, K18; tanpa → 422); diabaikan jenis lain.
    SaleVoid:
      type: object
      description: |
        Pembatalan transaksi. drawerRefund = uang yang keluar dari laci shift yang sedang buka saat
        dibatalkan kasir (bagian tunai transaksi shift lama + bagian QRIS Tunai dari laci; 0 untuk
        jalur pemilik). qrisRefundSource = cara mengembalikan bagian QRIS (null bila tanpa QRIS;
        jalur pemilik selalu pemilik).
      required: [at, byId, byName, reason, channel, drawerRefund, qrisRefundSource]
      properties:
        at:
          type: integer
          format: int64
          description: Jam server saat dibatalkan (epoch ms UTC).
        byId:
          type: string
        byName:
          type: string
        reason:
          type: string
        channel:
          type: string
          enum: [kasir, pemilik]
        drawerRefund:
          type: integer
        qrisRefundSource:
          type: string
          nullable: true
          enum: [laci, pemilik]
    CreditOverLimit:
      type: object
      description: Kasbon melewati limit dengan alasan; excess = bagian kasbon transaksi ini di atas limit.
      required: [excess, reason]
      properties:
        excess:
          type: integer
          minimum: 1
        reason:
          type: string
    OwnerSaleRow:
      type: object
      required: [id, number, createdAt, kasirName, total, methodLabel, status, shiftOpen]
      properties:
        id:
          type: string
        number:
          type: string
        createdAt:
          type: integer
          format: int64
        kasirName:
          type: string
        total:
          type: integer
        methodLabel:
          type: string
          description: Tunai, QRIS, Kasbon, atau Campuran (lebih dari satu metode).
        status:
          $ref: "#/components/schemas/SaleStatus"
        shiftOpen:
          type: boolean
          description: Penjualan milik shift yang sedang buka → batal hanya dari kasir.
    OwnerSale:
      description: Detail transaksi untuk pemilik (tanpa HPP).
      allOf:
        - $ref: "#/components/schemas/Sale"
        - type: object
          required: [customerName, shiftOpen, voided, creditOverLimit]
          properties:
            customerName:
              type: string
              nullable: true
            shiftOpen:
              type: boolean
            voided:
              nullable: true
              allOf:
                - $ref: "#/components/schemas/SaleVoid"
            creditOverLimit:
              nullable: true
              allOf:
                - $ref: "#/components/schemas/CreditOverLimit"
    Customer:
      type: object
      required: [id, name, phone, balance, creditLimit]
      properties:
        id:
          type: string
        name:
          type: string
        phone:
          type: string
        balance:
          type: integer
        creditLimit:
          type: integer
    NewCustomer:
      type: object
      required: [name, phone]
      properties:
        name:
          type: string
          minLength: 2
        phone:
          type: string
          pattern: '^\d{8,15}$'
    CreditPaymentMethod:
      type: string
      description: tunai dan qris hanya jalur kasir; transfer dan titip (tunai ke pemilik) hanya jalur pemilik.
      enum: [tunai, qris, transfer, titip]
    CreditPaymentChannel:
      type: string
      description: kasir = dicatat di kasir (hanya tunai masuk laci); pemilik = langsung ke pemilik (tidak pernah masuk laci).
      enum: [kasir, pemilik]
    CreditAge:
      type: string
      description: Kelompok umur kasbon belum lunas tertua — 0–7 hari, 8–30 hari, lebih dari 30 hari.
      enum: [hari_0_7, hari_8_30, lebih_30_hari]
    KasirCreditPaymentInput:
      type: object
      required: [id, customerId, amount, method, cashReceived, print]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 64
          description: ID dari klien (idempotensi per pembuat); id yang sama mengembalikan rekaman lama dengan 200.
        customerId:
          type: string
        amount:
          type: integer
          minimum: 1
          description: 1 ≤ amount ≤ saldo kasbon pelanggan (boleh sebagian).
        method:
          type: string
          enum: [tunai, qris]
        cashReceived:
          type: integer
          nullable: true
          description: Tunai wajib ≥ amount; QRIS null.
        print:
          type: boolean
          description: Cetak struk pelunasan; bawaan klien = autoPrint toko.
    KasirCreditPayment:
      type: object
      description: Pelunasan jalur kasir; hanya key ini (tanpa HPP, laba, atau data pembatalan).
      required: [id, customerId, customerName, amount, method, cashReceived, change, balanceAfter, createdAt, kasirName, shiftId, status, printStatus]
      properties:
        id:
          type: string
        customerId:
          type: string
        customerName:
          type: string
        amount:
          type: integer
        method:
          type: string
          enum: [tunai, qris]
        cashReceived:
          type: integer
          description: Uang tunai diterima; 0 untuk QRIS.
        change:
          type: integer
          description: Kembalian = cashReceived − amount; 0 untuk QRIS.
        balanceAfter:
          type: integer
          description: Sisa kasbon setelah pelunasan ini, disalin saat dicatat (tidak berubah bila dibatalkan).
        createdAt:
          type: integer
          format: int64
          description: Jam server saat dicatat (epoch ms UTC).
        kasirName:
          type: string
        shiftId:
          type: string
        status:
          type: string
          enum: [aktif, dibatalkan]
        printStatus:
          $ref: "#/components/schemas/PrintStatus"
    CancelCreditPaymentInput:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 200
          description: Alasan pembatalan, wajib (1..200 karakter setelah trim); tanpa PIN pemilik.
    OwnerCreditPaymentInput:
      type: object
      required: [id, amount, method]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 64
          description: ID dari klien (idempotensi per pembuat).
        amount:
          type: integer
          minimum: 1
          description: 1 ≤ amount ≤ saldo kasbon pelanggan (boleh sebagian).
        method:
          type: string
          enum: [transfer, titip]
    CreditLimitInput:
      type: object
      required: [creditLimit]
      properties:
        creditLimit:
          type: integer
          minimum: 0
          description: Batas peringatan kasbon (rupiah); boleh di bawah saldo sekarang.
    OwnerCustomerRow:
      type: object
      required: [id, name, phone, balance, creditLimit, oldestUnpaidAt, ageDays, age]
      properties:
        id:
          type: string
        name:
          type: string
        phone:
          type: string
        balance:
          type: integer
          description: Saldo kasbon = Σ buku kasbon; < 0 = Lebih bayar (tidak dihitung sebagai utang).
        creditLimit:
          type: integer
        oldestUnpaidAt:
          type: integer
          format: int64
          nullable: true
          description: |
            Waktu kasbon belum lunas tertua menurut FIFO (pelunasan melunasi kasbon tertua dulu;
            pembalik batal pelunasan dikenali); null iff balance ≤ 0.
        ageDays:
          type: integer
          nullable: true
          description: |
            ageDays = ceil((now − oldestUnpaidAt) / 86.400.000), pembulatan ke atas ke hari penuh; null
            iff balance ≤ 0. Setara dengan aturan Beranda (now − oldestUnpaidAt > 30 hari ⇔ ageDays >
            30), sehingga angka hari, kelompok, dan butir Kasbon > 30 hari selalu sepakat.
        age:
          nullable: true
          description: |
            Dari ageDays: > 30 → lebih_30_hari, ≥ 8 → hari_8_30, selain itu hari_0_7; null iff
            balance ≤ 0.
          allOf:
            - $ref: "#/components/schemas/CreditAge"
    CreditAgeSummary:
      type: object
      required: [age, count, total]
      properties:
        age:
          $ref: "#/components/schemas/CreditAge"
        count:
          type: integer
          description: Jumlah pelanggan bersaldo > 0 di kelompok ini.
        total:
          type: integer
          description: Σ saldo pelanggan tersebut (rupiah).
    OwnerCustomerList:
