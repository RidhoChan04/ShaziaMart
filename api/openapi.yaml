      required: [receiptId, supplierName, notaDate, amount, dueDate, paid, photoId, createdAt, createdByName]
      properties:
        receiptId:
          type: string
        supplierName:
          type: string
        notaDate:
          type: string
          format: date
        amount:
          type: integer
        dueDate:
          type: string
          format: date
        paid:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/DebtPayment"
        photoId:
          type: string
          nullable: true
        createdAt:
          type: integer
          format: int64
        createdByName:
          type: string
    DrawerShift:
