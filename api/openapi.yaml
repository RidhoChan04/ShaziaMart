          description: Shift laci saat ini; shift bernilai null bila tidak ada yang buka
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffShift"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/LanOnly"
  /api/staff/products:
    get:
      tags: [staff]
      operationId: searchStaffProducts
      summary: Cari barang untuk barang masuk
      description: |
        Nama (mengandung, tanpa beda huruf besar/kecil), barcode, atau kode toko (persis); tanpa
        barang nonaktif dan satuan nonaktif (barang menunggu_harga ikut). Paling banyak 20 hasil.
        Tanpa harga jual, modal, atau stok.
      security:
        - staffCookieAuth: []
      parameters:
        - name: q
          in: query
          required: true
          description: Nama, barcode, atau kode toko
          schema:
            type: string
      responses:
        "200":
          description: Kecocokan, maksimal 20 hasil
          content:
            application/json:
              schema:
                type: array
                maxItems: 20
                items:
                  $ref: "#/components/schemas/StaffProduct"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/LanOnly"
  /api/staff/suppliers:
    get:
      tags: [staff]
      operationId: listStaffSuppliers
      summary: Supplier yang pernah dipakai
      security:
        - staffCookieAuth: []
      responses:
        "200":
          description: Supplier, terakhir dipakai dulu
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Supplier"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/LanOnly"
  /api/staff/receipts:
    post:
      tags: [staff]
      operationId: createStaffReceipt
      summary: Simpan nota barang masuk
      description: |
        Idempoten menurut (pembuat, id) — id = ID draf dari HP: id yang sudah disimpan pengguna ini
        mengembalikan nota lama dengan 200 tanpa validasi ulang dan tanpa mencatat ulang stok, HPP,
        uang keluar, atau utang. id sudah dipakai pengguna lain → 409 ID_TAKEN tanpa isi nota; nota
        milik pengguna lain tidak pernah dikembalikan.
        Atomik: 422 ReceiptProblem dengan galat per baris/field, tanpa perubahan sebagian.
        cashSource laci tanpa shift kasir yang buka → 422 dengan field cashSource; server tidak
        pernah mengubahnya menjadi uang pemilik. photoId yang bukan diunggah pengguna ini → 422
        dengan field photoId.
        Batas min/max di skema adalah panduan klien; server selalu memvalidasi isi mentah.
      security:
        - staffCookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReceiptInput"
      responses:
        "200":
          description: id sudah pernah disimpan; nota lama dikembalikan (replay)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffReceipt"
        "201":
          description: Nota dibuat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffReceipt"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/LanOnly"
        "409":
          $ref: "#/components/responses/IdTaken"
        "422":
          $ref: "#/components/responses/ReceiptValidationFailed"
    get:
      tags: [staff]
      operationId: listStaffReceipts
      summary: Nota barang masuk milik sendiri
      security:
        - staffCookieAuth: []
      responses:
        "200":
          description: Nota yang dibuat pengguna ini, terbaru dulu (createdAt)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StaffReceiptRow"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/LanOnly"
  /api/staff/receipts/{receiptId}:
    get:
      tags: [staff]
      operationId: getStaffReceipt
      summary: Detail nota milik sendiri
      description: Nota milik orang lain juga 404.
      security:
        - staffCookieAuth: []
      parameters:
        - $ref: "#/components/parameters/ReceiptId"
      responses:
        "200":
          description: Nota
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffReceipt"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/LanOnly"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [staff]
      operationId: updateStaffReceipt
      summary: Ubah nota milik sendiri
      description: |
        Hanya staf pembuatnya (nota orang lain 404). Baris tidak bisa ditambah atau dihapus; barang
        dan satuannya tetap. payment hanya bisa diubah selama paymentEditable. Atomik: 422
        ReceiptProblem tanpa perubahan sebagian; 409 RECEIPT_CANCELLED bila nota sudah dibatalkan.
        Boleh setelah shift saat nota dicatat ditutup; koreksi uang laci dicatat sebagai baris uang
        keluar baru di shift yang sedang buka (shift lama tidak diubah; tanpa shift buka: tidak
        dicatat, audit memuat catatannya).
      security:
        - staffCookieAuth: []
      parameters:
        - $ref: "#/components/parameters/ReceiptId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReceiptEdit"
      responses:
        "200":
          description: Nota diubah
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffReceipt"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/LanOnly"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ReceiptCancelled"
        "422":
          $ref: "#/components/responses/ReceiptValidationFailed"
  /api/staff/receipt-photos/{photoId}:
    put:
      tags: [staff]
      operationId: putStaffReceiptPhoto
      summary: Unggah foto nota
      description: |
        Foto terikat ke pengunggahnya. Idempoten menurut (pengunggah, photoId): unggah ulang oleh
        pengguna yang sama tetap 204 tanpa mengubah foto tersimpan. photoId yang sudah diunggah
        pengguna lain → 409 ID_TAKEN, tidak pernah ditimpa.
        JPEG, paling besar 1 MB; selain itu 422 VALIDATION.
      security:
        - staffCookieAuth: []
      parameters:
        - $ref: "#/components/parameters/PhotoId"
      requestBody:
        required: true
        content:
          image/jpeg:
            schema:
              type: string
              format: binary
      responses:
        "204":
          description: Foto tersimpan
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/LanOnly"
        "409":
          $ref: "#/components/responses/IdTaken"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    get:
      tags: [staff]
      operationId: getStaffReceiptPhoto
      summary: Foto nota (JPEG)
      description: Foto yang bukan diunggah pengguna ini juga 404.
      security:
        - staffCookieAuth: []
      parameters:
        - $ref: "#/components/parameters/PhotoId"
      responses:
        "200":
          description: Foto nota
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/LanOnly"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/staff/opname/categories:
    get:
      tags: [staff]
      operationId: listStaffOpnameCategories
      summary: Lingkup opname (kategori, tanpa kategori, semua) dengan saran
      description: |
        Hitung buta: tanpa stok. Barang berstatus selain nonaktif dikelompokkan per lingkup
        (kategori menurut nama; tanpa_kategori = barang berkategori null); lingkup tanpa barang tidak
        tampil. lastCountedAt = submittedAt sesi terakhir (siapa pun) dengan lingkup itu atau semua.
        Urut lastCountedAt null dulu lalu terlama; suggested = lingkup pertama (null bila tidak ada).
      security:
        - staffCookieAuth: []
      responses:
        "200":
          description: Lingkup opname
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffOpnameCategories"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/LanOnly"
  /api/staff/opname/products:
    get:
      tags: [staff]
      operationId: listStaffOpnameProducts
      summary: Daftar barang yang dihitung untuk satu lingkup
      description: |
        Hitung buta: tanpa stok, harga jual, atau modal. Barang berstatus selain nonaktif di
        lingkup itu, urut nama; HP menyalinnya ke draf agar bisa menghitung tanpa sinyal.
        kategori wajib bila lingkup = kategori dan dilarang untuk lingkup lain → 422 VALIDATION.
      security:
        - staffCookieAuth: []
      parameters:
        - name: lingkup
          in: query
          required: true
          schema:
            type: string
            enum: [kategori, tanpa_kategori, semua]
        - name: kategori
          in: query
          required: false
          description: Nama kategori; hanya untuk lingkup = kategori.
          schema:
            type: string
      responses:
        "200":
          description: Barang dalam lingkup
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StaffProduct"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/LanOnly"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/staff/opname-sessions:
    get:
      tags: [staff]
      operationId: listStaffOpnameSessions
      summary: Sesi opname milik sendiri
      security:
        - staffCookieAuth: []
      responses:
        "200":
          description: Sesi yang dikirim pengguna ini dalam 30 hari terakhir, terbaru dulu (submittedAt)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StaffOpnameRow"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/LanOnly"
    post:
      tags: [staff]
      operationId: createStaffOpnameSession
      summary: Kirim hitungan opname
      description: |
        Langkah 1 dari 2 (K2); bisa dari draf offline yang dikirim belakangan.
        Idempoten menurut (pembuat, id) — id = ID draf dari HP: id yang sudah dikirim pengguna ini
        mengembalikan sesi lama dengan 200 tanpa menerapkan ulang; id sudah dipakai pengguna lain →
        409 ID_TAKEN; sesi milik pengguna lain tidak pernah dikembalikan.
        Jam hitung (K6): at = countedAt + (serverNow − deviceNow); clockEstimated bila
        |serverNow − deviceNow| > 5 menit; hasil di atas serverNow dijepit ke serverNow (juga
        clockEstimated). systemQtyBase = stok pada jam itu, sehingga penjualan di sela-sela tidak
        membuat selisih palsu; diffQtyBase = countedQtyBase − systemQtyBase.
        Per barang: barang stockCounted false → stok_awal (J1: langsung jadi stok, tanpa alasan,
        bukan kerugian); selisih 0 → cocok; selain itu menunggu_alasan. cocok dan stok_awal langsung
        diterapkan ke stok tanpa alasan; sesi tanpa barang menunggu_alasan langsung selesai.
        Barang yang sama di beberapa sesi (K5): hanya hitungan dengan countedAt terbaru yang
        berlaku. Barang di sesi ini menjadi diganti bila sesi lain punya hitungan barang itu dengan
        countedAt lebih baru yang belum diganti; selain itu hitungan lama barang itu yang masih
        menunggu_alasan atau ditahan menjadi diganti (replacedBySessionId).
        Pengaman selisih tertahan (I2): bila hitungan yang diganti berstate ditahan, atau sendiri
        pengganti hitungan tertahan yang alasannya belum disimpan (rantai), dan sesinya dibuat
        pengguna yang sama, hitungan baru tetap menunggu pemilik apa pun angkanya —
        selisih 0 langsung ditahan (tanpa alasan), selisih lain menunggu_alasan lalu ditahan saat
        alasan disimpan walau ≤ Rp100.000. Pengganti oleh pengguna lain mengikuti aturan biasa.
        Hitungan tertahan yang diganti tetap terlihat pemilik (replacedByName).
        Atomik: 422 OpnameProblem dengan galat per barang (barang tidak ditemukan, nonaktif,
        dihitung dua kali, jumlah atau jam tidak valid), tanpa perubahan sebagian.
        Batas min/max di skema adalah panduan klien; server selalu memvalidasi isi mentah.
      security:
        - staffCookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpnameSessionInput"
      responses:
        "200":
          description: id sudah pernah dikirim; sesi lama dikembalikan (replay)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffOpnameSession"
        "201":
          description: Sesi dibuat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffOpnameSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/LanOnly"
        "409":
          $ref: "#/components/responses/IdTaken"
        "422":
          $ref: "#/components/responses/OpnameValidationFailed"
  /api/staff/opname-sessions/{sessionId}:
    get:
      tags: [staff]
      operationId: getStaffOpnameSession
      summary: Hasil opname milik sendiri
      description: Sesi milik orang lain juga 404.
      security:
        - staffCookieAuth: []
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Sesi opname
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffOpnameSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/LanOnly"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/staff/opname-sessions/{sessionId}/finish:
    post:
      tags: [staff]
      operationId: finishStaffOpnameSession
      summary: Simpan alasan selisih (online)
      description: |
        Langkah 2 dari 2 (K2); hanya pembuat sesi (sesi orang lain 404). Satu alasan untuk tepat
        setiap barang menunggu_alasan; barang diganti diabaikan. Alasan untuk barang yang tidak
        perlu alasan ("Barang ini tidak perlu alasan"), barang yang tidak ada di sesi ("Barang
        tidak ditemukan"), alasan ganda ("Barang dihitung dua kali"), barang tanpa alasan ("Pilih
        alasan"), atau receiptId yang bukan nota aktif berisi barang itu ("Nota rujukan tidak
        cocok") → 422 OpnameProblem, tanpa perubahan sebagian.
        salah_input (J4): receiptId disimpan sebagai rujukan (nota tidak diubah, stok dikoreksi
        oleh opname). receiptOptions hanya 5 nota terbaru yang ditawarkan; server menerima nota
        aktif mana pun yang memuat barang itu, agar nota baru yang masuk sesudah halaman dimuat
        tidak membuat pilihan lama ditolak. receiptId null → tercatat tidak_diketahui.
        Nilai (K3): value = round_half_up(|diffQtyBase| × cost.amount ÷ cost.qtyBase) dari HPP
        sekarang; null bila HPP belum ada. Barang ditahan bila value null (J3) atau > Rp100.000
        (J2, nilai mutlak, kurang maupun lebih); selain itu langsung disesuaikan (entri ledger
        opname dengan alasan, waktu efektif = countedAt). Pengecualian (I2): barang yang
        menggantikan hitungan tertahan milik pengguna yang sama selalu ditahan. Sesi flagged bila
        Σ value yang diketahui pada barang selisih > Rp250.000; ditetapkan sekali di sini.
        Replay pada sesi selesai → 200 sesi apa adanya, tanpa menerapkan ulang.
      security:
        - staffCookieAuth: []
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpnameFinishInput"
      responses:
        "200":
          description: Sesi selesai
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffOpnameSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/LanOnly"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/OpnameValidationFailed"
  /api/staff/expiry:
    get:
      tags: [staff]
      operationId: getStaffExpiry
      summary: Barang sudah/segera kedaluwarsa (perkiraan per kiriman)
      description: |
        Perkiraan FIFO (K9): kiriman = semua baris nota aktif barang itu, ber-ED maupun tidak,
        dikunci (receiptId, lineId), urut terbaru dulu (notaDate, createdAt, lalu urutan baris
        menurun); capacityQtyBase = max(0, qty × unitSize − Σ yang sudah dikeluarkan dari baris
        itu); max(stok, 0) dialokasikan mulai dari kiriman terbaru, jadi barang lama dianggap
        terjual lebih dulu. lots = kiriman ber-ED dengan estimateQtyBase > 0 dan tahap lewat (ED
        sebelum hari ini) atau segera (0–soonDays hari lagi, termasuk hari ini), urut lewat dulu
        lalu segera, masing-masing ED naik. recent = log keluar dan ubah ED 14 hari terakhir,
        terbaru dulu, paling banyak 20. Tanpa nilai rupiah.
      security:
        - staffCookieAuth: []
      responses:
        "200":
          description: Kiriman ber-ED dan log terbaru
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffExpiryList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/LanOnly"
  /api/staff/expiry-removals:
    post:
      tags: [staff]
      operationId: createStaffExpiryRemoval
      summary: Keluarkan barang kedaluwarsa dari stok
      description: |
        Pengeluaran dicatat pada kiriman (baris nota) yang dipilih (J6), sehingga kiriman itu yang
        berkurang: entri ledger keluar_kedaluwarsa (qtyBase negatif) atas nama pengguna ini.
        1 ≤ qtyBase ≤ capacityQtyBase kiriman itu, selain itu 422 VALIDATION (detail = pesan);
        stok boleh menjadi minus. Nota tidak ada, dibatalkan, atau tanpa baris itu → 404.
        Idempoten menurut id saja, bukan per pembuat: id yang sudah pernah dicatat (oleh siapa
        pun, lewat app staf maupun pemilik) → 204 tanpa mencatat ulang dan tanpa memeriksa isinya
        lagi; isi yang pertama yang berlaku. Online saja.
      security:
        - staffCookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpiryRemovalInput"
      responses:
        "204":
          description: Dikeluarkan (atau id ini sudah pernah dicatat)
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/LanOnly"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/staff/receipts/{receiptId}/lines/{lineId}/expiry:
    put:
      tags: [staff]
      operationId: putStaffLineExpiry
      summary: Ubah tanggal ED satu kiriman
      description: |
        Berlaku untuk nota siapa pun. Nota tidak ada, dibatalkan, atau tanpa baris itu → 404;
        tanggal tidak sah → 422 VALIDATION. Mencatat riwayat perubahan nota (ubah, "{barang}: ED
        a → b") dan log ubah_ed; tanggal sama → 204 tanpa entri.
      security:
        - staffCookieAuth: []
      parameters:
        - $ref: "#/components/parameters/ReceiptId"
        - $ref: "#/components/parameters/LineId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpiryDateInput"
      responses:
        "204":
          description: Tanggal ED tersimpan
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/LanOnly"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/staff/low-stock:
    get:
      tags: [staff]
      operationId: listStaffLowStock
      summary: Barang menipis
      description: |
        Tanpa angka sisa stok. Aturan sama dengan stockAlert menipis (termasuk penanda diam);
        urut nama.
      security:
        - staffCookieAuth: []
      responses:
        "200":
          description: Barang menipis
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StaffLowStockItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/LanOnly"
components:
  parameters:
    ProductId:
      name: productId
      in: path
      required: true
      schema:
        type: string
    ReceiptId:
      name: receiptId
      in: path
      required: true
      schema:
        type: string
    PhotoId:
      name: photoId
      in: path
      required: true
      schema:
        type: string
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
    LineId:
      name: lineId
      in: path
      required: true
      schema:
        type: string
    CustomerId:
      name: customerId
      in: path
      required: true
      schema:
        type: string
    PaymentId:
      name: paymentId
      in: path
      required: true
      schema:
        type: string
    SaleId:
      name: saleId
      in: path
      required: true
      schema:
        type: string
    ExpenseId:
      name: expenseId
      in: path
      required: true
      schema:
        type: string
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
    ShiftId:
      name: shiftId
      in: path
      required: true
      schema:
        type: string
    TakeId:
      name: takeId
      in: path
      required: true
      schema:
        type: string
    QrisDate:
      name: date
      in: path
      required: true
      description: Tanggal Asia/Jakarta YYYY-MM-DD.
      schema:
        type: string
        format: date
    ReportPeriodQuery:
      name: period
      in: query
      required: true
      schema:
        $ref: "#/components/schemas/ReportPeriod"
    ReportFrom:
      name: from
      in: query
      required: true
      description: Tanggal awal Asia/Jakarta YYYY-MM-DD (ikut).
      schema:
        type: string
        format: date
    ReportTo:
      name: to
      in: query
      required: true
      description: Tanggal akhir Asia/Jakarta YYYY-MM-DD (ikut); sesudah hari ini dijepit ke hari ini.
      schema:
        type: string
        format: date
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: kasir_session
    ownerCookieAuth:
      type: apiKey
      in: cookie
      name: owner_session
    staffCookieAuth:
      type: apiKey
      in: cookie
      name: staff_session
  responses:
    LanOnly:
      description: |
        Bukan dari Wi-Fi toko (STAFF_LAN_ONLY): header Cf-Connecting-Ip/Cf-Ray → 403 STAFF_LAN_ONLY;
        backend menolak semua yang bukan LAN (gagal-tertutup)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    IdTaken:
      description: id dari HP sudah dipakai pengguna lain (ID_TAKEN); data pengguna lain tidak dikembalikan
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ReceiptCancelled:
      description: Nota sudah dibatalkan (RECEIPT_CANCELLED)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ReceiptValidationFailed:
      description: Nota tidak valid (VALIDATION) dengan galat per baris/field
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ReceiptProblem"
    OpnameValidationFailed:
      description: Hitungan atau alasan opname tidak valid (VALIDATION) dengan galat per barang
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/OpnameProblem"
    OpnameNotHeld:
      description: Barang tidak (lagi) ditahan menunggu persetujuan pemilik (OPNAME_NOT_HELD)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    LoginInvalid:
      description: Nama atau password salah (LOGIN_INVALID)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: Tidak ada sesi (UNAUTHORIZED)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PinInvalid:
      description: PIN salah (PIN_INVALID)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    LockedOut:
      description: Terlalu banyak percobaan PIN (LOCKED_OUT)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Tidak ditemukan (NOT_FOUND)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ShiftAlreadyOpen:
      description: Shift sudah terbuka (SHIFT_ALREADY_OPEN)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ShiftClosed:
      description: Tidak ada shift terbuka (SHIFT_CLOSED)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ValidationFailed:
      description: Input tidak valid (VALIDATION atau INVALID_QUANTITY)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ProductValidationFailed:
      description: Data barang tidak valid (VALIDATION) dengan pesan per field
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProductValidationProblem"
    ProductHasSales:
      description: Barang sudah pernah terjual atau ada di nota barang masuk aktif sehingga tidak bisa dihapus (PRODUCT_HAS_SALES)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Health:
      type: object
      required: [status, version, db]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        version:
          type: string
        db:
          type: string
          enum: [ok, error]
    ErrorCode:
      type: string
      enum:
        - INTERNAL
        - NOT_FOUND
        - VALIDATION
        - FORBIDDEN_ORIGIN
        - UNAUTHORIZED
        - PIN_INVALID
        - LOCKED_OUT
        - SHIFT_CLOSED
        - SHIFT_ALREADY_OPEN
        - PRICE_CHANGED
        - CREDIT_LIMIT
        - INVALID_QUANTITY
        - LOGIN_INVALID
        - PRODUCT_INACTIVE
        - PRODUCT_HAS_SALES
        - STAFF_LAN_ONLY
        - PRODUCT_NO_PRICE
        - RECEIPT_CANCELLED
        - DEBT_ALREADY_PAID
        - ID_TAKEN
        - OPNAME_NOT_HELD
        - OUTSIDE_SHIFT
        - IN_OPEN_SHIFT
        - VOID_TOO_OLD
        - CASH_TAKE_LOCKED
        - NAME_TAKEN
        - KASIR_ON_SHIFT
        - OPENING_MISMATCH
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        code:
          $ref: "#/components/schemas/ErrorCode"
        detail:
          type: string
    PriceChange:
      type: object
      required: [unitId, oldUnitPrice, newUnitPrice, newNormalPrice, newWholesaleTiers]
      properties:
        unitId:
          type: string
        oldUnitPrice:
          type: integer
        newUnitPrice:
          type: integer
        newNormalPrice:
          type: integer
          description: Harga normal (non-grosir) terbaru satuan ini; keranjang mengganti harga normal dan tier sekaligus.
        newWholesaleTiers:
          type: array
          description: Seluruh tier grosir terbaru satuan ini; keranjang mengganti tier lama.
          items:
            $ref: "#/components/schemas/WholesaleTier"
    ShiftClosedProblem:
      description: Problem SHIFT_CLOSED.
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [code]
          properties:
            code:
              type: string
              enum: [SHIFT_CLOSED]
    PriceChangedProblem:
      description: Problem PRICE_CHANGED dengan daftar perubahan harga.
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [code, changes]
          properties:
            code:
              type: string
              enum: [PRICE_CHANGED]
            changes:
              type: array
              description: Satu entri per unitId (beberapa baris dengan satuan sama tetap satu entri).
              items:
                $ref: "#/components/schemas/PriceChange"
    CreditLimitProblem:
      description: Problem CREDIT_LIMIT dengan saldo, batas, nilai kasbon yang dicoba, dan kelebihannya.
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [code, balance, creditLimit, attempted, excess]
          properties:
            code:
              type: string
              enum: [CREDIT_LIMIT]
            balance:
              type: integer
            creditLimit:
              type: integer
            attempted:
              type: integer
            excess:
              type: integer
              minimum: 1
              description: >-
                Bagian kasbon transaksi ini di atas limit = min(attempted, balance + attempted −
                creditLimit); sama dengan CreditOverLimit.excess yang dicatat bila disimpan dengan
                alasan. Klien menampilkan angka ini, tidak menghitung sendiri.
    OpeningMismatchProblem:
      description: |
        Problem OPENING_MISMATCH (422, K22): modal awal berbeda dari saran tanpa openingNote.
        suggestedCash = saran yang dihitung ulang server saat buka shift; klien memuat ulang saran
        dari sini, tidak menghitung sendiri.
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [code, suggestedCash]
          properties:
            code:
              type: string
              enum: [OPENING_MISMATCH]
            suggestedCash:
              type: integer
              minimum: 0
    User:
      type: object
      required: [id, name, role]
      properties:
        id:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [kasir, pemilik]
    OwnerLogin:
      type: object
      required: [name, password]
      properties:
        name:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
    OwnerSession:
      type: object
      description: user.role selalu pemilik.
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/User"
    HourBucket:
      type: object
      required: [hour, revenue, lastWeekRevenue]
      properties:
        hour:
          type: integer
          minimum: 0
          maximum: 23
          description: Jam lokal Asia/Jakarta.
        revenue:
          type: integer
          description: Omzet penjualan selesai hari ini pada jam ini (rupiah).
        lastWeekRevenue:
          type: integer
          description: Omzet penjualan selesai pada jam ini sepanjang jam penuh di hari yang sama minggu lalu (rupiah); grafik menampilkan seluruh hari minggu lalu.
    QrisUnreconciled:
      type: object
      description: |
        (S7, K11) Butir QRIS belum dicocokkan: hari sejak QRIS harian mulai dipakai dan sebelum hari
        ini dengan total QRIS > 0 yang statusnya belum (termasuk yang totalnya berubah setelah
        ditandai, K21). Hari tanpa QRIS tidak dihitung. from/to = tanggal Asia/Jakarta hari
        tertua/terbaru. Hanya bila AttentionRules.qrisDailyReconcile true (M-2a).
      required: [count, from, to]
      properties:
        count:
          type: integer
          minimum: 1
        from:
          type: string
          format: date
        to:
          type: string
          format: date
    OverdueCredit:
      type: object
      required: [count, total]
      properties:
        count:
          type: integer
          description: Jumlah pelanggan bersaldo kasbon > 0 yang entri kasbon belum lunas tertuanya lebih dari 30 hari.
        total:
          type: integer
          description: Jumlah saldo kasbon seluruh pelanggan tersebut (rupiah).
    Attention:
      type: object
      description: |
        Selisih kas shift tidak lagi berupa daftar hari ini: menjadi kejadian selisih_kas dan
        selisih_kecil di exceptions (S6, menumpuk sampai ditinjau).
      required: [lowStockCount, negativeStockCount, overdueCredit, costChanges, stockOuts, supplierDebts, awaitingPriceCount, expiry, opnameHeldCount, opnameFlags, opnameReplacedHeld, exceptions, qrisUnreconciled]
      properties:
        lowStockCount:
          type: integer
          description: |
            Jumlah barang dengan stockAlert menipis (0 <= stok < minStock). Aturan penanda diam:
            tidak termasuk barang stockCounted false, Sedang langka (scarce), tidak_diambil, atau nonaktif.
        negativeStockCount:
          type: integer
          description: |
            Jumlah barang dengan stockAlert minus (stok < 0); dihitung terpisah, tidak termasuk di
            lowStockCount. Aturan penanda diam: tidak termasuk barang stockCounted false atau
            nonaktif; Sedang langka (scarce) dan tidak_diambil tetap dihitung.
        overdueCredit:
          $ref: "#/components/schemas/OverdueCredit"
        costChanges:
          type: array
          description: Barang yang modal satuan ecerannya berubah dan belum ditindaklanjuti pemilik; terbaru dulu.
          items:
            $ref: "#/components/schemas/CostChangeItem"
        stockOuts:
          type: array
          description: Barang tidak_diambil yang stoknya sudah dihitung dan habis (stok <= 0); urut nama.
          items:
            $ref: "#/components/schemas/StockOutItem"
        supplierDebts:
          $ref: "#/components/schemas/SupplierDebtAttention"
        awaitingPriceCount:
          type: integer
          description: Jumlah barang menunggu_harga (barang baru dari barang masuk yang belum punya harga jual).
        expiry:
          $ref: "#/components/schemas/ExpiryAttention"
        opnameHeldCount:
          type: integer
          description: Jumlah barang opname berstate ditahan (menunggu persetujuan pemilik).
        opnameFlags:
          type: array
          description: Sesi opname flagged yang belum ditinjau (reviewOpnameSession); terbaru dulu (finishedAt).
          items:
            $ref: "#/components/schemas/OpnameFlag"
        opnameReplacedHeld:
          type: integer
          description: |
            Jumlah barang opname yang dulu ditahan lalu diganti hitungan baru (replacedByName ≠ null),
            di sesi yang belum ditinjau (reviewedAt null; reviewOpnameSession menghapusnya).
        exceptions:
          type: array
          description: |
            Butir kejadian yang menumpuk sejak terakhir ditinjau (ruling R9, S6), satu per jenis
            (selisih_kecil: satu per kasir), hanya dengan count > 0. Urutan tetap (K2):
            batal_transaksi, batal_pelunasan, kasbon_lewat_limit, batal_kas_keluar, selisih_kas,
            kas_keluar, serah_terima, shift_lama, selisih_kecil (per kasir, urut nama kasir).
          items:
            $ref: "#/components/schemas/ExceptionAttention"
        qrisUnreconciled:
          nullable: true
          description: |
            Butir QRIS belum dicocokkan (S7); null bila tidak ada hari yang perlu dicocokkan atau
            AttentionRules.qrisDailyReconcile false. Posisinya di daftar Perlu perhatian ditentukan UI.
          allOf:
            - $ref: "#/components/schemas/QrisUnreconciled"
    SupplierDebtAttention:
      type: object
      description: |
        Utang supplier belum lunas dari nota yang tidak dibatalkan, menurut tanggal hari ini
        (Asia/Jakarta). overdue = lewat jatuh tempo (setelah hari H); dueSoon = 0–3 hari sebelum
        jatuh tempo, termasuk hari H. Total dalam rupiah.
      required: [overdueCount, overdueTotal, dueSoonCount, dueSoonTotal]
      properties:
        overdueCount:
          type: integer
        overdueTotal:
          type: integer
        dueSoonCount:
          type: integer
        dueSoonTotal:
          type: integer
    CostChangeItem:
      type: object
      description: |
        Satu butir per barang. oldCost = modal satuan eceran saat butir dibuat; newCost = modal
        satuan eceran sekarang; price = harga jual eceran sekarang (semua rupiah).
      required: [productId, productName, unitName, oldCost, newCost, price, changedAt, source]
      properties:
        productId:
          type: string
        productName:
          type: string
        unitName:
          type: string
          description: Nama satuan eceran.
        oldCost:
          type: integer
        newCost:
          type: integer
        price:
          type: integer
        changedAt:
          type: integer
          format: int64
          description: Waktu perubahan modal terakhir (epoch ms UTC).
        source:
          $ref: "#/components/schemas/PriceSource"
    StockOutItem:
      type: object
      required: [productId, productName]
      properties:
        productId:
          type: string
        productName:
          type: string
    OwnerTodaySummary:
      type: object
      description: |
        Semua uang integer rupiah. revenue, grossProfit, newCredit, dan avgTicket hanya menghitung
        penjualan berstatus selesai (semua field bertipe omzet hanya menghitung penjualan selesai). avgTicket = round_half_up(revenue / salesCount), 0 bila tidak ada penjualan.
      required: [date, weekdayLastWeek, revenue, grossProfit, salesCount, newCredit, avgTicket, lastWeekRevenue, hourly, attention]
      properties:
        date:
          type: string
          format: date
          description: Tanggal bisnis hari ini di Asia/Jakarta (YYYY-MM-DD).
        weekdayLastWeek:
          type: string
          description: Nama hari Bahasa Indonesia untuk hari yang sama minggu lalu, mis. "Jumat".
        revenue:
          type: integer
        grossProfit:
          type: integer
          description: Jumlah untuk penjualan selesai hari ini dari (total penjualan - HPP yang disalin saat penjualan terjadi) (rupiah); HPP saat ini tidak dipakai untuk penjualan lampau.
        salesCount:
          type: integer
          description: Jumlah penjualan selesai hari ini.
        newCredit:
          type: integer
          description: Jumlah bagian kasbon (metode pembayaran credit) dari penjualan selesai hari ini (rupiah).
        avgTicket:
          type: integer
        lastWeekRevenue:
          type: integer
          description: Omzet penjualan selesai pada hari yang sama minggu lalu dari 00.00 sampai akhir menit saat ini (menit berjalan ikut dihitung) (Asia/Jakarta), pembanding sepadan untuk omzet hari ini.
        hourly:
          type: array
          minItems: 24
          maxItems: 24
          description: Tepat 24 bucket; indeks = jam lokal Asia/Jakarta (0-23).
          items:
            $ref: "#/components/schemas/HourBucket"
        attention:
          $ref: "#/components/schemas/Attention"
    Session:
      type: object
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/User"
    PinLoginRequest:
      type: object
      required: [userId, pin]
      properties:
        userId:
          type: string
        pin:
          type: string
          pattern: '^\d{6}$'
    Shift:
      type: object
      required: [id, kasirId, kasirName, openedAt, openingCash]
      properties:
        id:
          type: string
        kasirId:
          type: string
        kasirName:
          type: string
        openedAt:
          type: integer
          format: int64
        openingCash:
          type: integer
    CurrentShift:
      type: object
      required: [shift]
      properties:
        shift:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Shift"
    OpenShiftRequest:
      type: object
      required: [openingCash]
      properties:
        openingCash:
          type: integer
          minimum: 0
        openingNote:
          type: string
          nullable: true
          minLength: 1
          maxLength: 200
          description: |
            Alasan modal berbeda dari saran (S4), wajib bila openingCash ≠ saran server (tanpa → 422
            OPENING_MISMATCH); diabaikan dan disimpan null bila modal sama dengan saran atau tanpa
            saran. Data pemilik: tidak pernah dikirim balik ke kasir.
    OpeningSuggestion:
      type: object
      description: |
        Saran modal awal (S4, K8): suggestedCash = max(0, lastCountedCash − ownerTakes); semua null
        dan ownerTakes 0 bila belum ada shift tutup. Hanya key ini (tanpa catatan modal atau rincian
        pengambilan pemilik).
      required: [suggestedCash, lastKasirName, lastClosedAt, lastCountedCash, ownerTakes]
      properties:
        suggestedCash:
          type: integer
          nullable: true
          minimum: 0
        lastKasirName:
          type: string
          nullable: true
          description: Kasir shift tutup terakhir.
        lastClosedAt:
          type: integer
          format: int64
          nullable: true
          description: Jam shift tutup terakhir ditutup (epoch ms UTC).
        lastCountedCash:
          type: integer
          nullable: true
          description: Uang fisik tutup shift terakhir.
        ownerTakes:
          type: integer
          minimum: 0
          description: Σ uang yang diambil pemilik dari laci setelah shift itu tutup (belum dibatalkan, belum terpakai).
    ExpenseInput:
      type: object
      required: [id, amount, reason]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 64
          description: ID dari klien (idempotensi per pembuat); id yang sama mengembalikan rekaman lama dengan 200.
        amount:
          type: integer
          minimum: 1
        reason:
          type: string
          minLength: 1
          maxLength: 200
          description: Alasan kas keluar, wajib (1..200 karakter setelah trim).
    DrawerExpense:
      type: object
      description: |
        Kas keluar dari laci (S2) untuk kasir; hanya key ini (tanpa data pembatal: siapa, jam, atau
        alasan batal).
      required: [id, at, amount, reason, kasirName, shiftId, status]
      properties:
        id:
          type: string
        at:
          type: integer
          format: int64
          description: Jam server saat dicatat (epoch ms UTC).
        amount:
          type: integer
          minimum: 1
        reason:
          type: string
        kasirName:
          type: string
          description: Nama pencatat (salinan saat dicatat).
        shiftId:
          type: string
        status:
          type: string
          enum: [aktif, dibatalkan]
    ExpenseCancel:
      type: object
      required: [at, byName, reason, channel]
      properties:
        at:
          type: integer
          format: int64
          description: Jam server saat dibatalkan (epoch ms UTC).
        byName:
          type: string
          description: Nama pembatal (boleh beda dari pencatat).
        reason:
          type: string
        channel:
          type: string
          enum: [kasir, pemilik]
          description: kasir = dibatalkan di shift yang buka (kejadian batal_kas_keluar); pemilik = dari app pemilik, laci tidak disentuh.
    OwnerDrawerExpense:
      description: |
        Kas keluar untuk pemilik: DrawerExpense + data pembatalan. cancellable = pemilik boleh
        membatalkan (shift tempatnya sudah tutup dan belum dibatalkan); kas keluar shift yang masih
        buka hanya bisa dibatalkan dari kasir.
      allOf:
        - $ref: "#/components/schemas/DrawerExpense"
        - type: object
          required: [cancelled, cancellable]
          properties:
            cancelled:
              nullable: true
              allOf:
                - $ref: "#/components/schemas/ExpenseCancel"
            cancellable:
              type: boolean
    CloseShiftRequest:
      type: object
      required: [countedCash]
      properties:
        countedCash:
          type: integer
          minimum: 0
    ShiftClosure:
      type: object
      description: |
        Satu rumus laci (dipakai tutup shift kasir dan rincian shift pemilik): expectedCash =
        openingCash + cashSales − supplierPayments + creditPayments − saleRefunds − expenses −
        ownerTakes; difference = countedCash − expectedCash.
      required: [shiftId, openingCash, cashSales, supplierPayments, creditPayments, saleRefunds, expenses, ownerTakes, expectedCash, countedCash, difference, salesCount]
      properties:
        shiftId:
          type: string
        openingCash:
          type: integer
        cashSales:
          type: integer
        supplierPayments:
          type: integer
          description: Σ uang keluar ke supplier di shift ini, bertanda; expectedCash = openingCash + cashSales − supplierPayments + creditPayments − saleRefunds − expenses − ownerTakes
        creditPayments:
          type: integer
          description: |
            Σ pelunasan kasbon tunai jalur kasir di shift ini, dikurangi pelunasan tunai shift ini yang
            dibatalkan kasir; tidak pernah negatif. QRIS dan uang pemilik (transfer/tunai ke pemilik)
            tidak masuk laci.
        saleRefunds:
          type: integer
          description: |
            Σ uang yang dikembalikan dari laci shift ini untuk transaksi yang dibatalkan kasir: bagian
            tunai transaksi shift lama + bagian QRIS yang dikembalikan tunai dari laci (shift ini atau
            shift lama). Bagian tunai transaksi shift ini tidak masuk karena cashSales sudah
            dikurangi; shift lama tidak diubah. expectedCash = openingCash + cashSales −
            supplierPayments + creditPayments − saleRefunds − expenses − ownerTakes
        expenses:
          type: integer
          minimum: 0
          description: |
            Σ kas keluar beralasan (S2) di shift ini yang tidak dibatalkan; kas keluar yang dibatalkan
            kasir selagi shift buka tidak ikut. Pembatalan dari app pemilik setelah shift tutup tidak
            mengubah closure tersimpan.
        ownerTakes:
          type: integer
          minimum: 0
          description: |
            Σ uang yang diambil pemilik dari laci selama shift ini buka (S5) dan tidak dibatalkan.
            Pengambilan di sela shift tidak masuk di sini; ia mengurangi saran modal shift berikutnya.
        expectedCash:
          type: integer
        countedCash:
          type: integer
        difference:
          type: integer
        salesCount:
          type: integer
    KasirSettings:
      type: object
      required: [storeName, autoPrint, curahFractions, quickCurahProductIds, qrisImageUrl, allowNegativeStock, ownerPhone, shiftMaxHours]
      properties:
        storeName:
          type: string
        autoPrint:
          type: boolean
        curahFractions:
          type: array
          description: Pecahan curah dalam qtyBase.
          items:
            type: integer
        quickCurahProductIds:
          type: array
          items:
            type: string
        qrisImageUrl:
          type: string
        allowNegativeStock:
          type: boolean
        ownerPhone:
          type: string
          nullable: true
          description: |
            Nomor telepon pemilik untuk baris "Ragu? Telepon pemilik: {nomor}" di dialog alasan
            kasir (R11); null bila belum diisi atau request tanpa sesi kasir (K19).
        shiftMaxHours:
          type: integer
          minimum: 1
          maximum: 24
          description: |
            Turunan AttentionRules.shiftMaxHours (S3, K19). Pita shift kelamaan tampil bila jam
            sekarang − openedAt > shiftMaxHours jam (ketat; tepat 12 jam belum).
    WholesaleTier:
      type: object
      description: |
        Harga grosir per satuan jual. Berlaku hanya bila qtyBase kelipatan unitSize;
        jumlah = qtyBase / unitSize (dalam satuan jual) dan dipakai tier dengan minQty
        terbesar yang <= jumlah. minQty dalam satuan jual, bukan satuan dasar.
      required: [minQty, price]
      properties:
        minQty:
          type: integer
        price:
          type: integer
    ProductUnit:
      type: object
      required: [id, productId, name, unitSize, price, wholesaleTiers, barcodes]
      properties:
        id:
          type: string
        productId:
          type: string
        name:
          type: string
        unitSize:
          type: integer
          minimum: 1
          description: Jumlah satuan dasar per satuan jual.
        price:
          type: integer
        wholesaleTiers:
          type: array
          items:
            $ref: "#/components/schemas/WholesaleTier"
        barcodes:
          type: array
          items:
            type: string
    Product:
      type: object
      required: [id, name, storeCode, isCurah, baseUnit, units]
      properties:
        id:
          type: string
        name:
          type: string
        storeCode:
          type: string
        isCurah:
          type: boolean
        baseUnit:
          type: string
          enum: [pcs, gram, ml]
        units:
          type: array
          items:
            $ref: "#/components/schemas/ProductUnit"
    ProductStatus:
      type: string
      description: |
        aktif; tidak_diambil = tetap dijual sampai habis, tanpa peringatan menipis;
        nonaktif = tidak muncul di kasir (pencarian, scan, curah cepat), riwayat tetap;
        menunggu_harga = barang baru dari barang masuk, semua satuannya price 0 sampai pemilik
        menyimpan form barang dengan harga jual (lalu aktif); tidak muncul di pencarian dan curah
        cepat kasir, scan/kode → 410 PRODUCT_NO_PRICE.
      enum: [aktif, tidak_diambil, nonaktif, menunggu_harga]
    StockAlert:
      type: string
      description: |
        minus bila stok < 0; menipis bila 0 <= stok < minStock (minStock null = tanpa batas);
        selain itu none. Penanda diam: stockCounted false (Stok belum dihitung) → none, tidak
        menipis maupun minus; scarce (Sedang langka) dan status tidak_diambil hanya membungkam
        menipis (minus tetap muncul); status nonaktif → none.
      enum: [none, menipis, minus]
    PriceSource:
      type: string
      description: |
        pemilik = diubah di aplikasi pemilik; impor = lewat Impor Excel; barang_masuk = HPP dari
        nota barang masuk; ubah_nota = HPP dari nota yang diubah atau dibatalkan.
      enum: [pemilik, impor, barang_masuk, ubah_nota]
    ProductCost:
      type: object
      description: |
        HPP: amount rupiah per qtyBase satuan dasar.
        Modal satuan = round_half_up(amount × unitSize ÷ qtyBase).
      required: [amount, qtyBase]
      properties:
        amount:
          type: integer
          minimum: 0
        qtyBase:
          type: integer
          minimum: 1
    OwnerProductUnit:
      description: Satuan jual versi pemilik (field ProductUnit ditambah modal dan status satuan).
      allOf:
        - $ref: "#/components/schemas/ProductUnit"
        - type: object
          required: [cost, active, sold]
          properties:
            cost:
              type: integer
              nullable: true
              description: Modal satuan ini (rupiah) dari HPP barang; null bila HPP belum diisi.
            active:
              type: boolean
              description: false = satuan nonaktif (tidak dijual di kasir; barcodenya tetap terpakai).
            sold:
              type: boolean
              description: Satuan pernah terjual (isi dikunci; bila diganti dinonaktifkan, bukan dihapus).
    OwnerProductRow:
      type: object
      description: Baris daftar barang pemilik; unitName, unitSize, dan price = satuan eceran.
      required: [id, name, storeCode, category, status, scarce, stockCounted, isCurah, baseUnit, unitName, unitSize, price, barcodes, stock, stockAlert]
      properties:
        id:
          type: string
        name:
          type: string
        storeCode:
          type: string
        category:
          type: string
          nullable: true
        status:
          $ref: "#/components/schemas/ProductStatus"
        scarce:
          type: boolean
          description: Tanda Sedang langka.
        stockCounted:
          type: boolean
          description: false = Stok belum dihitung (belum pernah opname); barang masuk tidak mengubahnya, kecuali barang baru dari nota yang langsung terhitung.
        isCurah:
          type: boolean
        baseUnit:
          type: string
          enum: [pcs, gram, ml]
        unitName:
          type: string
        unitSize:
          type: integer
          minimum: 1
        price:
          type: integer
        barcodes:
          type: array
          description: Barcode semua satuan (untuk pencarian).
          items:
            type: string
        stock:
          type: integer
          description: Stok dalam qtyBase.
        stockAlert:
          $ref: "#/components/schemas/StockAlert"
    OwnerProduct:
      type: object
      required: [id, name, storeCode, category, status, scarce, stockCounted, isCurah, baseUnit, units, cost, stock, minStock, stockAlert, hasSales, hasReceipts, costAlert, recentMovements, priceHistory]
      properties:
        id:
          type: string
        name:
          type: string
        storeCode:
          type: string
        category:
          type: string
          nullable: true
        status:
          $ref: "#/components/schemas/ProductStatus"
        scarce:
          type: boolean
          description: Tanda Sedang langka.
        stockCounted:
          type: boolean
          description: false = Stok belum dihitung (belum pernah opname); barang masuk tidak mengubahnya, kecuali barang baru dari nota yang langsung terhitung.
        isCurah:
          type: boolean
        baseUnit:
          type: string
          enum: [pcs, gram, ml]
        units:
          type: array
          description: Semua satuan termasuk nonaktif; units[0] = satuan eceran.
          minItems: 1
          items:
            $ref: "#/components/schemas/OwnerProductUnit"
        cost:
          nullable: true
          description: HPP barang; null bila modal belum diisi.
          allOf:
            - $ref: "#/components/schemas/ProductCost"
        stock:
          type: integer
          description: Stok dalam qtyBase.
        minStock:
          type: integer
          nullable: true
          description: Batas stok menipis dalam qtyBase (satuan dasar); null = tanpa batas.
        stockAlert:
          $ref: "#/components/schemas/StockAlert"
        hasSales:
          type: boolean
          description: Barang pernah terjual (tidak bisa dihapus).
        hasReceipts:
          type: boolean
          description: Barang punya barang masuk aktif → modal mengikuti barang masuk; isian modal diabaikan.
        costAlert:
          nullable: true
          description: Peringatan modal berubah yang belum ditindaklanjuti.
          allOf:
            - $ref: "#/components/schemas/CostAlert"
        recentMovements:
          type: array
          description: Mutasi stok, terbaru dulu.
          maxItems: 5
          items:
            $ref: "#/components/schemas/StockMovement"
        priceHistory:
          type: array
          description: Riwayat harga jual, terbaru dulu.
          items:
            $ref: "#/components/schemas/PriceHistoryEntry"
    CostAlert:
      type: object
      description: fromCost = HPP saat peringatan dibuat; changedAt dan source = perubahan modal terakhir.
      required: [fromCost, changedAt, source]
      properties:
        fromCost:
          $ref: "#/components/schemas/ProductCost"
        changedAt:
          type: integer
          format: int64
        source:
          $ref: "#/components/schemas/PriceSource"
    StockMovement:
      type: object
      required: [id, at, kind, qtyBase, kasirName, reason]
      properties:
        id:
          type: string
        at:
          type: integer
          format: int64
          description: |
            Waktu dicatat di server (epoch ms UTC), untuk semua jenis termasuk opname dan stok_awal.
            Jam hitung yang berlaku untuk koreksi opname (waktu efektif, K7) hanya dipakai server
            untuk stok pada jam tertentu dan tidak diekspos.
        kind:
          type: string
          description: |
            jual / batal = penjualan dan pembatalannya; masuk = barang masuk; koreksi_masuk = nota
            barang masuk diubah; batal_masuk = nota barang masuk dibatalkan; opname = koreksi stok
            dari selisih opname; stok_awal = hitungan opname pertama menjadi stok;
            keluar_kedaluwarsa = dikeluarkan dari stok karena kedaluwarsa.
          enum: [jual, batal, masuk, koreksi_masuk, batal_masuk, opname, stok_awal, keluar_kedaluwarsa]
        qtyBase:
          type: integer
          description: |
            Bertanda; jual negatif, batal positif, masuk positif, koreksi_masuk bertanda, batal_masuk
            negatif, opname bertanda, stok_awal bertanda, keluar_kedaluwarsa negatif.
        kasirName:
          type: string
          description: nama orang yang mencatat
        reason:
          nullable: true
          description: Alasan selisih untuk opname (K27); null untuk jenis lain.
          allOf:
            - $ref: "#/components/schemas/OpnameReason"
    PriceHistoryEntry:
      type: object
      required: [id, at, unitId, unitName, isEceran, unitSize, tierMinQty, oldPrice, newPrice, source]
      properties:
        id:
          type: string
        at:
          type: integer
          format: int64
        unitId:
          type: string
        unitName:
          type: string
        isEceran:
          type: boolean
        unitSize:
          type: integer
        tierMinQty:
          type: integer
          nullable: true
          description: null = harga normal satuan; terisi = harga tier grosir dengan minQty ini.
        oldPrice:
          type: integer
          nullable: true
          description: null = baris harga baru ditambah.
        newPrice:
          type: integer
          nullable: true
          description: null = baris harga dihapus.
        source:
          $ref: "#/components/schemas/PriceSource"
    ProductInput:
      type: object
      description: |
        Isi form barang, mengikuti template Excel. Uang integer rupiah. minStock dan bigUnit.size
        dalam satuan eceran (minStock boleh pecahan untuk kg, ons, dan liter).
      required: [name, category, sellUnit, barcode, cost, price, tier, bigUnit, minStock]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        category:
          type: string
          nullable: true
        sellUnit:
          type: string
          minLength: 1
          maxLength: 20
          description: Dijual per; kg, ons, liter, dan l = barang curah.
        barcode:
          type: string
          nullable: true
          description: "EAN-13, UPC-A, EAN-8, atau GTIN-14 (ITF-14 di dus); check digit GS1 mod-10; unik di semua satuan semua barang termasuk nonaktif."
        cost:
          type: integer
          nullable: true
          minimum: 0
          description: Modal eceran; diabaikan bila bigUnit.cost terisi.
        price:
          type: integer
          minimum: 1
        tier:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/WholesaleTier"
        bigUnit:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/BigUnitInput"
        minStock:
          type: number
          nullable: true
          description: "dalam satuan eceran; ≥ 0; untuk pcs harus bulat; server mengonversi ke qtyBase"
    BigUnitInput:
      type: object
      required: [unitId, name, size, barcode, cost, price]
      properties:
        unitId:
          type: string
          nullable: true
          description: Satuan besar yang diubah; null = satuan besar baru.
        name:
          type: string
        size:
          type: integer
          minimum: 2
          description: Isi dalam satuan eceran.
        barcode:
          type: string
          nullable: true
          description: "EAN-13, UPC-A, EAN-8, atau GTIN-14 (ITF-14 di dus); check digit GS1 mod-10; unik di semua satuan semua barang termasuk nonaktif."
        cost:
          type: integer
          nullable: true
          minimum: 0
        price:
          type: integer
          minimum: 1
    ProductStatusInput:
      type: object
      required: [status, scarce]
      properties:
        status:
          $ref: "#/components/schemas/ProductStatus"
        scarce:
          type: boolean
    PriceUpdate:
      type: object
      required: [lines]
      properties:
        lines:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/PriceLineInput"
    PriceLineInput:
      type: object
      required: [unitId, tierMinQty, price]
      properties:
        unitId:
          type: string
        tierMinQty:
          type: integer
          nullable: true
          description: null = harga normal satuan; terisi = tier grosir dengan minQty ini.
        price:
          type: integer
          minimum: 1
    ProductField:
      type: string
      description: Field form barang (= kolom template Excel B–O).
      enum: [name, category, sellUnit, barcode, cost, price, tierMinQty, tierPrice, bigName, bigSize, bigBarcode, bigCost, bigPrice, minStock]
    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          $ref: "#/components/schemas/ProductField"
        message:
          type: string
    ProductValidationProblem:
      description: Problem VALIDATION dengan pesan per field form barang.
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [code, errors]
          properties:
            code:
              type: string
              enum: [VALIDATION]
            errors:
              type: array
              items:
                $ref: "#/components/schemas/FieldError"
    ImportRow:
      type: object
      description: Satu baris sheet Barang; sel B–O berupa teks yang di-trim, null = kosong.
      required: [row, name, category, sellUnit, barcode, cost, price, tierMinQty, tierPrice, bigName, bigSize, bigBarcode, bigCost, bigPrice, minStock]
      properties:
        row:
          type: integer
          minimum: 3
          description: Nomor baris Excel (data mulai baris 3).
        name:
          type: string
          nullable: true
        category:
          type: string
          nullable: true
        sellUnit:
          type: string
          nullable: true
        barcode:
