    StaffReceiptRow:
      type: object
      required: [id, supplierName, notaDate, total, lineCount, status, createdAt]
      properties:
        id:
          type: string
        supplierName:
          type: string
        notaDate:
          type: string
          format: date
        total:
          type: integer
        lineCount:
          type: integer
        status:
