        - $ref: "#/components/schemas/OwnerCustomerRow"
        - type: object
          required: [history]
          properties:
            history:
              type: array
              description: Terbaru dulu.
              items:
                $ref: "#/components/schemas/CreditHistoryEntry"
    StaffUnit:
      type: object
      description: Satuan barang untuk orang toko; tanpa harga jual, modal, dan stok.
