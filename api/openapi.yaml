          type: string
        action:
          $ref: "#/components/schemas/ReceiptAuditAction"
        changes:
          type: array
          description: Baris perubahan yang sudah berupa teks, mis. "Supplier A → B".
          items:
            type: string
    OwnerReceiptRow:
      type: object
      required: [id, supplierName, notaDate, total, lineCount, status, payment, paid, createdAt, createdByName, editedByName]
      properties:
        id:
          type: string
        supplierName:
          type: string
        notaDate:
          type: string
          format: date
        total:
          type: integer
        lineCount:
          type: integer
        status:
          $ref: "#/components/schemas/ReceiptStatus"
        payment:
          $ref: "#/components/schemas/ReceiptPayment"
        paid:
          nullable: true
          description: Pelunasan utang; null bila belum lunas atau bukan Bayar nanti.
