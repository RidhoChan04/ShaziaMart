openapi: 3.0.3
info:
  title: ShaziaMart API
  version: 0.1.0
  description: |
    Kontrak API kasir sembako. Sumber kebenaran tunggal untuk frontend dan backend.
    Semua uang dan jumlah berupa integer (rupiah utuh; qtyBase dalam satuan dasar pcs/gram/ml).
    Semua waktu berupa integer epoch milidetik UTC. Error memakai application/problem+json.
    Autentikasi memakai cookie sesi kasir_session. Endpoint shift, sales, dan session
    memerlukan sesi; health, users, pin-login, settings, catalog, dan customers publik
    (satu PC di localhost).

    Endpoint pemilik berada di bawah /api/owner dengan realm cookie terpisah total dari kasir:
    owner_session (berlaku 30 hari). Sesi kasir tidak berlaku di sana dan sebaliknya.
    HPP dan laba hanya muncul di endpoint /api/owner; endpoint kasir tidak pernah memuatnya.
    Data barang: kategori, status, stok, dan modal hanya di /api/owner.
    Hari bisnis memakai zona Asia/Jakarta.

    Endpoint orang toko (HP) berada di bawah /api/staff dengan realm cookie ketiga:
    staff_session (akun ber-role kasir, nama + PIN). Sesi kasir dan pemilik tidak berlaku di sana
    dan sebaliknya; masuk/keluar di satu realm tidak menyentuh dua lainnya. Realm ini hanya untuk
    Wi-Fi toko (LAN): setiap request /api/staff (termasuk login) yang membawa header
    Cf-Connecting-Ip atau Cf-Ray ditolak 403 STAFF_LAN_ONLY sebelum apa pun, dan backend menolak
    semua yang bukan LAN (gagal-tertutup). HPP, modal, harga jual, stok, dan laba tidak pernah
    ada di respons /api/staff; satu-satunya angka uang adalah unitCost (harga beli yang diketik)
    beserta subtotal/total pada nota milik staf itu sendiri.
    Tanggal kalender (notaDate, dueDate, expiryDate) berupa string YYYY-MM-DD menurut kalender
    Asia/Jakarta.
tags:
  - name: system
  - name: auth
  - name: shift
  - name: catalog
  - name: sales
  - name: credit
  - name: inventory
  - name: reports
  - name: settings
  - name: owner
  - name: staff
paths:
  /api/health:
    get:
      tags: [system]
      operationId: getHealth
      summary: Status layanan
      responses:
        "200":
          description: Layanan sehat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: Layanan terdegradasi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /api/users/kasir:
    get:
      tags: [auth]
      operationId: listKasirUsers
      summary: Daftar pengguna kasir untuk layar PIN
      responses:
        "200":
          description: Pengguna kasir
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
  /api/auth/pin-login:
    post:
      tags: [auth]
      operationId: pinLogin
      summary: Masuk dengan PIN kasir
      description: PIN_INVALID (401) bila PIN salah; LOCKED_OUT (423) bila terlalu banyak percobaan.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PinLoginRequest"
      responses:
        "200":
          description: Sesi dibuat (cookie kasir_session diset)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/PinInvalid"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "423":
          $ref: "#/components/responses/LockedOut"
  /api/auth/session:
    get:
      tags: [auth]
      operationId: getSession
      summary: Sesi aktif
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Sesi aktif
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Keluar (kunci layar)
      security:
        - cookieAuth: []
      responses:
        "204":
          description: Sesi dihapus
  /api/shifts/current:
    get:
      tags: [shift]
      operationId: getCurrentShift
      summary: Shift yang sedang terbuka
      description: Tanpa sesi — layar kunci perlu tahu kasir shift sebelum PIN dimasukkan.
      responses:
        "200":
          description: Shift saat ini; shift bernilai null bila belum ada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentShift"
  /api/shifts:
    post:
      tags: [shift]
      operationId: openShift
      summary: Buka shift
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenShiftRequest"
      responses:
        "201":
          description: Shift dibuka
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shift"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/ShiftAlreadyOpen"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/shifts/current/close:
    post:
      tags: [shift]
      operationId: closeShift
      summary: Tutup shift
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CloseShiftRequest"
      responses:
        "200":
          description: Shift ditutup
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShiftClosure"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/ShiftClosed"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/settings/kasir:
    get:
      tags: [settings]
      operationId: getKasirSettings
      summary: Pengaturan layar kasir
      responses:
        "200":
          description: Pengaturan kasir
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KasirSettings"
  /api/catalog/lookup:
    get:
      tags: [catalog]
      operationId: lookupCatalog
      summary: Cari satu barang dari barcode atau kode toko
      description: |
        PRODUCT_INACTIVE (410) bila kode cocok dengan barang nonaktif atau satuan nonaktif;
        PRODUCT_NO_PRICE (410) bila barangnya menunggu_harga (belum punya harga jual).
        Penjualan yang sudah ada di keranjang tetap diterima createSale.
      parameters:
        - name: code
          in: query
          required: true
          description: Barcode atau kode toko (persis)
          schema:
            type: string
      responses:
        "200":
          description: Barang cocok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogMatch"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          description: PRODUCT_INACTIVE atau PRODUCT_NO_PRICE
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: Parameter code kosong atau tidak ada (VALIDATION)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/catalog/search:
    get:
      tags: [catalog]
      operationId: searchCatalog
      summary: Cari barang menurut nama
      description: |
        Mencari menurut nama saja (barcode / kode toko lewat lookupCatalog); q kurang dari
        2 karakter atau hanya angka menghasilkan daftar kosong. Mengembalikan paling banyak 8 hasil,
        tanpa barang nonaktif atau menunggu_harga, dan tanpa satuan nonaktif.
      parameters:
        - name: q
          in: query
          required: true
          description: Kata kunci nama barang
          schema:
            type: string
      responses:
        "200":
          description: Kecocokan, maksimal 8 hasil
          content:
            application/json:
              schema:
                type: array
                maxItems: 8
                items:
                  $ref: "#/components/schemas/CatalogMatch"
  /api/catalog/quick-curah:
    get:
      tags: [catalog]
      operationId: listQuickCurah
      summary: Barang curah pilihan cepat
      description: Sesuai quickCurahProductIds, tanpa barang nonaktif atau menunggu_harga, dan tanpa satuan nonaktif.
      responses:
        "200":
          description: Kecocokan sesuai quickCurahProductIds
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CatalogMatch"
  /api/sales:
    post:
      tags: [sales]
      operationId: createSale
      summary: Simpan penjualan
      description: |
        Idempoten menurut saleId. 401 membawa UNAUTHORIZED atau PIN_INVALID (ownerPin salah).
        409 membawa SHIFT_CLOSED, PRICE_CHANGED (PriceChangedProblem), atau CREDIT_LIMIT
        (CreditLimitProblem). 422 membawa VALIDATION atau INVALID_QUANTITY.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaleRequest"
      responses:
        "200":
          description: saleId sudah pernah disimpan; penjualan lama dikembalikan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sale"
        "201":
          description: Penjualan dibuat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sale"
        "401":
          $ref: "#/components/responses/UnauthorizedOrPinInvalid"
        "409":
          description: SHIFT_CLOSED, PRICE_CHANGED, atau CREDIT_LIMIT
          content:
            application/problem+json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ShiftClosedProblem"
                  - $ref: "#/components/schemas/PriceChangedProblem"
                  - $ref: "#/components/schemas/CreditLimitProblem"
                discriminator:
                  propertyName: code
                  mapping:
                    SHIFT_CLOSED: "#/components/schemas/ShiftClosedProblem"
                    PRICE_CHANGED: "#/components/schemas/PriceChangedProblem"
                    CREDIT_LIMIT: "#/components/schemas/CreditLimitProblem"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/sales/today:
    get:
      tags: [sales]
      operationId: listTodaySales
      summary: Penjualan hari ini, terbaru dulu
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Penjualan hari ini
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Sale"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/sales/{saleId}/print:
    post:
      tags: [sales]
      operationId: printSale
      summary: Cetak ulang struk
      security:
        - cookieAuth: []
      parameters:
        - name: saleId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Hasil cetak
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrintResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/sales/{saleId}/void:
    post:
      tags: [sales]
      operationId: voidSale
      summary: Batalkan penjualan (PIN pemilik)
      security:
        - cookieAuth: []
      parameters:
        - name: saleId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoidRequest"
      responses:
        "200":
          description: Penjualan dibatalkan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sale"
        "401":
          $ref: "#/components/responses/UnauthorizedOrPinInvalid"
        "403":
          $ref: "#/components/responses/PinRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/customers:
    get:
      tags: [credit]
      operationId: searchCustomers
      summary: Cari pelanggan
      parameters:
        - name: q
          in: query
          required: false
          description: Nama atau telepon
          schema:
            type: string
      responses:
        "200":
          description: Pelanggan
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Customer"
    post:
      tags: [credit]
      operationId: createCustomer
      summary: Tambah pelanggan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewCustomer"
      responses:
        "201":
          description: Pelanggan dibuat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/owner/login:
    post:
      tags: [owner]
      operationId: ownerLogin
      summary: Masuk pemilik dengan nama dan password
      description: |
        LOGIN_INVALID (401) bila nama atau password salah (tanpa membedakan keduanya);
        LOCKED_OUT (423) bila terlalu banyak percobaan. Sukses mengeset cookie owner_session (30 hari).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OwnerLogin"
      responses:
        "200":
          description: Sesi pemilik dibuat (cookie owner_session diset)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerSession"
        "401":
          $ref: "#/components/responses/LoginInvalid"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "423":
          $ref: "#/components/responses/LockedOut"
  /api/owner/session:
    get:
      tags: [owner]
      operationId: getOwnerSession
      summary: Sesi pemilik aktif
      security:
        - ownerCookieAuth: []
      responses:
        "200":
          description: Sesi pemilik aktif
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/owner/logout:
    post:
      tags: [owner]
      operationId: ownerLogout
      summary: Keluar pemilik
      description: Selalu 204 (idempoten), juga tanpa sesi.
      security:
        - ownerCookieAuth: []
      responses:
        "204":
          description: Sesi pemilik dihapus
  /api/owner/summary/today:
    get:
      tags: [owner]
      operationId: getOwnerTodaySummary
      summary: Ringkasan hari ini untuk beranda pemilik
      description: |
        Hari bisnis = hari ini di zona Asia/Jakarta; pembanding = hari yang sama minggu lalu.
        Hanya penjualan berstatus selesai (bukan batal) yang dihitung.
      security:
        - ownerCookieAuth: []
      responses:
        "200":
          description: Ringkasan hari ini
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerTodaySummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/owner/products:
    get:
      tags: [owner]
      operationId: listOwnerProducts
      summary: Daftar semua barang untuk pemilik
      description: Semua barang, termasuk nonaktif; urut nama.
      security:
        - ownerCookieAuth: []
      responses:
        "200":
          description: Barang
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OwnerProductRow"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [owner]
      operationId: createOwnerProduct
      summary: Tambah barang
      description: |
        Barang baru dimulai dengan stok 0, stockCounted false, status aktif.
        Batas min/max di skema adalah panduan klien; server selalu memvalidasi isi mentah dan mengembalikan ProductValidationFailed dengan pesan per field.
      security:
        - ownerCookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Barang dibuat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerProduct"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ProductValidationFailed"
  /api/owner/products/{productId}:
    get:
      tags: [owner]
      operationId: getOwnerProduct
      summary: Detail barang
      security:
        - ownerCookieAuth: []
      parameters:
        - $ref: "#/components/parameters/ProductId"
      responses:
        "200":
          description: Barang
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerProduct"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [owner]
      operationId: updateOwnerProduct
      summary: Ubah barang
      description: |
        Field null menghapus nilainya. Barang yang sudah terjual: 'Dijual per' dan isi satuan
        yang sudah terjual dikunci (422); satuan besar terjual yang diganti dinonaktifkan.
        Barang hasReceipts: cost dan bigUnit.cost diabaikan (HPP mengikuti barang masuk), bukan 422.
        Barang menunggu_harga yang disimpan dengan harga jual menjadi aktif.
        Batas min/max di skema adalah panduan klien; server selalu memvalidasi isi mentah dan mengembalikan ProductValidationFailed dengan pesan per field.
      security:
        - ownerCookieAuth: []
      parameters:
        - $ref: "#/components/parameters/ProductId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "200":
          description: Barang diubah
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerProduct"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ProductValidationFailed"
    delete:
      tags: [owner]
      operationId: deleteOwnerProduct
      summary: Hapus barang permanen
      description: |
        Hanya barang yang belum pernah terjual dan tidak ada di nota barang masuk aktif (hasReceipts);
        selain itu 409 PRODUCT_HAS_SALES (gunakan nonaktif). Detail menyebut alasannya:
        terjual → "Barang yang sudah pernah terjual tidak bisa dihapus — gunakan Nonaktif.",
        ada di barang masuk → "Barang ini sudah ada di barang masuk — pakai Nonaktif".
        Setelah nota dibatalkan, barang bisa dihapus lagi (bila belum pernah terjual).
      security:
        - ownerCookieAuth: []
      parameters:
        - $ref: "#/components/parameters/ProductId"
      responses:
        "204":
          description: Barang dihapus
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ProductHasSales"
  /api/owner/products/{productId}/status:
    put:
      tags: [owner]
      operationId: setOwnerProductStatus
      summary: Ubah status barang dan tanda Sedang langka
      description: |
        Barang menunggu_harga, atau body dengan status menunggu_harga, ditolak 422 VALIDATION
        (detail "Isi harga jual dulu"): status itu hanya diakhiri dengan menyimpan harga jual.
      security:
        - ownerCookieAuth: []
      parameters:
        - $ref: "#/components/parameters/ProductId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductStatusInput"
      responses:
        "200":
          description: Status diubah
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerProduct"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/owner/products/{productId}/prices:
    put:
      tags: [owner]
      operationId: updateOwnerProductPrices
      summary: Ubah harga jual beberapa baris harga sekaligus
      description: |
        Satu baris = harga normal satu satuan (tierMinQty null) atau satu tier grosirnya.
        Sukses juga menghapus peringatan modal barang ini.
      security:
        - ownerCookieAuth: []
      parameters:
        - $ref: "#/components/parameters/ProductId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PriceUpdate"
      responses:
        "200":
          description: Harga diubah
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerProduct"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ProductValidationFailed"
  /api/owner/products/{productId}/cost-alert:
    delete:
      tags: [owner]
      operationId: dismissOwnerCostAlert
      summary: Harga tetap — hapus peringatan modal berubah
      description: Idempoten; 204 juga bila tidak ada peringatan.
      security:
        - ownerCookieAuth: []
      parameters:
        - $ref: "#/components/parameters/ProductId"
      responses:
        "204":
          description: Peringatan dihapus
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/owner/products/{productId}/movements:
    get:
      tags: [owner]
      operationId: listOwnerProductMovements
      summary: Riwayat stok barang
      security:
        - ownerCookieAuth: []
      parameters:
        - $ref: "#/components/parameters/ProductId"
      responses:
        "200":
          description: Mutasi stok, terbaru dulu
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StockMovement"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/owner/categories:
    get:
      tags: [owner]
      operationId: listOwnerCategories
      summary: Daftar kategori barang
      description: Kategori yang dikelola; kategori baru dari form atau impor ditambahkan di akhir.
      security:
        - ownerCookieAuth: []
      responses:
        "200":
          description: Kategori
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/owner/product-imports/check:
    post:
      tags: [owner]
      operationId: checkOwnerProductImport
      summary: Periksa baris impor Excel tanpa menyimpan
      description: Baris yang semua selnya null diabaikan.
      security:
        - ownerCookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportRequest"
      responses:
        "200":
          description: Hasil pemeriksaan per baris
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportCheck"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/owner/product-imports:
    post:
      tags: [owner]
      operationId: commitOwnerProductImport
      summary: Impor baris Excel
      description: |
        Memvalidasi ulang lalu menyimpan baris baru dan diperbarui sekaligus (atomik); baris tidak
        berubah dan baris bermasalah dilewati. Sel kosong tidak menghapus data lama.
        Modal untuk barang hasReceipts diabaikan (HPP mengikuti barang masuk) dan dicatat di notes.
      security:
        - ownerCookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportRequest"
      responses:
        "200":
          description: Impor selesai
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/owner/receipts:
    get:
      tags: [owner]
      operationId: listOwnerReceipts
      summary: Daftar barang masuk (semua staf)
      security:
        - ownerCookieAuth: []
      responses:
        "200":
          description: Nota barang masuk, terbaru dulu (createdAt, lalu id menurun)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OwnerReceiptRow"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/owner/receipts/{receiptId}:
    get:
      tags: [owner]
      operationId: getOwnerReceipt
      summary: Detail nota barang masuk dengan riwayat perubahan
      security:
        - ownerCookieAuth: []
      parameters:
        - $ref: "#/components/parameters/ReceiptId"
      responses:
        "200":
          description: Nota
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerReceipt"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/owner/receipts/{receiptId}/cancel:
    post:
      tags: [owner]
      operationId: cancelOwnerReceipt
      summary: Batalkan nota barang masuk
      description: |
        Membuat entri balik: stok (batal_masuk), HPP (PriceSource ubah_nota), utang yang belum lunas
        dihapus, dan uang keluar laci dikoreksi. Idempoten: nota yang sudah dibatalkan dikembalikan
        apa adanya.
        Boleh setelah shift saat nota dicatat ditutup; koreksi uang laci dicatat sebagai baris uang
        keluar baru di shift yang sedang buka (shift lama tidak diubah; tanpa shift buka: tidak
        dicatat, audit memuat catatannya).
      security:
        - ownerCookieAuth: []
      parameters:
        - $ref: "#/components/parameters/ReceiptId"
      responses:
        "200":
          description: Nota dibatalkan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerReceipt"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/owner/receipt-photos/{photoId}:
    get:
      tags: [owner]
      operationId: getOwnerReceiptPhoto
      summary: Foto nota (JPEG)
      security:
        - ownerCookieAuth: []
      parameters:
        - $ref: "#/components/parameters/PhotoId"
      responses:
        "200":
          description: Foto nota
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/owner/supplier-debts:
    get:
      tags: [owner]
      operationId: listOwnerSupplierDebts
      summary: Utang ke supplier (nota Bayar nanti)
      security:
        - ownerCookieAuth: []
      responses:
        "200":
          description: Utang supplier dan shift laci yang sedang buka
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupplierDebtList"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/owner/supplier-debts/{receiptId}/pay:
    post:
      tags: [owner]
      operationId: payOwnerSupplierDebt
      summary: Tandai utang supplier lunas
      description: |
        Lunas penuh (tanpa pelunasan sebagian). tunai + laci dicatat sebagai uang keluar di shift
        yang sedang buka. 409 membawa DEBT_ALREADY_PAID, RECEIPT_CANCELLED, atau SHIFT_CLOSED
        (laci dipilih tanpa shift buka). 422 VALIDATION bila cashSource tidak cocok dengan method.
      security:
        - ownerCookieAuth: []
      parameters:
        - $ref: "#/components/parameters/ReceiptId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PayDebtInput"
      responses:
        "200":
          description: Utang lunas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupplierDebt"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: DEBT_ALREADY_PAID, RECEIPT_CANCELLED, atau SHIFT_CLOSED
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/owner/opname-sessions:
    get:
      tags: [owner]
      operationId: listOwnerOpnameSessions
      summary: Hasil opname (semua orang toko)
      security:
        - ownerCookieAuth: []
      responses:
        "200":
          description: Sesi opname, terbaru dulu (submittedAt)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OwnerOpnameRow"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/owner/opname-sessions/{sessionId}:
    get:
      tags: [owner]
      operationId: getOwnerOpnameSession
      summary: Detail hasil opname dengan nilai rupiah selisih
      security:
        - ownerCookieAuth: []
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Sesi opname
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerOpnameSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/owner/opname-sessions/{sessionId}/items/{productId}/approve:
    post:
      tags: [owner]
      operationId: approveOpnameItem
      summary: Setujui selisih yang ditahan
      description: |
        Hanya barang berstate ditahan: stok disesuaikan sebesar diffQtyBase (entri ledger opname
        dengan alasan barang itu, waktu efektif = countedAt asli), state → disetujui, resolvedByName
        dan resolvedAt diisi. Barang yang tidak ditahan (termasuk yang sudah disetujui, dihitung
        ulang, atau diganti) → 409 OPNAME_NOT_HELD tanpa perubahan; stok disesuaikan tepat sekali.
      security:
        - ownerCookieAuth: []
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/ProductId"
      responses:
        "200":
          description: Sesi setelah disetujui
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerOpnameSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/OpnameNotHeld"
  /api/owner/opname-sessions/{sessionId}/items/{productId}/recount:
    post:
      tags: [owner]
      operationId: recountOpnameItem
      summary: Hitung ulang barang yang ditahan
      description: |
        Hanya barang berstate ditahan (selain itu 409 OPNAME_NOT_HELD tanpa perubahan). Hitungan
        pemilik langsung disesuaikan tanpa batas (J5): selisih = qtyBase − stok sekarang, entri
        ledger opname dengan waktu efektif = sekarang; state → dihitung_ulang dan recount diisi.
        qtyBase tidak valid → 422 VALIDATION.
      security:
        - ownerCookieAuth: []
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/ProductId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpnameRecountInput"
      responses:
        "200":
          description: Sesi setelah hitung ulang
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerOpnameSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/OpnameNotHeld"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/owner/opname-sessions/{sessionId}/review:
    post:
      tags: [owner]
      operationId: reviewOpnameSession
      summary: Tandai sesi bertanda selisih besar sudah ditinjau
      description: |
        Mengisi reviewedByName dan reviewedAt; sesi hilang dari Attention.opnameFlags. Idempoten:
        sesi yang sudah ditinjau dikembalikan apa adanya. flagged tidak berubah.
      security:
        - ownerCookieAuth: []
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Sesi setelah ditinjau
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerOpnameSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/owner/expiry:
    get:
      tags: [owner]
      operationId: getOwnerExpiry
      summary: Barang sudah/segera kedaluwarsa dengan perkiraan kerugian
      description: |
        Sama dengan getStaffExpiry ditambah nilai rupiah dari HPP sekarang (lossValue per kiriman
        dan expiredLossValue); log keluar memakai lossValue yang disimpan saat kejadian.
      security:
        - ownerCookieAuth: []
      responses:
        "200":
          description: Kiriman ber-ED dan log terbaru
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerExpiryList"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/owner/expiry-removals:
    post:
      tags: [owner]
      operationId: createOwnerExpiryRemoval
      summary: Keluarkan barang kedaluwarsa dari stok (pemilik)
      description: Aturan sama dengan createStaffExpiryRemoval; tercatat atas nama pemilik.
      security:
        - ownerCookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpiryRemovalInput"
      responses:
        "204":
          description: Dikeluarkan (atau id sudah pernah dicatat pengguna ini)
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/owner/receipts/{receiptId}/lines/{lineId}/expiry:
    put:
      tags: [owner]
      operationId: putOwnerLineExpiry
      summary: Ubah tanggal ED satu kiriman (pemilik)
      description: Aturan sama dengan putStaffLineExpiry; berlaku untuk nota siapa pun.
      security:
        - ownerCookieAuth: []
      parameters:
        - $ref: "#/components/parameters/ReceiptId"
        - $ref: "#/components/parameters/LineId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpiryDateInput"
      responses:
        "204":
          description: Tanggal ED tersimpan
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/staff/users:
    get:
      tags: [staff]
      operationId: listStaffUsers
      summary: Daftar akun yang bisa masuk di HP orang toko
      description: Hanya pengguna ber-role kasir.
      responses:
        "200":
          description: Pengguna kasir
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "403":
          $ref: "#/components/responses/LanOnly"
  /api/staff/login:
    post:
      tags: [staff]
      operationId: staffLogin
      summary: Masuk orang toko dengan PIN kasir
      description: |
        PIN_INVALID (401) bila PIN salah atau akun bukan kasir; LOCKED_OUT (423) bila terlalu banyak
        percobaan. Hitungan PIN salah dan kunci realm orang toko terpisah dari login kasir; gagal di
        HP tidak mengunci PC kasir, dan sebaliknya. Sukses mengeset cookie staff_session tanpa
        menyentuh kasir_session atau owner_session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PinLoginRequest"
      responses:
        "200":
          description: Sesi orang toko dibuat (cookie staff_session diset)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/PinInvalid"
        "403":
          $ref: "#/components/responses/LanOnly"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "423":
          $ref: "#/components/responses/LockedOut"
  /api/staff/session:
    get:
      tags: [staff]
      operationId: getStaffSession
      summary: Sesi orang toko aktif
      security:
        - staffCookieAuth: []
      responses:
        "200":
          description: Sesi aktif
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/LanOnly"
  /api/staff/logout:
    post:
      tags: [staff]
      operationId: staffLogout
      summary: Keluar orang toko
      description: Selalu 204 (idempoten), juga tanpa sesi; hanya menghapus staff_session.
      responses:
        "204":
          description: Sesi orang toko dihapus
        "403":
          $ref: "#/components/responses/LanOnly"
  /api/staff/shift:
    get:
      tags: [staff]
      operationId: getStaffShift
      summary: Shift kasir yang sedang buka (untuk pilihan Dari laci kasir)
      security:
        - staffCookieAuth: []
      responses:
        "200":
          description: Shift laci saat ini; shift bernilai null bila tidak ada yang buka
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffShift"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/LanOnly"
  /api/staff/products:
    get:
      tags: [staff]
      operationId: searchStaffProducts
      summary: Cari barang untuk barang masuk
      description: |
        Nama (mengandung, tanpa beda huruf besar/kecil), barcode, atau kode toko (persis); tanpa
        barang nonaktif dan satuan nonaktif (barang menunggu_harga ikut). Paling banyak 20 hasil.
        Tanpa harga jual, modal, atau stok.
      security:
        - staffCookieAuth: []
      parameters:
        - name: q
          in: query
          required: true
          description: Nama, barcode, atau kode toko
          schema:
            type: string
      responses:
        "200":
          description: Kecocokan, maksimal 20 hasil
          content:
            application/json:
              schema:
                type: array
                maxItems: 20
                items:
                  $ref: "#/components/schemas/StaffProduct"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/LanOnly"
  /api/staff/suppliers:
    get:
      tags: [staff]
      operationId: listStaffSuppliers
      summary: Supplier yang pernah dipakai
      security:
        - staffCookieAuth: []
      responses:
        "200":
          description: Supplier, terakhir dipakai dulu
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Supplier"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/LanOnly"
  /api/staff/receipts:
    post:
      tags: [staff]
      operationId: createStaffReceipt
      summary: Simpan nota barang masuk
      description: |
        Idempoten menurut (pembuat, id) — id = ID draf dari HP: id yang sudah disimpan pengguna ini
        mengembalikan nota lama dengan 200 tanpa validasi ulang dan tanpa mencatat ulang stok, HPP,
        uang keluar, atau utang. id sudah dipakai pengguna lain → 409 ID_TAKEN tanpa isi nota; nota
        milik pengguna lain tidak pernah dikembalikan.
        Atomik: 422 ReceiptProblem dengan galat per baris/field, tanpa perubahan sebagian.
        cashSource laci tanpa shift kasir yang buka → 422 dengan field cashSource; server tidak
        pernah mengubahnya menjadi uang pemilik. photoId yang bukan diunggah pengguna ini → 422
        dengan field photoId.
        Batas min/max di skema adalah panduan klien; server selalu memvalidasi isi mentah.
      security:
        - staffCookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReceiptInput"
      responses:
        "200":
          description: id sudah pernah disimpan; nota lama dikembalikan (replay)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffReceipt"
        "201":
          description: Nota dibuat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffReceipt"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/LanOnly"
        "409":
          $ref: "#/components/responses/IdTaken"
        "422":
          $ref: "#/components/responses/ReceiptValidationFailed"
    get:
      tags: [staff]
      operationId: listStaffReceipts
      summary: Nota barang masuk milik sendiri
      security:
        - staffCookieAuth: []
      responses:
        "200":
          description: Nota yang dibuat pengguna ini, terbaru dulu (createdAt)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StaffReceiptRow"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/LanOnly"
  /api/staff/receipts/{receiptId}:
    get:
      tags: [staff]
      operationId: getStaffReceipt
      summary: Detail nota milik sendiri
      description: Nota milik orang lain juga 404.
      security:
        - staffCookieAuth: []
      parameters:
        - $ref: "#/components/parameters/ReceiptId"
      responses:
        "200":
          description: Nota
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffReceipt"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/LanOnly"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [staff]
      operationId: updateStaffReceipt
      summary: Ubah nota milik sendiri
      description: |
        Hanya staf pembuatnya (nota orang lain 404). Baris tidak bisa ditambah atau dihapus; barang
        dan satuannya tetap. payment hanya bisa diubah selama paymentEditable. Atomik: 422
        ReceiptProblem tanpa perubahan sebagian; 409 RECEIPT_CANCELLED bila nota sudah dibatalkan.
        Boleh setelah shift saat nota dicatat ditutup; koreksi uang laci dicatat sebagai baris uang
        keluar baru di shift yang sedang buka (shift lama tidak diubah; tanpa shift buka: tidak
        dicatat, audit memuat catatannya).
      security:
        - staffCookieAuth: []
      parameters:
        - $ref: "#/components/parameters/ReceiptId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReceiptEdit"
      responses:
        "200":
          description: Nota diubah
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffReceipt"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/LanOnly"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ReceiptCancelled"
        "422":
          $ref: "#/components/responses/ReceiptValidationFailed"
  /api/staff/receipt-photos/{photoId}:
    put:
      tags: [staff]
      operationId: putStaffReceiptPhoto
      summary: Unggah foto nota
      description: |
        Foto terikat ke pengunggahnya. Idempoten menurut (pengunggah, photoId): unggah ulang oleh
        pengguna yang sama tetap 204 tanpa mengubah foto tersimpan. photoId yang sudah diunggah
        pengguna lain → 409 ID_TAKEN, tidak pernah ditimpa.
        JPEG, paling besar 1 MB; selain itu 422 VALIDATION.
      security:
        - staffCookieAuth: []
      parameters:
        - $ref: "#/components/parameters/PhotoId"
      requestBody:
        required: true
        content:
          image/jpeg:
            schema:
              type: string
              format: binary
      responses:
        "204":
          description: Foto tersimpan
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/LanOnly"
        "409":
          $ref: "#/components/responses/IdTaken"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    get:
      tags: [staff]
      operationId: getStaffReceiptPhoto
      summary: Foto nota (JPEG)
      description: Foto yang bukan diunggah pengguna ini juga 404.
      security:
        - staffCookieAuth: []
      parameters:
        - $ref: "#/components/parameters/PhotoId"
      responses:
        "200":
          description: Foto nota
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/LanOnly"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/staff/opname/categories:
    get:
      tags: [staff]
      operationId: listStaffOpnameCategories
      summary: Lingkup opname (kategori, tanpa kategori, semua) dengan saran
      description: |
        Hitung buta: tanpa stok. Barang berstatus selain nonaktif dikelompokkan per lingkup
        (kategori menurut nama; tanpa_kategori = barang berkategori null); lingkup tanpa barang tidak
        tampil. lastCountedAt = submittedAt sesi terakhir (siapa pun) dengan lingkup itu atau semua.
        Urut lastCountedAt null dulu lalu terlama; suggested = lingkup pertama (null bila tidak ada).
      security:
        - staffCookieAuth: []
      responses:
        "200":
          description: Lingkup opname
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffOpnameCategories"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/LanOnly"
  /api/staff/opname/products:
    get:
      tags: [staff]
      operationId: listStaffOpnameProducts
      summary: Daftar barang yang dihitung untuk satu lingkup
      description: |
        Hitung buta: tanpa stok, harga jual, atau modal. Barang berstatus selain nonaktif di
        lingkup itu, urut nama; HP menyalinnya ke draf agar bisa menghitung tanpa sinyal.
        kategori wajib bila lingkup = kategori dan dilarang untuk lingkup lain → 422 VALIDATION.
      security:
        - staffCookieAuth: []
      parameters:
        - name: lingkup
          in: query
          required: true
          schema:
            type: string
            enum: [kategori, tanpa_kategori, semua]
        - name: kategori
          in: query
          required: false
          description: Nama kategori; hanya untuk lingkup = kategori.
          schema:
            type: string
      responses:
        "200":
          description: Barang dalam lingkup
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StaffProduct"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/LanOnly"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/staff/opname-sessions:
    get:
      tags: [staff]
      operationId: listStaffOpnameSessions
      summary: Sesi opname milik sendiri
      security:
        - staffCookieAuth: []
      responses:
        "200":
          description: Sesi yang dikirim pengguna ini dalam 30 hari terakhir, terbaru dulu (submittedAt)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StaffOpnameRow"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/LanOnly"
    post:
      tags: [staff]
      operationId: createStaffOpnameSession
      summary: Kirim hitungan opname
      description: |
        Langkah 1 dari 2 (K2); bisa dari draf offline yang dikirim belakangan.
        Idempoten menurut (pembuat, id) — id = ID draf dari HP: id yang sudah dikirim pengguna ini
        mengembalikan sesi lama dengan 200 tanpa menerapkan ulang; id sudah dipakai pengguna lain →
        409 ID_TAKEN; sesi milik pengguna lain tidak pernah dikembalikan.
        Jam hitung (K6): at = countedAt + (serverNow − deviceNow); clockEstimated bila
        |serverNow − deviceNow| > 5 menit; hasil di atas serverNow dijepit ke serverNow (juga
        clockEstimated). systemQtyBase = stok pada jam itu, sehingga penjualan di sela-sela tidak
        membuat selisih palsu; diffQtyBase = countedQtyBase − systemQtyBase.
        Per barang: barang stockCounted false → stok_awal (J1: langsung jadi stok, tanpa alasan,
        bukan kerugian); selisih 0 → cocok; selain itu menunggu_alasan. cocok dan stok_awal langsung
        diterapkan ke stok tanpa alasan; sesi tanpa barang menunggu_alasan langsung selesai.
        Barang yang sama di beberapa sesi (K5): hanya hitungan dengan countedAt terbaru yang
        berlaku. Barang di sesi ini menjadi diganti bila sesi lain punya hitungan barang itu dengan
        countedAt lebih baru yang belum diganti; selain itu hitungan lama barang itu yang masih
        menunggu_alasan atau ditahan menjadi diganti (replacedBySessionId).
        Atomik: 422 OpnameProblem dengan galat per barang (barang tidak ditemukan, nonaktif,
        dihitung dua kali, jumlah atau jam tidak valid), tanpa perubahan sebagian.
        Batas min/max di skema adalah panduan klien; server selalu memvalidasi isi mentah.
      security:
        - staffCookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpnameSessionInput"
      responses:
        "200":
          description: id sudah pernah dikirim; sesi lama dikembalikan (replay)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffOpnameSession"
        "201":
          description: Sesi dibuat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffOpnameSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/LanOnly"
        "409":
          $ref: "#/components/responses/IdTaken"
        "422":
          $ref: "#/components/responses/OpnameValidationFailed"
  /api/staff/opname-sessions/{sessionId}:
    get:
      tags: [staff]
      operationId: getStaffOpnameSession
      summary: Hasil opname milik sendiri
      description: Sesi milik orang lain juga 404.
      security:
        - staffCookieAuth: []
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Sesi opname
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffOpnameSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/LanOnly"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/staff/opname-sessions/{sessionId}/finish:
    post:
      tags: [staff]
      operationId: finishStaffOpnameSession
      summary: Simpan alasan selisih (online)
      description: |
        Langkah 2 dari 2 (K2); hanya pembuat sesi (sesi orang lain 404). Satu alasan untuk tepat
        setiap barang menunggu_alasan; barang diganti diabaikan. Alasan untuk barang yang tidak
        perlu alasan, barang tanpa alasan, atau receiptId di luar receiptOptions → 422
        OpnameProblem, tanpa perubahan sebagian.
        salah_input (J4): receiptId dari receiptOptions disimpan sebagai rujukan (nota tidak
        diubah, stok dikoreksi oleh opname); receiptId null → tercatat tidak_diketahui.
        Nilai (K3): value = round_half_up(|diffQtyBase| × cost.amount ÷ cost.qtyBase) dari HPP
        sekarang; null bila HPP belum ada. Barang ditahan bila value null (J3) atau > Rp100.000
        (J2, nilai mutlak, kurang maupun lebih); selain itu langsung disesuaikan (entri ledger
        opname dengan alasan, waktu efektif = countedAt). Sesi flagged bila Σ value yang diketahui
        pada barang selisih > Rp250.000; ditetapkan sekali di sini.
        Replay pada sesi selesai → 200 sesi apa adanya, tanpa menerapkan ulang.
      security:
        - staffCookieAuth: []
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpnameFinishInput"
      responses:
        "200":
          description: Sesi selesai
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffOpnameSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/LanOnly"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/OpnameValidationFailed"
  /api/staff/expiry:
    get:
      tags: [staff]
      operationId: getStaffExpiry
      summary: Barang sudah/segera kedaluwarsa (perkiraan per kiriman)
      description: |
        Perkiraan FIFO (K9): kiriman = semua baris nota aktif barang itu, ber-ED maupun tidak,
        dikunci (receiptId, lineId), urut terbaru dulu (notaDate, createdAt, lalu urutan baris
        menurun); capacityQtyBase = max(0, qty × unitSize − Σ yang sudah dikeluarkan dari baris
        itu); max(stok, 0) dialokasikan mulai dari kiriman terbaru, jadi barang lama dianggap
        terjual lebih dulu. lots = kiriman ber-ED dengan estimateQtyBase > 0 dan tahap lewat (ED
        sebelum hari ini) atau segera (0–soonDays hari lagi, termasuk hari ini), urut lewat dulu
        lalu segera, masing-masing ED naik. recent = log keluar dan ubah ED 14 hari terakhir,
        terbaru dulu, paling banyak 20. Tanpa nilai rupiah.
      security:
        - staffCookieAuth: []
      responses:
        "200":
          description: Kiriman ber-ED dan log terbaru
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffExpiryList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/LanOnly"
  /api/staff/expiry-removals:
    post:
      tags: [staff]
      operationId: createStaffExpiryRemoval
      summary: Keluarkan barang kedaluwarsa dari stok
      description: |
        Pengeluaran dicatat pada kiriman (baris nota) yang dipilih (J6), sehingga kiriman itu yang
        berkurang: entri ledger keluar_kedaluwarsa (qtyBase negatif) atas nama pengguna ini.
        1 ≤ qtyBase ≤ capacityQtyBase kiriman itu, selain itu 422 VALIDATION (detail = pesan);
        stok boleh menjadi minus. Nota tidak ada, dibatalkan, atau tanpa baris itu → 404.
        Idempoten menurut (pembuat, id): id yang sama tetap 204 tanpa mencatat ulang. Online saja.
      security:
        - staffCookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpiryRemovalInput"
      responses:
        "204":
          description: Dikeluarkan (atau id sudah pernah dicatat pengguna ini)
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/LanOnly"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/staff/receipts/{receiptId}/lines/{lineId}/expiry:
    put:
      tags: [staff]
      operationId: putStaffLineExpiry
      summary: Ubah tanggal ED satu kiriman
      description: |
        Berlaku untuk nota siapa pun. Nota tidak ada, dibatalkan, atau tanpa baris itu → 404;
        tanggal tidak sah → 422 VALIDATION. Mencatat riwayat perubahan nota (ubah, "{barang}: ED
        a → b") dan log ubah_ed; tanggal sama → 204 tanpa entri.
      security:
        - staffCookieAuth: []
      parameters:
        - $ref: "#/components/parameters/ReceiptId"
        - $ref: "#/components/parameters/LineId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpiryDateInput"
      responses:
        "204":
          description: Tanggal ED tersimpan
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/LanOnly"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/staff/low-stock:
    get:
      tags: [staff]
      operationId: listStaffLowStock
      summary: Barang menipis
      description: |
        Tanpa angka sisa stok. Aturan sama dengan stockAlert menipis (termasuk penanda diam);
        urut nama.
      security:
        - staffCookieAuth: []
      responses:
        "200":
          description: Barang menipis
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StaffLowStockItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/LanOnly"
components:
  parameters:
    ProductId:
      name: productId
      in: path
      required: true
      schema:
        type: string
    ReceiptId:
      name: receiptId
      in: path
      required: true
      schema:
        type: string
    PhotoId:
      name: photoId
      in: path
      required: true
      schema:
        type: string
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
    LineId:
      name: lineId
      in: path
      required: true
      schema:
        type: string
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: kasir_session
    ownerCookieAuth:
      type: apiKey
      in: cookie
      name: owner_session
    staffCookieAuth:
      type: apiKey
      in: cookie
      name: staff_session
  responses:
    LanOnly:
      description: |
        Bukan dari Wi-Fi toko (STAFF_LAN_ONLY): header Cf-Connecting-Ip/Cf-Ray → 403 STAFF_LAN_ONLY;
        backend menolak semua yang bukan LAN (gagal-tertutup)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    IdTaken:
      description: id dari HP sudah dipakai pengguna lain (ID_TAKEN); data pengguna lain tidak dikembalikan
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ReceiptCancelled:
      description: Nota sudah dibatalkan (RECEIPT_CANCELLED)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ReceiptValidationFailed:
      description: Nota tidak valid (VALIDATION) dengan galat per baris/field
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ReceiptProblem"
    OpnameValidationFailed:
      description: Hitungan atau alasan opname tidak valid (VALIDATION) dengan galat per barang
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/OpnameProblem"
    OpnameNotHeld:
      description: Barang tidak (lagi) ditahan menunggu persetujuan pemilik (OPNAME_NOT_HELD)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    LoginInvalid:
      description: Nama atau password salah (LOGIN_INVALID)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: Tidak ada sesi (UNAUTHORIZED)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PinInvalid:
      description: PIN salah (PIN_INVALID)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    LockedOut:
      description: Terlalu banyak percobaan PIN (LOCKED_OUT)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnauthorizedOrPinInvalid:
      description: UNAUTHORIZED atau PIN_INVALID
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PinRequired:
      description: PIN pemilik diperlukan (PIN_REQUIRED)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Tidak ditemukan (NOT_FOUND)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ShiftAlreadyOpen:
      description: Shift sudah terbuka (SHIFT_ALREADY_OPEN)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ShiftClosed:
      description: Tidak ada shift terbuka (SHIFT_CLOSED)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ValidationFailed:
      description: Input tidak valid (VALIDATION atau INVALID_QUANTITY)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ProductValidationFailed:
      description: Data barang tidak valid (VALIDATION) dengan pesan per field
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProductValidationProblem"
    ProductHasSales:
      description: Barang sudah pernah terjual atau ada di nota barang masuk aktif sehingga tidak bisa dihapus (PRODUCT_HAS_SALES)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Health:
      type: object
      required: [status, version, db]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        version:
          type: string
        db:
          type: string
          enum: [ok, error]
    ErrorCode:
      type: string
      enum:
        - INTERNAL
        - NOT_FOUND
        - VALIDATION
        - FORBIDDEN_ORIGIN
        - UNAUTHORIZED
        - PIN_REQUIRED
        - PIN_INVALID
        - LOCKED_OUT
        - SHIFT_CLOSED
        - SHIFT_ALREADY_OPEN
        - PRICE_CHANGED
        - CREDIT_LIMIT
        - INVALID_QUANTITY
        - LOGIN_INVALID
        - PRODUCT_INACTIVE
        - PRODUCT_HAS_SALES
        - STAFF_LAN_ONLY
        - PRODUCT_NO_PRICE
        - RECEIPT_CANCELLED
        - DEBT_ALREADY_PAID
        - ID_TAKEN
        - OPNAME_NOT_HELD
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        code:
          $ref: "#/components/schemas/ErrorCode"
        detail:
          type: string
    PriceChange:
      type: object
      required: [unitId, oldUnitPrice, newUnitPrice, newNormalPrice, newWholesaleTiers]
      properties:
        unitId:
          type: string
        oldUnitPrice:
          type: integer
        newUnitPrice:
          type: integer
        newNormalPrice:
          type: integer
          description: Harga normal (non-grosir) terbaru satuan ini; keranjang mengganti harga normal dan tier sekaligus.
        newWholesaleTiers:
          type: array
          description: Seluruh tier grosir terbaru satuan ini; keranjang mengganti tier lama.
          items:
            $ref: "#/components/schemas/WholesaleTier"
    ShiftClosedProblem:
      description: Problem SHIFT_CLOSED.
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [code]
          properties:
            code:
              type: string
              enum: [SHIFT_CLOSED]
    PriceChangedProblem:
      description: Problem PRICE_CHANGED dengan daftar perubahan harga.
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [code, changes]
          properties:
            code:
              type: string
              enum: [PRICE_CHANGED]
            changes:
              type: array
              description: Satu entri per unitId (beberapa baris dengan satuan sama tetap satu entri).
              items:
                $ref: "#/components/schemas/PriceChange"
    CreditLimitProblem:
      description: Problem CREDIT_LIMIT dengan saldo, batas, dan nilai kasbon yang dicoba.
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [code, balance, creditLimit, attempted]
          properties:
            code:
              type: string
              enum: [CREDIT_LIMIT]
            balance:
              type: integer
            creditLimit:
              type: integer
            attempted:
              type: integer
    User:
      type: object
      required: [id, name, role]
      properties:
        id:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [kasir, pemilik]
    OwnerLogin:
      type: object
      required: [name, password]
      properties:
        name:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
    OwnerSession:
      type: object
      description: user.role selalu pemilik.
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/User"
    HourBucket:
      type: object
      required: [hour, revenue, lastWeekRevenue]
      properties:
        hour:
          type: integer
          minimum: 0
          maximum: 23
          description: Jam lokal Asia/Jakarta.
        revenue:
          type: integer
          description: Omzet penjualan selesai hari ini pada jam ini (rupiah).
        lastWeekRevenue:
          type: integer
          description: Omzet penjualan selesai pada jam ini sepanjang jam penuh di hari yang sama minggu lalu (rupiah); grafik menampilkan seluruh hari minggu lalu.
    CashDifference:
      type: object
      required: [shiftId, kasirName, closedAt, difference]
      properties:
        shiftId:
          type: string
        kasirName:
          type: string
        closedAt:
          type: integer
          format: int64
          description: Waktu shift ditutup (epoch ms UTC).
        difference:
          type: integer
          description: Uang fisik dikurangi uang seharusnya (rupiah); tidak nol.
    OverdueCredit:
      type: object
      required: [count, total]
      properties:
        count:
          type: integer
          description: Jumlah pelanggan bersaldo kasbon > 0 yang entri kasbon belum lunas tertuanya lebih dari 30 hari.
        total:
          type: integer
          description: Jumlah saldo kasbon seluruh pelanggan tersebut (rupiah).
    Attention:
      type: object
      required: [lowStockCount, negativeStockCount, cashDifferences, overdueCredit, costChanges, stockOuts, supplierDebts, awaitingPriceCount, expiry, opnameHeldCount, opnameFlags]
      properties:
        lowStockCount:
          type: integer
          description: |
            Jumlah barang dengan stockAlert menipis (0 <= stok < minStock). Aturan penanda diam:
            tidak termasuk barang stockCounted false, Sedang langka (scarce), tidak_diambil, atau nonaktif.
        negativeStockCount:
          type: integer
          description: |
            Jumlah barang dengan stockAlert minus (stok < 0); dihitung terpisah, tidak termasuk di
            lowStockCount. Aturan penanda diam: tidak termasuk barang stockCounted false atau
            nonaktif; Sedang langka (scarce) dan tidak_diambil tetap dihitung.
        cashDifferences:
          type: array
          description: Shift yang sudah ditutup dengan selisih kas tidak nol, dengan closedAt jatuh pada hari ini (Asia/Jakarta); terbaru dulu.
          items:
            $ref: "#/components/schemas/CashDifference"
        overdueCredit:
          $ref: "#/components/schemas/OverdueCredit"
        costChanges:
          type: array
          description: Barang yang modal satuan ecerannya berubah dan belum ditindaklanjuti pemilik; terbaru dulu.
          items:
            $ref: "#/components/schemas/CostChangeItem"
        stockOuts:
          type: array
          description: Barang tidak_diambil yang stoknya sudah dihitung dan habis (stok <= 0); urut nama.
          items:
            $ref: "#/components/schemas/StockOutItem"
        supplierDebts:
          $ref: "#/components/schemas/SupplierDebtAttention"
        awaitingPriceCount:
          type: integer
          description: Jumlah barang menunggu_harga (barang baru dari barang masuk yang belum punya harga jual).
        expiry:
          $ref: "#/components/schemas/ExpiryAttention"
        opnameHeldCount:
          type: integer
          description: Jumlah barang opname berstate ditahan (menunggu persetujuan pemilik).
        opnameFlags:
          type: array
          description: Sesi opname flagged yang belum ditinjau (reviewOpnameSession); terbaru dulu (finishedAt).
          items:
            $ref: "#/components/schemas/OpnameFlag"
    SupplierDebtAttention:
      type: object
      description: |
        Utang supplier belum lunas dari nota yang tidak dibatalkan, menurut tanggal hari ini
        (Asia/Jakarta). overdue = lewat jatuh tempo (setelah hari H); dueSoon = 0–3 hari sebelum
        jatuh tempo, termasuk hari H. Total dalam rupiah.
      required: [overdueCount, overdueTotal, dueSoonCount, dueSoonTotal]
      properties:
        overdueCount:
          type: integer
        overdueTotal:
          type: integer
        dueSoonCount:
          type: integer
        dueSoonTotal:
          type: integer
    CostChangeItem:
      type: object
      description: |
        Satu butir per barang. oldCost = modal satuan eceran saat butir dibuat; newCost = modal
        satuan eceran sekarang; price = harga jual eceran sekarang (semua rupiah).
      required: [productId, productName, unitName, oldCost, newCost, price, changedAt, source]
      properties:
        productId:
          type: string
        productName:
          type: string
        unitName:
          type: string
          description: Nama satuan eceran.
        oldCost:
          type: integer
        newCost:
          type: integer
        price:
          type: integer
        changedAt:
          type: integer
          format: int64
          description: Waktu perubahan modal terakhir (epoch ms UTC).
        source:
          $ref: "#/components/schemas/PriceSource"
    StockOutItem:
      type: object
      required: [productId, productName]
      properties:
        productId:
          type: string
        productName:
          type: string
    OwnerTodaySummary:
      type: object
      description: |
        Semua uang integer rupiah. revenue, grossProfit, newCredit, dan avgTicket hanya menghitung
        penjualan berstatus selesai (semua field bertipe omzet hanya menghitung penjualan selesai). avgTicket = round_half_up(revenue / salesCount), 0 bila tidak ada penjualan.
      required: [date, weekdayLastWeek, revenue, grossProfit, salesCount, newCredit, avgTicket, lastWeekRevenue, hourly, attention]
      properties:
        date:
          type: string
          format: date
          description: Tanggal bisnis hari ini di Asia/Jakarta (YYYY-MM-DD).
        weekdayLastWeek:
          type: string
          description: Nama hari Bahasa Indonesia untuk hari yang sama minggu lalu, mis. "Jumat".
        revenue:
          type: integer
        grossProfit:
          type: integer
          description: Jumlah untuk penjualan selesai hari ini dari (total penjualan - HPP yang disalin saat penjualan terjadi) (rupiah); HPP saat ini tidak dipakai untuk penjualan lampau.
        salesCount:
          type: integer
          description: Jumlah penjualan selesai hari ini.
        newCredit:
          type: integer
          description: Jumlah bagian kasbon (metode pembayaran credit) dari penjualan selesai hari ini (rupiah).
        avgTicket:
          type: integer
        lastWeekRevenue:
          type: integer
          description: Omzet penjualan selesai pada hari yang sama minggu lalu dari 00.00 sampai akhir menit saat ini (menit berjalan ikut dihitung) (Asia/Jakarta), pembanding sepadan untuk omzet hari ini.
        hourly:
          type: array
          minItems: 24
          maxItems: 24
          description: Tepat 24 bucket; indeks = jam lokal Asia/Jakarta (0-23).
          items:
            $ref: "#/components/schemas/HourBucket"
        attention:
          $ref: "#/components/schemas/Attention"
    Session:
      type: object
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/User"
    PinLoginRequest:
      type: object
      required: [userId, pin]
      properties:
        userId:
          type: string
        pin:
          type: string
          pattern: '^\d{6}$'
    Shift:
      type: object
      required: [id, kasirId, kasirName, openedAt, openingCash]
      properties:
        id:
          type: string
        kasirId:
          type: string
        kasirName:
          type: string
        openedAt:
          type: integer
          format: int64
        openingCash:
          type: integer
    CurrentShift:
      type: object
      required: [shift]
      properties:
        shift:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Shift"
    OpenShiftRequest:
      type: object
      required: [openingCash]
      properties:
        openingCash:
          type: integer
          minimum: 0
    CloseShiftRequest:
      type: object
      required: [countedCash]
      properties:
        countedCash:
          type: integer
          minimum: 0
    ShiftClosure:
      type: object
      required: [shiftId, openingCash, cashSales, supplierPayments, expectedCash, countedCash, difference, salesCount]
      properties:
        shiftId:
          type: string
        openingCash:
          type: integer
        cashSales:
          type: integer
        supplierPayments:
          type: integer
          description: Σ uang keluar ke supplier di shift ini, bertanda; expectedCash = openingCash + cashSales − supplierPayments
        expectedCash:
          type: integer
        countedCash:
          type: integer
        difference:
          type: integer
        salesCount:
          type: integer
    KasirSettings:
      type: object
      required: [storeName, autoPrint, curahFractions, quickCurahProductIds, qrisImageUrl, allowNegativeStock]
      properties:
        storeName:
          type: string
        autoPrint:
          type: boolean
        curahFractions:
          type: array
          description: Pecahan curah dalam qtyBase.
          items:
            type: integer
        quickCurahProductIds:
          type: array
          items:
            type: string
        qrisImageUrl:
          type: string
        allowNegativeStock:
          type: boolean
    WholesaleTier:
      type: object
      description: |
        Harga grosir per satuan jual. Berlaku hanya bila qtyBase kelipatan unitSize;
        jumlah = qtyBase / unitSize (dalam satuan jual) dan dipakai tier dengan minQty
        terbesar yang <= jumlah. minQty dalam satuan jual, bukan satuan dasar.
      required: [minQty, price]
      properties:
        minQty:
          type: integer
        price:
          type: integer
    ProductUnit:
      type: object
      required: [id, productId, name, unitSize, price, wholesaleTiers, barcodes]
      properties:
        id:
          type: string
        productId:
          type: string
        name:
          type: string
        unitSize:
          type: integer
          minimum: 1
          description: Jumlah satuan dasar per satuan jual.
        price:
          type: integer
        wholesaleTiers:
          type: array
          items:
            $ref: "#/components/schemas/WholesaleTier"
        barcodes:
          type: array
          items:
            type: string
    Product:
      type: object
      required: [id, name, storeCode, isCurah, baseUnit, units]
      properties:
        id:
          type: string
        name:
          type: string
        storeCode:
          type: string
        isCurah:
          type: boolean
        baseUnit:
          type: string
          enum: [pcs, gram, ml]
        units:
          type: array
          items:
            $ref: "#/components/schemas/ProductUnit"
    ProductStatus:
      type: string
      description: |
        aktif; tidak_diambil = tetap dijual sampai habis, tanpa peringatan menipis;
        nonaktif = tidak muncul di kasir (pencarian, scan, curah cepat), riwayat tetap;
        menunggu_harga = barang baru dari barang masuk, semua satuannya price 0 sampai pemilik
        menyimpan form barang dengan harga jual (lalu aktif); tidak muncul di pencarian dan curah
        cepat kasir, scan/kode → 410 PRODUCT_NO_PRICE.
      enum: [aktif, tidak_diambil, nonaktif, menunggu_harga]
    StockAlert:
      type: string
      description: |
        minus bila stok < 0; menipis bila 0 <= stok < minStock (minStock null = tanpa batas);
        selain itu none. Penanda diam: stockCounted false (Stok belum dihitung) → none, tidak
        menipis maupun minus; scarce (Sedang langka) dan status tidak_diambil hanya membungkam
        menipis (minus tetap muncul); status nonaktif → none.
      enum: [none, menipis, minus]
    PriceSource:
      type: string
      description: |
        pemilik = diubah di aplikasi pemilik; impor = lewat Impor Excel; barang_masuk = HPP dari
        nota barang masuk; ubah_nota = HPP dari nota yang diubah atau dibatalkan.
      enum: [pemilik, impor, barang_masuk, ubah_nota]
    ProductCost:
      type: object
      description: |
        HPP: amount rupiah per qtyBase satuan dasar.
        Modal satuan = round_half_up(amount × unitSize ÷ qtyBase).
      required: [amount, qtyBase]
      properties:
        amount:
          type: integer
          minimum: 0
        qtyBase:
          type: integer
          minimum: 1
    OwnerProductUnit:
      description: Satuan jual versi pemilik (field ProductUnit ditambah modal dan status satuan).
      allOf:
        - $ref: "#/components/schemas/ProductUnit"
        - type: object
          required: [cost, active, sold]
          properties:
            cost:
              type: integer
              nullable: true
              description: Modal satuan ini (rupiah) dari HPP barang; null bila HPP belum diisi.
            active:
              type: boolean
              description: false = satuan nonaktif (tidak dijual di kasir; barcodenya tetap terpakai).
            sold:
              type: boolean
              description: Satuan pernah terjual (isi dikunci; bila diganti dinonaktifkan, bukan dihapus).
    OwnerProductRow:
      type: object
      description: Baris daftar barang pemilik; unitName, unitSize, dan price = satuan eceran.
      required: [id, name, storeCode, category, status, scarce, stockCounted, isCurah, baseUnit, unitName, unitSize, price, barcodes, stock, stockAlert]
      properties:
        id:
          type: string
        name:
          type: string
        storeCode:
          type: string
        category:
          type: string
          nullable: true
        status:
          $ref: "#/components/schemas/ProductStatus"
        scarce:
          type: boolean
          description: Tanda Sedang langka.
        stockCounted:
          type: boolean
          description: false = Stok belum dihitung (belum pernah opname); barang masuk tidak mengubahnya, kecuali barang baru dari nota yang langsung terhitung.
        isCurah:
          type: boolean
        baseUnit:
          type: string
          enum: [pcs, gram, ml]
        unitName:
          type: string
        unitSize:
          type: integer
          minimum: 1
        price:
          type: integer
        barcodes:
          type: array
          description: Barcode semua satuan (untuk pencarian).
          items:
            type: string
        stock:
          type: integer
          description: Stok dalam qtyBase.
        stockAlert:
          $ref: "#/components/schemas/StockAlert"
    OwnerProduct:
      type: object
      required: [id, name, storeCode, category, status, scarce, stockCounted, isCurah, baseUnit, units, cost, stock, minStock, stockAlert, hasSales, hasReceipts, costAlert, recentMovements, priceHistory]
      properties:
        id:
          type: string
        name:
          type: string
        storeCode:
          type: string
        category:
          type: string
          nullable: true
        status:
          $ref: "#/components/schemas/ProductStatus"
        scarce:
          type: boolean
          description: Tanda Sedang langka.
        stockCounted:
          type: boolean
          description: false = Stok belum dihitung (belum pernah opname); barang masuk tidak mengubahnya, kecuali barang baru dari nota yang langsung terhitung.
        isCurah:
          type: boolean
        baseUnit:
          type: string
          enum: [pcs, gram, ml]
        units:
          type: array
          description: Semua satuan termasuk nonaktif; units[0] = satuan eceran.
          minItems: 1
          items:
            $ref: "#/components/schemas/OwnerProductUnit"
        cost:
          nullable: true
          description: HPP barang; null bila modal belum diisi.
          allOf:
            - $ref: "#/components/schemas/ProductCost"
        stock:
          type: integer
          description: Stok dalam qtyBase.
        minStock:
          type: integer
          nullable: true
          description: Batas stok menipis dalam qtyBase (satuan dasar); null = tanpa batas.
        stockAlert:
          $ref: "#/components/schemas/StockAlert"
        hasSales:
          type: boolean
          description: Barang pernah terjual (tidak bisa dihapus).
        hasReceipts:
          type: boolean
          description: Barang punya barang masuk aktif → modal mengikuti barang masuk; isian modal diabaikan.
        costAlert:
          nullable: true
          description: Peringatan modal berubah yang belum ditindaklanjuti.
          allOf:
            - $ref: "#/components/schemas/CostAlert"
        recentMovements:
          type: array
          description: Mutasi stok, terbaru dulu.
          maxItems: 5
          items:
            $ref: "#/components/schemas/StockMovement"
        priceHistory:
          type: array
          description: Riwayat harga jual, terbaru dulu.
          items:
            $ref: "#/components/schemas/PriceHistoryEntry"
    CostAlert:
      type: object
      description: fromCost = HPP saat peringatan dibuat; changedAt dan source = perubahan modal terakhir.
      required: [fromCost, changedAt, source]
      properties:
        fromCost:
          $ref: "#/components/schemas/ProductCost"
        changedAt:
          type: integer
          format: int64
        source:
          $ref: "#/components/schemas/PriceSource"
    StockMovement:
      type: object
      required: [id, at, kind, qtyBase, kasirName, reason]
      properties:
        id:
          type: string
        at:
          type: integer
          format: int64
          description: Waktu dicatat (epoch ms UTC), juga untuk opname yang berlaku pada jam hitung.
        kind:
          type: string
          description: |
            jual / batal = penjualan dan pembatalannya; masuk = barang masuk; koreksi_masuk = nota
            barang masuk diubah; batal_masuk = nota barang masuk dibatalkan; opname = koreksi stok
            dari selisih opname; stok_awal = hitungan opname pertama menjadi stok;
            keluar_kedaluwarsa = dikeluarkan dari stok karena kedaluwarsa.
          enum: [jual, batal, masuk, koreksi_masuk, batal_masuk, opname, stok_awal, keluar_kedaluwarsa]
        qtyBase:
          type: integer
          description: |
            Bertanda; jual negatif, batal positif, masuk positif, koreksi_masuk bertanda, batal_masuk
            negatif, opname bertanda, stok_awal bertanda, keluar_kedaluwarsa negatif.
        kasirName:
          type: string
          description: nama orang yang mencatat
        reason:
          nullable: true
          description: Alasan selisih untuk opname (K27); null untuk jenis lain.
          allOf:
            - $ref: "#/components/schemas/OpnameReason"
    PriceHistoryEntry:
      type: object
      required: [id, at, unitId, unitName, isEceran, unitSize, tierMinQty, oldPrice, newPrice, source]
      properties:
        id:
          type: string
        at:
          type: integer
          format: int64
        unitId:
          type: string
        unitName:
          type: string
        isEceran:
          type: boolean
        unitSize:
          type: integer
        tierMinQty:
          type: integer
          nullable: true
          description: null = harga normal satuan; terisi = harga tier grosir dengan minQty ini.
        oldPrice:
          type: integer
          nullable: true
          description: null = baris harga baru ditambah.
        newPrice:
          type: integer
          nullable: true
          description: null = baris harga dihapus.
        source:
          $ref: "#/components/schemas/PriceSource"
    ProductInput:
      type: object
      description: |
        Isi form barang, mengikuti template Excel. Uang integer rupiah. minStock dan bigUnit.size
        dalam satuan eceran (minStock boleh pecahan untuk kg, ons, dan liter).
      required: [name, category, sellUnit, barcode, cost, price, tier, bigUnit, minStock]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        category:
          type: string
          nullable: true
        sellUnit:
          type: string
          minLength: 1
          maxLength: 20
          description: Dijual per; kg, ons, liter, dan l = barang curah.
        barcode:
          type: string
          nullable: true
          description: "EAN-13, UPC-A, EAN-8, atau GTIN-14 (ITF-14 di dus); check digit GS1 mod-10; unik di semua satuan semua barang termasuk nonaktif."
        cost:
          type: integer
          nullable: true
          minimum: 0
          description: Modal eceran; diabaikan bila bigUnit.cost terisi.
        price:
          type: integer
          minimum: 1
        tier:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/WholesaleTier"
        bigUnit:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/BigUnitInput"
        minStock:
          type: number
          nullable: true
          description: "dalam satuan eceran; ≥ 0; untuk pcs harus bulat; server mengonversi ke qtyBase"
    BigUnitInput:
      type: object
      required: [unitId, name, size, barcode, cost, price]
      properties:
        unitId:
          type: string
          nullable: true
          description: Satuan besar yang diubah; null = satuan besar baru.
        name:
          type: string
        size:
          type: integer
          minimum: 2
          description: Isi dalam satuan eceran.
        barcode:
          type: string
          nullable: true
          description: "EAN-13, UPC-A, EAN-8, atau GTIN-14 (ITF-14 di dus); check digit GS1 mod-10; unik di semua satuan semua barang termasuk nonaktif."
        cost:
          type: integer
          nullable: true
          minimum: 0
        price:
          type: integer
          minimum: 1
    ProductStatusInput:
      type: object
      required: [status, scarce]
      properties:
        status:
          $ref: "#/components/schemas/ProductStatus"
        scarce:
          type: boolean
    PriceUpdate:
      type: object
      required: [lines]
      properties:
        lines:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/PriceLineInput"
    PriceLineInput:
      type: object
      required: [unitId, tierMinQty, price]
      properties:
        unitId:
          type: string
        tierMinQty:
          type: integer
          nullable: true
          description: null = harga normal satuan; terisi = tier grosir dengan minQty ini.
        price:
          type: integer
          minimum: 1
    ProductField:
      type: string
      description: Field form barang (= kolom template Excel B–O).
      enum: [name, category, sellUnit, barcode, cost, price, tierMinQty, tierPrice, bigName, bigSize, bigBarcode, bigCost, bigPrice, minStock]
    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          $ref: "#/components/schemas/ProductField"
        message:
          type: string
    ProductValidationProblem:
      description: Problem VALIDATION dengan pesan per field form barang.
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [code, errors]
          properties:
            code:
              type: string
              enum: [VALIDATION]
            errors:
              type: array
              items:
                $ref: "#/components/schemas/FieldError"
    ImportRow:
      type: object
      description: Satu baris sheet Barang; sel B–O berupa teks yang di-trim, null = kosong.
      required: [row, name, category, sellUnit, barcode, cost, price, tierMinQty, tierPrice, bigName, bigSize, bigBarcode, bigCost, bigPrice, minStock]
      properties:
        row:
          type: integer
          minimum: 3
          description: Nomor baris Excel (data mulai baris 3).
        name:
          type: string
          nullable: true
        category:
          type: string
          nullable: true
        sellUnit:
          type: string
          nullable: true
        barcode:
          type: string
          nullable: true
          description: "EAN-13, UPC-A, EAN-8, atau GTIN-14 (ITF-14 di dus); check digit GS1 mod-10; unik di semua satuan semua barang termasuk nonaktif."
        cost:
          type: string
          nullable: true
        price:
          type: string
          nullable: true
        tierMinQty:
          type: string
          nullable: true
        tierPrice:
          type: string
          nullable: true
        bigName:
          type: string
          nullable: true
        bigSize:
          type: string
          nullable: true
        bigBarcode:
          type: string
          nullable: true
          description: "EAN-13, UPC-A, EAN-8, atau GTIN-14 (ITF-14 di dus); check digit GS1 mod-10; unik di semua satuan semua barang termasuk nonaktif."
        bigCost:
          type: string
          nullable: true
        bigPrice:
          type: string
          nullable: true
        minStock:
          type: string
          nullable: true
    ImportRequest:
      type: object
      required: [rows]
      properties:
        rows:
          type: array
          minItems: 1
          maxItems: 5000
          items:
            $ref: "#/components/schemas/ImportRow"
    ImportRowStatus:
      type: string
      description: |
        baru = Siap; diperbarui = Akan diperbarui; tidak_berubah = Sudah ada, tidak berubah;
        perbaiki = Perbaiki (dilewati saat impor).
      enum: [baru, diperbarui, tidak_berubah, perbaiki]
    ImportRowResult:
      type: object
      required: [row, status, problems, changes, notes]
      properties:
        row:
          type: integer
        status:
          $ref: "#/components/schemas/ImportRowStatus"
        problems:
          type: array
          description: Masalah yang harus diperbaiki di Excel (status perbaiki).
          items:
            type: string
        changes:
          type: array
          description: Apa yang berubah (status diperbarui).
          items:
            type: string
        notes:
          type: array
          description: Catatan yang tidak menghalangi impor, mis. modal eceran diabaikan atau kategori baru.
          items:
            type: string
    ImportSummary:
      type: object
      description: Jumlah baris per status (ready = baru, update = diperbarui, unchanged = tidak_berubah, invalid = perbaiki).
      required: [ready, update, unchanged, invalid]
      properties:
        ready:
          type: integer
        update:
          type: integer
        unchanged:
          type: integer
        invalid:
          type: integer
    ImportCheck:
      type: object
      required: [rows, summary]
      properties:
        rows:
          type: array
          description: Urut nomor baris Excel.
          items:
            $ref: "#/components/schemas/ImportRowResult"
        summary:
          $ref: "#/components/schemas/ImportSummary"
    ImportResult:
      type: object
      description: skipped = baris tidak berubah ditambah baris bermasalah.
      required: [created, updated, skipped]
      properties:
        created:
          type: integer
        updated:
          type: integer
        skipped:
          type: integer
    CatalogMatch:
      type: object
      required: [product, unitId]
      properties:
        product:
          $ref: "#/components/schemas/Product"
        unitId:
          type: string
    SaleItemInput:
      type: object
      description: |
        Tepat salah satu dari qtyBase atau amount wajib diisi (ditegakkan server; 422
        INVALID_QUANTITY bila keduanya ada atau keduanya kosong). amount (nominal rupiah)
        hanya untuk satuan curah.
      required: [unitId, expectedUnitPrice]
      properties:
        unitId:
          type: string
        qtyBase:
          type: integer
          minimum: 1
        amount:
          type: integer
          minimum: 1
        expectedUnitPrice:
          type: integer
    PaymentInput:
      type: object
      required: [method, amount]
      properties:
        method:
          type: string
          enum: [cash, qris, credit]
        amount:
          type: integer
          minimum: 1
    SaleRequest:
      type: object
      required: [saleId, items, payments, print]
      properties:
        saleId:
          type: string
          description: ID dari klien (idempotensi); saleId yang sama mengembalikan penjualan lama dengan 200.
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/SaleItemInput"
        payments:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/PaymentInput"
        cashReceived:
          type: integer
        customerId:
          type: string
        print:
          type: boolean
        ownerPin:
          type: string
          pattern: '^\d{6}$'
          description: Otorisasi pemilik bila server memintanya.
    SaleItem:
      type: object
      required: [unitId, productName, unitName, isCurah, baseUnit, unitSize, qtyBase, unitPrice, subtotal, wholesale]
      properties:
        unitId:
          type: string
        productName:
          type: string
        unitName:
          type: string
        isCurah:
          type: boolean
        baseUnit:
          type: string
          enum: [pcs, gram, ml]
        unitSize:
          type: integer
        qtyBase:
          type: integer
        unitPrice:
          type: integer
        subtotal:
          type: integer
        wholesale:
          type: boolean
    Sale:
      type: object
      required: [id, number, createdAt, kasirName, items, total, payments, cashReceived, change, customerId, status, printStatus]
      properties:
        id:
          type: string
        number:
          type: string
        createdAt:
          type: integer
          format: int64
        kasirName:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/SaleItem"
        total:
          type: integer
        payments:
          type: array
          items:
            $ref: "#/components/schemas/PaymentInput"
        cashReceived:
          type: integer
          description: Uang tunai diterima; 0 bila penjualan tanpa bagian tunai.
        change:
          type: integer
          description: Kembalian; 0 bila penjualan tanpa bagian tunai.
        customerId:
          type: string
          nullable: true
        status:
          type: string
          enum: [selesai, dibatalkan]
        printStatus:
          $ref: "#/components/schemas/PrintStatus"
    PrintStatus:
      type: string
      enum: [tercetak, tidak_dicetak, gagal]
    PrintResult:
      type: object
      required: [printStatus]
      properties:
        printStatus:
          $ref: "#/components/schemas/PrintStatus"
    VoidRequest:
      type: object
      required: [reason]
      properties:
        ownerPin:
          type: string
          pattern: '^\d{6}$'
          description: PIN pemilik; tanpa PIN server menjawab 403 PIN_REQUIRED.
        reason:
          type: string
          minLength: 1
    Customer:
      type: object
      required: [id, name, phone, balance, creditLimit]
      properties:
        id:
          type: string
        name:
          type: string
        phone:
          type: string
        balance:
          type: integer
        creditLimit:
          type: integer
    NewCustomer:
      type: object
      required: [name, phone]
      properties:
        name:
          type: string
          minLength: 2
        phone:
          type: string
          pattern: '^\d{8,15}$'
    StaffUnit:
      type: object
      description: Satuan barang untuk orang toko; tanpa harga jual, modal, dan stok.
      required: [id, name, unitSize, barcodes]
      properties:
        id:
          type: string
        name:
          type: string
        unitSize:
          type: integer
          minimum: 1
          description: Jumlah satuan dasar per satuan ini.
        barcodes:
          type: array
          items:
            type: string
    StaffProduct:
      type: object
      description: Barang untuk orang toko; tanpa harga jual, modal, dan stok. units[0] = satuan eceran; hanya satuan aktif.
      required: [id, name, category, isCurah, baseUnit, status, units]
      properties:
        id:
          type: string
        name:
          type: string
        category:
          type: string
          nullable: true
        isCurah:
          type: boolean
        baseUnit:
          type: string
          enum: [pcs, gram, ml]
        status:
          $ref: "#/components/schemas/ProductStatus"
        units:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/StaffUnit"
    Supplier:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
    ReceiptPayment:
      type: object
      description: |
        sekarang: method wajib; cashSource wajib bila tunai (laci = uang keluar di shift yang sedang
        buka), null bila transfer; dueDate null. nanti: method dan cashSource null (dipilih saat
        pemilik menandai lunas); dueDate wajib, tidak sebelum notaDate.
        cashSource laci tanpa shift kasir yang buka → 422 dengan field cashSource; server tidak
        pernah mengubahnya menjadi uang pemilik.
      required: [timing, method, cashSource, dueDate]
      properties:
        timing:
          type: string
          enum: [sekarang, nanti]
        method:
          type: string
          nullable: true
          enum: [tunai, transfer]
        cashSource:
          type: string
          nullable: true
          enum: [laci, pemilik]
        dueDate:
          type: string
          format: date
          nullable: true
    NewProductInput:
      type: object
      description: |
        Barang baru dari nota (status menunggu_harga). Satuan eceran = sellUnit; bila notaUnit
        berbeda, satuan besar notaUnit berisi notaUnitSize. barcode melekat ke satuan nota.
      required: [name, sellUnit, notaUnit, notaUnitSize, barcode]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        sellUnit:
          type: string
          minLength: 1
          maxLength: 20
          description: Dijual per; kg, ons, liter, dan l = barang curah.
        notaUnit:
          type: string
          minLength: 1
          maxLength: 20
        notaUnitSize:
          type: integer
          minimum: 1
          description: Isi satu satuan nota, dalam satuan Dijual per (1 bila sama dengan sellUnit).
        barcode:
          type: string
          nullable: true
          description: "EAN-13, UPC-A, EAN-8, atau GTIN-14 (ITF-14 di dus); check digit GS1 mod-10; unik di semua satuan semua barang termasuk nonaktif."
    ReceiptLineInput:
      type: object
      description: Tepat salah satu dari (productId + unitId) atau newProduct (ditegakkan server).
      required: [lineId, productId, unitId, newProduct, qty, unitCost, expiryDate]
      properties:
        lineId:
          type: string
          minLength: 1
          maxLength: 64
        productId:
          type: string
          nullable: true
        unitId:
          type: string
          nullable: true
          description: Satuan sesuai nota (satuan aktif barang itu).
        newProduct:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/NewProductInput"
        qty:
          type: integer
          minimum: 1
          description: Jumlah dalam satuan nota.
        unitCost:
          type: integer
          minimum: 0
          description: Harga beli per satuan nota (rupiah); 0 = barang bonus.
        expiryDate:
          type: string
          format: date
          nullable: true
    ReceiptInput:
      type: object
      required: [id, supplierName, notaDate, photoId, lines, payment]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 64
          description: ID draf dari HP (idempotensi); id yang sama mengembalikan nota lama dengan 200.
        supplierName:
          type: string
          minLength: 1
          maxLength: 100
          description: Supplier lama (nama sama, tanpa beda huruf) atau baru.
        notaDate:
          type: string
          format: date
          description: Tidak boleh setelah hari ini.
        photoId:
          type: string
          nullable: true
          description: Foto nota yang sudah diunggah lewat putStaffReceiptPhoto; harus diunggah oleh pengguna ini; selain itu 422 dengan field photoId.
        lines:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/ReceiptLineInput"
        payment:
          $ref: "#/components/schemas/ReceiptPayment"
    ReceiptLineEdit:
      type: object
      required: [lineId, qty, unitCost, expiryDate]
      properties:
        lineId:
          type: string
          minLength: 1
          maxLength: 64
          description: Baris nota yang sudah ada.
        qty:
          type: integer
          minimum: 1
        unitCost:
          type: integer
          minimum: 0
        expiryDate:
          type: string
          format: date
          nullable: true
    ReceiptEdit:
      type: object
      description: Semua baris nota (tepat sama dengan lineId yang ada); baris tidak bisa ditambah atau dihapus.
      required: [supplierName, notaDate, lines, payment]
      properties:
        supplierName:
          type: string
          minLength: 1
          maxLength: 100
        notaDate:
          type: string
          format: date
        lines:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/ReceiptLineEdit"
        payment:
          $ref: "#/components/schemas/ReceiptPayment"
    ReceiptStatus:
      type: string
      enum: [aktif, dibatalkan]
    ReceiptLine:
      type: object
      description: productName, unitName, dan unitSize disalin saat nota disimpan. subtotal = qty × unitCost.
      required: [lineId, productId, productName, unitId, unitName, unitSize, qty, unitCost, subtotal, expiryDate, newProduct]
      properties:
        lineId:
          type: string
        productId:
          type: string
        productName:
          type: string
        unitId:
          type: string
        unitName:
          type: string
        unitSize:
          type: integer
          minimum: 1
        qty:
          type: integer
        unitCost:
          type: integer
        subtotal:
          type: integer
        expiryDate:
          type: string
          format: date
          nullable: true
        newProduct:
          type: boolean
          description: Barang dibuat dari baris ini.
    StaffReceipt:
      type: object
      required: [id, supplierName, notaDate, photoId, lines, payment, paymentEditable, total, status, createdAt, createdByName, editedAt, editedByName]
      properties:
        id:
