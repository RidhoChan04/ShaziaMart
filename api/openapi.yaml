openapi: 3.0.3
info:
  title: ShaziaMart API
  version: 0.1.0
  description: |
    Kontrak API kasir sembako. Sumber kebenaran tunggal untuk frontend dan backend.
    Semua uang dan jumlah berupa integer (rupiah utuh; qtyBase dalam satuan dasar pcs/gram/ml).
    Semua waktu berupa integer epoch milidetik UTC. Error memakai application/problem+json.
    Autentikasi memakai cookie sesi kasir_session. Endpoint shift, sales, credit-payments, dan session
    memerlukan sesi; health, users, pin-login, settings, catalog, dan customers publik
    (satu PC di localhost).

    Endpoint pemilik berada di bawah /api/owner dengan realm cookie terpisah total dari kasir:
    owner_session (berlaku 30 hari). Sesi kasir tidak berlaku di sana dan sebaliknya.
    HPP dan laba hanya muncul di endpoint /api/owner; endpoint kasir tidak pernah memuatnya.
    Data barang: kategori, status, stok, dan modal hanya di /api/owner.
    Hari bisnis memakai zona Asia/Jakarta.

    Endpoint orang toko (HP) berada di bawah /api/staff dengan realm cookie ketiga:
    staff_session (akun ber-role kasir, nama + PIN). Sesi kasir dan pemilik tidak berlaku di sana
    dan sebaliknya; masuk/keluar di satu realm tidak menyentuh dua lainnya. Realm ini hanya untuk
    Wi-Fi toko (LAN): setiap request /api/staff (termasuk login) yang membawa header
    Cf-Connecting-Ip atau Cf-Ray ditolak 403 STAFF_LAN_ONLY sebelum apa pun, dan backend menolak
    semua yang bukan LAN (gagal-tertutup). HPP, modal, harga jual, stok, dan laba tidak pernah
    ada di respons /api/staff; satu-satunya angka uang adalah unitCost (harga beli yang diketik)
    beserta subtotal/total pada nota milik staf itu sendiri.
    Tanggal kalender (notaDate, dueDate, expiryDate) berupa string YYYY-MM-DD menurut kalender
    Asia/Jakarta.
tags:
  - name: system
  - name: auth
  - name: shift
  - name: catalog
  - name: sales
  - name: credit
  - name: inventory
  - name: reports
  - name: settings
  - name: owner
  - name: staff
paths:
  /api/health:
    get:
      tags: [system]
      operationId: getHealth
      summary: Status layanan
      responses:
        "200":
          description: Layanan sehat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: Layanan terdegradasi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /api/users/kasir:
    get:
      tags: [auth]
      operationId: listKasirUsers
      summary: Daftar pengguna kasir untuk layar PIN
      responses:
        "200":
          description: Pengguna kasir
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
  /api/auth/pin-login:
    post:
      tags: [auth]
      operationId: pinLogin
      summary: Masuk dengan PIN kasir
      description: PIN_INVALID (401) bila PIN salah; LOCKED_OUT (423) bila terlalu banyak percobaan.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PinLoginRequest"
      responses:
        "200":
          description: Sesi dibuat (cookie kasir_session diset)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/PinInvalid"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "423":
          $ref: "#/components/responses/LockedOut"
  /api/auth/session:
    get:
      tags: [auth]
      operationId: getSession
      summary: Sesi aktif
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Sesi aktif
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Keluar (kunci layar)
      security:
        - cookieAuth: []
      responses:
        "204":
          description: Sesi dihapus
  /api/shifts/current:
    get:
      tags: [shift]
      operationId: getCurrentShift
      summary: Shift yang sedang terbuka
      description: Tanpa sesi — layar kunci perlu tahu kasir shift sebelum PIN dimasukkan.
      responses:
        "200":
          description: Shift saat ini; shift bernilai null bila belum ada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentShift"
  /api/shifts:
    post:
      tags: [shift]
      operationId: openShift
      summary: Buka shift
      description: |
        Serah terima modal (S4, K8, K22). Server menghitung ulang saran modal saat request ini,
        sama dengan getOpeningSuggestion pada jam itu (pengambilan uang pemilik di antara GET saran
        dan POST ikut terhitung). openingNote kosong setelah trim dianggap tidak dikirim. Urutan
        pemeriksaan: sesi → openingCash bukan bilangan bulat ≥ 0 atau openingNote > 200 karakter →
        422 VALIDATION → shift sudah buka → 409 SHIFT_ALREADY_OPEN → saran tidak null dan
        openingCash ≠ saran tanpa openingNote → 422 OPENING_MISMATCH (OpeningMismatchProblem
        membawa suggestedCash = saran sekarang; detail "Isi alasan bila modal berbeda dari
        Rp{saran}"; klien memuat ulang saran dari problem). Saran null (belum ada shift tutup) →
        modal bebas tanpa catatan. Tersimpan suggestedOpening (saran saat buka, null bila tanpa
        saran) dan openingNote; catatan yang terkirim padahal modal sama dengan saran disimpan null.
        Semua pengambilan uang pemilik di sela shift (shiftId null) yang belum dibatalkan dan belum
        terpakai ditandai terpakai oleh shift baru ini (sejak itu tidak bisa dibatalkan). Modal yang
        berbeda dari saran menjadi kejadian Perlu perhatian serah_terima (amount = openingCash −
        suggestedOpening, at = openedAt). Respons kasir (Shift) tanpa saran, catatan, atau data
        pemilik.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenShiftRequest"
      responses:
        "201":
          description: Shift dibuka
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shift"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/ShiftAlreadyOpen"
        "422":
          description: |
            VALIDATION (modal atau catatan tidak sah) atau OPENING_MISMATCH (modal berbeda dari saran
            tanpa catatan; OpeningMismatchProblem membawa suggestedCash)
          content:
            application/problem+json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/Problem"
                  - $ref: "#/components/schemas/OpeningMismatchProblem"
  /api/shifts/opening-suggestion:
    get:
      tags: [shift]
      operationId: getOpeningSuggestion
      summary: Saran modal awal untuk buka shift (serah terima)
      description: |
        (S4, K8) lastCountedCash = uang fisik shift tutup terakhir (closedAt terbaru), lastKasirName
        dan lastClosedAt dari shift itu; ownerTakes = Σ pengambilan uang pemilik di sela shift
        (shiftId null) yang belum dibatalkan dan belum terpakai shift berikutnya; suggestedCash =
        max(0, lastCountedCash − ownerTakes) (dijepit ≥ 0, K22). Tanpa shift tutup sebelumnya →
        suggestedCash, lastKasirName, lastClosedAt, lastCountedCash null dan ownerTakes 0 (modal
        bebas, tanpa alasan). Selagi ada shift buka tetap dihitung dari shift tutup terakhir. Saran
        dihitung ulang saat openShift; nilai di sini hanya untuk mengisi layar buka shift. Respons
        kasir: tanpa catatan modal, rincian pengambilan, atau data pemilik lain.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Saran modal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpeningSuggestion"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/shifts/current/close:
    post:
      tags: [shift]
      operationId: closeShift
      summary: Tutup shift
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CloseShiftRequest"
      responses:
        "200":
          description: Shift ditutup
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShiftClosure"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/ShiftClosed"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/shifts/current/expenses:
    get:
      tags: [shift]
      operationId: listShiftExpenses
      summary: Kas keluar shift yang sedang buka, terbaru dulu
      description: |
        Shift yang sedang buka, bukan hari ini (shift bisa lewat tengah malam); termasuk yang
        dibatalkan (status dibatalkan). Tanpa shift buka → []. Respons kasir hanya status, tanpa data
        pembatal (siapa, jam, atau alasan batal).
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Kas keluar shift ini
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DrawerExpense"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [shift]
      operationId: createShiftExpense
      summary: Catat kas keluar dari laci (alasan wajib)
      description: |
        (S2, K10) Uang keluar dari laci beralasan (mis. beli es batu); uang seharusnya shift yang
        sedang buka turun sebesar amount (ShiftClosure.expenses). Urutan pemeriksaan: sesi → id
        kosong atau > 64 karakter → 422 VALIDATION → id sudah dipakai: milik pengguna ini → 200
        rekaman tersimpan apa adanya tanpa kas keluar kedua (isi body baru diabaikan), milik pengguna
        lain → 409 ID_TAKEN tanpa isi rekaman → amount bukan bilangan bulat ≥ 1, atau reason kosong
        (setelah trim) atau > 200 karakter → 422 VALIDATION → tanpa shift buka → 409 SHIFT_CLOSED.
        Idempoten menurut (pembuat, id). Replay id yang sudah dibatalkan mengembalikan 200 dengan
        rekaman berstatus dibatalkan; klien wajib memperlakukannya sebagai belum tersimpan (lepas id,
        jangan tampilkan tersimpan, simpan berikutnya memakai id baru). at = jam server; rekaman
        menyimpan shiftId shift itu dan pencatatnya. Kas keluar dengan amount > expenseSingleMax,
        dan kas keluar yang membuat Σ kas keluar aktif shift > expenseShiftMax, menjadi kejadian
        Perlu perhatian kas_keluar (ambang dari Pengaturan saat dibaca, K4/K7).
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpenseInput"
      responses:
        "200":
          description: id sudah pernah disimpan pengguna ini; rekaman lama dikembalikan (replay)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DrawerExpense"
        "201":
          description: Kas keluar dicatat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DrawerExpense"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: SHIFT_CLOSED (tanpa shift buka) atau ID_TAKEN (id milik pengguna lain)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/shifts/current/expenses/{expenseId}/cancel:
    post:
      tags: [shift]
      operationId: cancelShiftExpense
      summary: Batalkan kas keluar di kasir (alasan wajib)
      description: |
        (S10) Kasir hanya boleh membatalkan kas keluar dari shift yang sedang buka; setelah shift
        tutup, batal hanya dari app pemilik (cancelOwnerExpense). Tanpa PIN pemilik; alasan wajib.
        Urutan pemeriksaan: sesi → id tidak dikenal → 404 → sudah dibatalkan → 200 rekaman apa
        adanya tanpa perubahan → reason kosong (setelah trim) atau > 200 karakter → 422 VALIDATION →
        tanpa shift buka → 409 SHIFT_CLOSED → shiftId kas keluar bukan shift yang sedang buka → 409
        OUTSIDE_SHIFT. Berhasil: ShiftClosure.expenses shift yang buka turun sebesar amount (uang
        seharusnya naik lagi). Tercatat cancelledAt (jam server), pembatal (id + nama, boleh beda
        dari pencatat), channel kasir, dan alasan; menjadi kejadian Perlu perhatian batal_kas_keluar
        (amount = nominal, reason = alasan batal). Kas keluar yang dibatalkan tidak lagi ikut
        kejadian kas_keluar maupun Σ kas keluar shift. Respons kasir hanya status.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/ExpenseId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelCreditPaymentInput"
      responses:
        "200":
          description: Kas keluar dibatalkan (atau sudah dibatalkan sebelumnya)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DrawerExpense"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: SHIFT_CLOSED (tanpa shift buka) atau OUTSIDE_SHIFT (kas keluar dari shift lain)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/settings/kasir:
    get:
      tags: [settings]
      operationId: getKasirSettings
      summary: Pengaturan layar kasir
      description: |
        Publik (layar kunci dan layar pembeli). storeName = nama toko di Pengaturan pemilik.
        ownerPhone = nomor telepon pemilik untuk baris "Ragu? Telepon pemilik" (R11), hanya bila
        request membawa sesi kasir; tanpa sesi kasir → null (endpoint publik bisa terbaca lewat
        terowongan, K19). shiftMaxHours = AttentionRules.shiftMaxHours (satu sumber); pita shift
        kelamaan di kasir memakai openedAt shift + nilai ini, tanpa request tambahan. Tanpa data
        pemilik lain (ambang Perlu perhatian, alamat, catatan kaki struk).
      responses:
        "200":
          description: Pengaturan kasir
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KasirSettings"
  /api/settings/qris-image/{imageId}:
    get:
      tags: [settings]
      operationId: getQrisImage
      summary: Gambar QRIS toko yang diunggah pemilik (PNG/JPEG)
      description: |
        Publik (ditampilkan ke pembeli di kasir). KasirSettings.qrisImageUrl dan
        OwnerSettings.store.qrisImageUrl menunjuk ke sini setelah pemilik mengunggah gambar
        (putOwnerQrisImage); gambar contoh bawaan berupa berkas statis. id tidak dikenal → 404.
      parameters:
        - name: imageId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Gambar QRIS
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"
  /api/catalog/lookup:
    get:
      tags: [catalog]
      operationId: lookupCatalog
      summary: Cari satu barang dari barcode atau kode toko
      description: |
        PRODUCT_INACTIVE (410) bila kode cocok dengan barang nonaktif atau satuan nonaktif;
        PRODUCT_NO_PRICE (410) bila barangnya menunggu_harga (belum punya harga jual).
        Penjualan yang sudah ada di keranjang tetap diterima createSale.
      parameters:
        - name: code
          in: query
          required: true
          description: Barcode atau kode toko (persis)
          schema:
            type: string
      responses:
        "200":
          description: Barang cocok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogMatch"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          description: PRODUCT_INACTIVE atau PRODUCT_NO_PRICE
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: Parameter code kosong atau tidak ada (VALIDATION)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/catalog/search:
    get:
      tags: [catalog]
      operationId: searchCatalog
      summary: Cari barang menurut nama
      description: |
        Mencari menurut nama saja (barcode / kode toko lewat lookupCatalog); q kurang dari
        2 karakter atau hanya angka menghasilkan daftar kosong. Mengembalikan paling banyak 8 hasil,
        tanpa barang nonaktif atau menunggu_harga, dan tanpa satuan nonaktif.
      parameters:
        - name: q
          in: query
          required: true
          description: Kata kunci nama barang
          schema:
            type: string
      responses:
        "200":
          description: Kecocokan, maksimal 8 hasil
          content:
            application/json:
              schema:
                type: array
                maxItems: 8
                items:
                  $ref: "#/components/schemas/CatalogMatch"
  /api/catalog/quick-curah:
    get:
      tags: [catalog]
      operationId: listQuickCurah
      summary: Barang curah pilihan cepat
      description: Sesuai quickCurahProductIds, tanpa barang nonaktif atau menunggu_harga, dan tanpa satuan nonaktif.
      responses:
        "200":
          description: Kecocokan sesuai quickCurahProductIds
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CatalogMatch"
  /api/sales:
    post:
      tags: [sales]
      operationId: createSale
      summary: Simpan penjualan
      description: |
        Idempoten menurut saleId. Tanpa PIN pemilik (ruling R1/R3). 409 membawa SHIFT_CLOSED,
        PRICE_CHANGED (PriceChangedProblem), atau CREDIT_LIMIT (CreditLimitProblem). 422 membawa
        VALIDATION atau INVALID_QUANTITY.
        Kasbon melewati limit (limit = batas peringatan): tanpa creditLimitReason (atau kosong
        setelah trim) → 409 CREDIT_LIMIT; dengan alasan → penjualan tersimpan beserta kelebihannya
        (bagian kasbon ini di atas limit = min(attempted, balance + attempted − creditLimit)), kasir,
        jam, dan alasan, lalu menjadi butir Perlu perhatian pemilik. Alasan yang terkirim padahal
        tidak melewati limit diabaikan. Penjualan menyimpan shiftId shift yang sedang buka.
        Respons kasir tanpa HPP, laba, atau data pengecualian (alasan, kelebihan limit).
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaleRequest"
      responses:
        "200":
          description: saleId sudah pernah disimpan; penjualan lama dikembalikan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sale"
        "201":
          description: Penjualan dibuat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sale"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: SHIFT_CLOSED, PRICE_CHANGED, atau CREDIT_LIMIT
          content:
            application/problem+json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ShiftClosedProblem"
                  - $ref: "#/components/schemas/PriceChangedProblem"
                  - $ref: "#/components/schemas/CreditLimitProblem"
                discriminator:
                  propertyName: code
                  mapping:
                    SHIFT_CLOSED: "#/components/schemas/ShiftClosedProblem"
                    PRICE_CHANGED: "#/components/schemas/PriceChangedProblem"
                    CREDIT_LIMIT: "#/components/schemas/CreditLimitProblem"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/sales/shift:
    get:
      tags: [sales]
      operationId: listShiftSales
      summary: Penjualan shift yang sedang buka, terbaru dulu
      description: |
        Shift yang sedang buka, bukan hari ini (shift bisa lewat tengah malam); termasuk yang
        dibatalkan. Tanpa shift buka → []. HPP, laba, dan data pengecualian tidak pernah ada di
        respons kasir.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Penjualan shift ini
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Sale"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/sales/lookup:
    get:
      tags: [sales]
      operationId: lookupSales
      summary: Cari transaksi shift sebelumnya menurut nomor struk (maksimal 7 hari)
      description: |
        Untuk batal transaksi keesokan hari di kasir (ruling R12). Hanya penjualan dari shift lain
        (bukan shift yang sedang buka) dengan hari kalender Asia/Jakarta paling lama 7 hari lalu
        (isoDaysBetween(tanggal jual, hari ini) ≤ 7), nomor struk memuat q; termasuk yang
        dibatalkan; terbaru dulu, paling banyak 20. Butuh sesi kasir dan shift yang sedang buka
        (tanpa shift → 409 SHIFT_CLOSED). q kosong → 422 VALIDATION. customerName = nama pelanggan
        (null bila tanpa pelanggan). HPP, laba, dan data pengecualian tidak pernah ada di respons
        kasir.
      security:
        - cookieAuth: []
      parameters:
        - name: q
          in: query
          required: true
          description: Sebagian nomor struk (digit dan tanda hubung), mis. 0145 atau 20261104-0145
          schema:
            type: string
            minLength: 1
            maxLength: 20
            pattern: '^[0-9-]+$'
      responses:
        "200":
          description: Transaksi yang cocok
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KasirLookupSale"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/ShiftClosed"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/sales/{saleId}/print:
    post:
      tags: [sales]
      operationId: printSale
      summary: Cetak ulang struk
      security:
        - cookieAuth: []
      parameters:
        - name: saleId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Hasil cetak
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrintResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/sales/{saleId}/void:
    post:
      tags: [sales]
      operationId: voidSale
      summary: Batalkan penjualan di kasir (alasan wajib)
      description: |
        Tanpa PIN pemilik (ruling R4/R5); alasan wajib. Urutan pemeriksaan: id tidak dikenal → 404;
        sudah dibatalkan → 200 apa adanya tanpa perubahan (kirim ulang dengan qrisRefundSource lain
        tidak menambah atau mengubah pengembalian); reason kosong (setelah trim) atau > 200 karakter
        → 422 VALIDATION; transaksi berbagian QRIS tanpa qrisRefundSource laci/pemilik → 422
        VALIDATION; tanpa shift buka → 409 SHIFT_CLOSED; penjualan dari shift lain yang hari
        kalender Asia/Jakarta-nya lebih dari 7 hari lalu → 409 VOID_TOO_OLD (batalkan dari app
        pemilik).
        Berhasil: stok kembali dan bagian kasbon dibatalkan di buku (saldo boleh minus; pelunasan
        tidak ikut batal). Penjualan shift yang sedang buka: tunai penjualan shift ini turun
        (cashSales, salesCount). Penjualan shift lain (≤ 7 hari, ruling R12): shift lama tidak
        diubah; bagian tunai keluar dari laci shift yang sedang buka. Bagian QRIS dengan
        qrisRefundSource laci (shift ini maupun shift lama) juga keluar dari laci shift yang
        sedang buka; pemilik = ditransfer pemilik nanti, di luar laci. Uang yang keluar dari laci
        dicatat sebagai ShiftClosure.saleRefunds shift yang sedang buka. Bagian kasbon dan
        kembalian tidak pernah menyentuh laci. Tercatat jam server, pembatal (id + nama), alasan,
        dan pengembaliannya di rekaman penjualan; menjadi butir Perlu perhatian pemilik.
      security:
        - cookieAuth: []
      parameters:
        - name: saleId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoidRequest"
      responses:
        "200":
          description: Penjualan dibatalkan (atau sudah dibatalkan sebelumnya)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sale"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: SHIFT_CLOSED (tanpa shift buka) atau VOID_TOO_OLD (transaksi lebih dari 7 hari)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          $ref: "#/components/responses/ValidationFailed"
