        totalBalance:
          type: integer
          description: Σ saldo > 0 (Lebih bayar tidak mengurangi).
        debtorCount:
          type: integer
          description: Jumlah pelanggan bersaldo > 0.
        ages:
          type: array
          description: Tepat 3 entri, urut hari_0_7, hari_8_30, lebih_30_hari; hanya saldo > 0.
          minItems: 3
          maxItems: 3
          items:
            $ref: "#/components/schemas/CreditAgeSummary"
        overdueCount:
          type: integer
          description: Jumlah pelanggan kelompok lebih_30_hari.
    CreditPaymentInfo:
