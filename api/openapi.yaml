            - $ref: "#/components/schemas/DebtPayment"
        createdAt:
          type: integer
          format: int64
        createdByName:
          type: string
        editedByName:
          type: string
          nullable: true
    OwnerReceipt:
      description: Nota versi pemilik (field StaffReceipt ditambah pelunasan, pembatalan, dan riwayat).
      allOf:
        - $ref: "#/components/schemas/StaffReceipt"
        - type: object
          required: [paid, cancelledAt, audit]
          properties:
            paid:
              nullable: true
              description: Pelunasan utang; null bila belum lunas atau bukan Bayar nanti.
              allOf:
                - $ref: "#/components/schemas/DebtPayment"
            cancelledAt:
              type: integer
              format: int64
              nullable: true
            audit:
              type: array
              description: Riwayat perubahan, terlama dulu.
              items:
                $ref: "#/components/schemas/ReceiptAuditEntry"
    SupplierDebt:
      type: object
      description: Satu nota Bayar nanti yang tidak dibatalkan; amount = total nota.
      required: [receiptId, supplierName, notaDate, amount, dueDate, paid, photoId, createdAt, createdByName]
      properties:
        receiptId:
          type: string
        supplierName:
          type: string
        notaDate:
          type: string
          format: date
        amount:
          type: integer
        dueDate:
          type: string
          format: date
        paid:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/DebtPayment"
        photoId:
          type: string
          nullable: true
        createdAt:
          type: integer
          format: int64
        createdByName:
          type: string
    DrawerShift:
      type: object
      description: Shift kasir yang sedang buka (tujuan uang keluar Dari laci kasir).
      required: [kasirName, openedAt]
      properties:
        kasirName:
          type: string
        openedAt:
          type: integer
          format: int64
    StaffShift:
      type: object
      description: Shift laci untuk orang toko; tanpa uang modal atau angka kas.
      required: [shift]
      properties:
        shift:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/DrawerShift"
    SupplierDebtList:
      type: object
      required: [debts, drawerShift]
      properties:
        debts:
          type: array
          description: Belum lunas urut jatuh tempo, lalu lunas terbaru dulu.
          items:
            $ref: "#/components/schemas/SupplierDebt"
        drawerShift:
          nullable: true
          description: null bila tidak ada shift buka (Dari laci kasir tidak tersedia).
          allOf:
            - $ref: "#/components/schemas/DrawerShift"
    PayDebtInput:
      type: object
      description: cashSource wajib bila tunai, null bila transfer.
      required: [method, cashSource]
      properties:
        method:
          type: string
          enum: [tunai, transfer]
        cashSource:
          type: string
          nullable: true
          enum: [laci, pemilik]
    ReceiptField:
      type: string
      description: |
        Isian nota yang salah. Tingkat nota (lineId null): supplierName, notaDate, lines, photoId,
        payment, dueDate, cashSource. Tingkat baris: product, unit, qty, unitCost, expiryDate, dan
        isian barang baru newName, newSellUnit, newNotaUnit, newNotaUnitSize, newBarcode.
      enum: [supplierName, notaDate, lines, photoId, payment, dueDate, cashSource, product, unit, qty, unitCost, expiryDate, newName, newSellUnit, newNotaUnit, newNotaUnitSize, newBarcode]
    ReceiptError:
      type: object
      required: [lineId, field, message]
      properties:
        lineId:
          type: string
          nullable: true
          description: null = galat tingkat nota.
        field:
          $ref: "#/components/schemas/ReceiptField"
        message:
          type: string
    ReceiptProblem:
      description: Problem VALIDATION dengan galat per baris/field nota barang masuk.
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [code, errors]
          properties:
            code:
              type: string
              enum: [VALIDATION]
            errors:
              type: array
              items:
                $ref: "#/components/schemas/ReceiptError"
    OpnameScope:
      type: object
      description: |
        Lingkup opname. kategori = barang berkategori category; tanpa_kategori = barang berkategori
        null (mis. barang baru dari nota); semua = semua barang. category wajib iff kind = kategori
        (selain itu null).
      required: [kind, category]
      properties:
        kind:
          type: string
          enum: [kategori, tanpa_kategori, semua]
        category:
          type: string
          nullable: true
    OpnameReason:
      type: string
      description: |
        Alasan selisih opname. rusak, hilang, kedaluwarsa, dan salah_input dipilih staf;
        tidak_diketahui = salah_input tanpa nota rujukan (J4).
      enum: [rusak, hilang, kedaluwarsa, salah_input, tidak_diketahui]
    OpnameItemState:
      type: string
      description: |
        cocok = selisih 0; stok_awal = hitungan pertama barang stockCounted false, langsung jadi
        stok (J1); menunggu_alasan = selisih, alasan belum disimpan; disesuaikan = stok sudah
        dikoreksi; ditahan = menunggu persetujuan pemilik (nilai > Rp100.000 atau HPP belum ada);
        disetujui = disetujui pemilik; dihitung_ulang = dihitung ulang pemilik; diganti = kalah
        oleh hitungan barang yang sama dengan countedAt lebih baru, tidak pernah diterapkan.
      enum: [cocok, stok_awal, menunggu_alasan, disesuaikan, ditahan, disetujui, dihitung_ulang, diganti]
    OpnameSessionStatus:
      type: string
      description: |
        menunggu_alasan = ada barang menunggu_alasan; selesai = alasan sudah disimpan, atau tidak
        ada (lagi) barang menunggu_alasan — sesi yang semua barang menunggu_alasan-nya menjadi
        diganti otomatis selesai (finishedAt = saat itu).
      enum: [menunggu_alasan, selesai]
    StaffOpnameCategory:
      type: object
      description: Satu lingkup opname; scope.kind kategori atau tanpa_kategori.
      required: [scope, productCount, lastCountedAt]
      properties:
        scope:
          $ref: "#/components/schemas/OpnameScope"
        productCount:
          type: integer
        lastCountedAt:
          type: integer
          format: int64
          nullable: true
          description: submittedAt sesi terakhir dengan lingkup ini atau semua; null = belum pernah dihitung.
    StaffOpnameCategories:
      type: object
      required: [categories, allCount, suggested]
      properties:
        categories:
          type: array
          description: Belum pernah dihitung dulu, lalu paling lama dihitung.
          items:
            $ref: "#/components/schemas/StaffOpnameCategory"
        allCount:
          type: integer
          description: Jumlah barang berstatus selain nonaktif (lingkup semua).
        suggested:
          nullable: true
          description: Lingkup pertama di categories; null bila kosong.
          allOf:
            - $ref: "#/components/schemas/OpnameScope"
    OpnameCountInput:
      type: object
      required: [productId, qtyBase, countedAt]
      properties:
        productId:
          type: string
        qtyBase:
          type: integer
          minimum: 0
          description: Jumlah fisik dalam satuan dasar; 0 sah.
        countedAt:
          type: integer
          format: int64
          description: Jam HP saat barang dibuka untuk dihitung (scan/ketuk); membuka ulang memperbarui jamnya.
    OpnameSessionInput:
      type: object
      required: [id, scope, deviceNow, items]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 64
          description: ID draf dari HP (idempotensi).
        scope:
          $ref: "#/components/schemas/OpnameScope"
        deviceNow:
          type: integer
          format: int64
          description: Jam HP saat mengirim; dipakai menggeser countedAt ke jam server (K6).
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/OpnameCountInput"
    OpnameReceiptOption:
      type: object
      description: Nota barang masuk aktif yang memuat barang itu (rujukan salah input sebelumnya).
      required: [receiptId, supplierName, notaDate]
      properties:
        receiptId:
          type: string
        supplierName:
          type: string
        notaDate:
          type: string
          format: date
    StaffOpnameItem:
      type: object
      description: |
        Satu barang yang dihitung. systemQtyBase baru dikirim setelah hitungan diterima server
        (hitung buta, K8): stok pada jam hitung (countedAt server), diffQtyBase = countedQtyBase −
        systemQtyBase. Tanpa nilai rupiah.
      required: [productId, productName, unitName, unitSize, isCurah, countedQtyBase, countedAt, clockEstimated, systemQtyBase, diffQtyBase, state, reason, receiptRef, receiptOptions]
      properties:
        productId:
          type: string
        productName:
          type: string
        unitName:
          type: string
          description: Satuan eceran.
        unitSize:
          type: integer
          minimum: 1
          description: Isi satuan eceran dalam satuan dasar.
        isCurah:
          type: boolean
        countedQtyBase:
          type: integer
        countedAt:
          type: integer
          format: int64
          description: Jam hitung setelah digeser ke jam server (K6).
        clockEstimated:
          type: boolean
          description: Jam HP melenceng > 5 menit dari jam server, atau jam hasil geser dijepit ke jam server.
        systemQtyBase:
          type: integer
        diffQtyBase:
          type: integer
        state:
          $ref: "#/components/schemas/OpnameItemState"
        reason:
          nullable: true
          description: Alasan tersimpan; null bila belum ada atau tidak perlu.
          allOf:
            - $ref: "#/components/schemas/OpnameReason"
        receiptRef:
          nullable: true
          description: Nota rujukan untuk salah_input (J4).
          allOf:
            - $ref: "#/components/schemas/OpnameReceiptOption"
        receiptOptions:
          type: array
          description: |
            Barang selisih: paling banyak 5 nota aktif terakhir yang memuat barang itu (notaDate lalu
            createdAt terbaru dulu); kosong untuk barang lain.
          maxItems: 5
          items:
            $ref: "#/components/schemas/OpnameReceiptOption"
    StaffOpnameSession:
      type: object
      required: [id, scope, status, createdByName, submittedAt, finishedAt, items]
      properties:
        id:
          type: string
        scope:
          $ref: "#/components/schemas/OpnameScope"
        status:
          $ref: "#/components/schemas/OpnameSessionStatus"
        createdByName:
          type: string
        submittedAt:
          type: integer
          format: int64
          description: Waktu server saat hitungan diterima.
        finishedAt:
          type: integer
          format: int64
          nullable: true
        items:
          type: array
          description: Urut nama barang.
          items:
            $ref: "#/components/schemas/StaffOpnameItem"
    StaffOpnameRow:
      type: object
      required: [id, scope, status, submittedAt, finishedAt, itemCount, diffCount, heldCount]
      properties:
        id:
          type: string
        scope:
          $ref: "#/components/schemas/OpnameScope"
        status:
          $ref: "#/components/schemas/OpnameSessionStatus"
        submittedAt:
          type: integer
          format: int64
        finishedAt:
          type: integer
          format: int64
          nullable: true
        itemCount:
          type: integer
          description: Jumlah barang dihitung.
        diffCount:
          type: integer
          description: Jumlah barang selisih (bukan cocok, stok_awal, atau diganti).
        heldCount:
          type: integer
          description: Jumlah barang ditahan.
    OpnameReasonInput:
      type: object
      required: [productId, reason, receiptId]
      properties:
        productId:
          type: string
        reason:
          type: string
          enum: [rusak, hilang, kedaluwarsa, salah_input]
        receiptId:
          type: string
          nullable: true
          description: Hanya untuk salah_input; dari receiptOptions barang itu; null = tidak tahu notanya.
    OpnameFinishInput:
      type: object
      required: [reasons]
      properties:
        reasons:
          type: array
          items:
            $ref: "#/components/schemas/OpnameReasonInput"
    OpnameRecount:
      type: object
      description: Hitung ulang pemilik; systemQtyBase = stok saat hitung ulang.
      required: [countedQtyBase, countedAt, systemQtyBase, diffQtyBase, value]
      properties:
        countedQtyBase:
          type: integer
        countedAt:
          type: integer
          format: int64
        systemQtyBase:
          type: integer
        diffQtyBase:
          type: integer
        value:
          type: integer
          nullable: true
          description: Nilai rupiah |diffQtyBase| (K3); null bila HPP belum ada.
    OwnerOpnameItem:
      description: Barang opname versi pemilik (field StaffOpnameItem ditambah nilai rupiah dan penyelesaian).
      allOf:
        - $ref: "#/components/schemas/StaffOpnameItem"
        - type: object
          required: [value, units, resolvedByName, resolvedAt, replacedBySessionId, recount]
          properties:
            value:
              type: integer
              nullable: true
              description: |
                round_half_up(|diffQtyBase| × cost.amount ÷ cost.qtyBase) dari HPP saat dinilai (K3);
                null bila HPP belum ada (selisih ≠ 0 selalu ditahan, J3).
            units:
              type: array
              description: Satuan aktif barang sekarang (untuk penghitung hitung ulang); units[0] = eceran.
              items:
                $ref: "#/components/schemas/StaffUnit"
            resolvedByName:
              type: string
              nullable: true
              description: Pemilik yang menyetujui atau menghitung ulang.
            resolvedAt:
              type: integer
              format: int64
              nullable: true
            replacedBySessionId:
              type: string
              nullable: true
              description: Sesi yang hitungannya menggantikan barang ini (state diganti).
            recount:
              nullable: true
              allOf:
                - $ref: "#/components/schemas/OpnameRecount"
    OwnerOpnameSession:
      type: object
      description: |
        lossValue / gainValue (K26) = Σ value barang menunggu_alasan, disesuaikan, ditahan,
        disetujui, dan recount.value barang dihitung_ulang (kurang → loss, lebih → gain); cocok,
        stok_awal, dan diganti tidak dihitung. totalValue = lossValue + gainValue. flagged
        ditetapkan saat alasan disimpan (Σ > Rp250.000) dan tidak berubah.
      required: [id, scope, status, createdByName, submittedAt, finishedAt, items, lossValue, gainValue, totalValue, flagged, reviewedByName, reviewedAt]
      properties:
        id:
          type: string
        scope:
          $ref: "#/components/schemas/OpnameScope"
        status:
          $ref: "#/components/schemas/OpnameSessionStatus"
        createdByName:
          type: string
        submittedAt:
          type: integer
          format: int64
        finishedAt:
          type: integer
          format: int64
          nullable: true
        items:
          type: array
          items:
            $ref: "#/components/schemas/OwnerOpnameItem"
        lossValue:
          type: integer
        gainValue:
          type: integer
        totalValue:
          type: integer
        flagged:
          type: boolean
        reviewedByName:
          type: string
          nullable: true
        reviewedAt:
          type: integer
          format: int64
          nullable: true
    OwnerOpnameRow:
      type: object
      required: [id, scope, status, createdByName, submittedAt, finishedAt, itemCount, diffCount, heldCount, totalValue, flagged, reviewed]
      properties:
        id:
          type: string
        scope:
          $ref: "#/components/schemas/OpnameScope"
        status:
          $ref: "#/components/schemas/OpnameSessionStatus"
        createdByName:
          type: string
        submittedAt:
          type: integer
          format: int64
        finishedAt:
          type: integer
          format: int64
          nullable: true
        itemCount:
          type: integer
        diffCount:
          type: integer
        heldCount:
          type: integer
        totalValue:
          type: integer
        flagged:
          type: boolean
        reviewed:
          type: boolean
    OpnameRecountInput:
      type: object
      required: [qtyBase]
      properties:
        qtyBase:
          type: integer
          minimum: 0
    OpnameError:
      type: object
      required: [productId, message]
      properties:
        productId:
          type: string
          nullable: true
          description: null = galat tingkat sesi.
        message:
          type: string
    OpnameProblem:
      description: Problem VALIDATION dengan galat per barang opname.
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [code, errors]
          properties:
            code:
              type: string
              enum: [VALIDATION]
            errors:
              type: array
              items:
                $ref: "#/components/schemas/OpnameError"
    ExpiryStage:
      type: string
      description: lewat = ED sebelum hari ini; segera = 0–soonDays hari lagi (ED hari ini termasuk).
      enum: [lewat, segera]
    StaffExpiryLot:
      type: object
      description: |
        Satu kiriman (baris nota) ber-ED. estimateQtyBase = perkiraan sisa FIFO (K9);
        capacityQtyBase = batas keluarkan dari kiriman ini.
      required: [lineId, receiptId, productId, productName, unitName, unitSize, isCurah, estimateQtyBase, capacityQtyBase, expiryDate, stage, supplierName, notaDate]
      properties:
        lineId:
          type: string
        receiptId:
          type: string
        productId:
          type: string
        productName:
          type: string
        unitName:
          type: string
          description: Satuan eceran.
        unitSize:
          type: integer
          minimum: 1
        isCurah:
          type: boolean
        estimateQtyBase:
          type: integer
        capacityQtyBase:
          type: integer
        expiryDate:
          type: string
          format: date
        stage:
          $ref: "#/components/schemas/ExpiryStage"
        supplierName:
          type: string
        notaDate:
          type: string
          format: date
    ExpiryEvent:
      type: object
      description: keluar = dikeluarkan dari stok (qtyBase positif, tanggal null); ubah_ed = tanggal ED dibetulkan (qtyBase null).
      required: [id, at, actorName, kind, receiptId, lineId, productId, productName, unitName, unitSize, isCurah, qtyBase, fromDate, toDate]
      properties:
        id:
          type: string
        at:
          type: integer
          format: int64
        actorName:
          type: string
        kind:
          type: string
          enum: [keluar, ubah_ed]
        receiptId:
          type: string
        lineId:
          type: string
        productId:
          type: string
        productName:
          type: string
        unitName:
          type: string
        unitSize:
          type: integer
          minimum: 1
        isCurah:
          type: boolean
        qtyBase:
          type: integer
          nullable: true
        fromDate:
          type: string
          format: date
          nullable: true
        toDate:
          type: string
          format: date
          nullable: true
    StaffExpiryList:
      type: object
      required: [soonDays, lots, recent]
      properties:
        soonDays:
          type: integer
          description: Batas tahap segera (hari), dari pengaturan server.
        lots:
          type: array
          items:
            $ref: "#/components/schemas/StaffExpiryLot"
        recent:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/ExpiryEvent"
    OwnerExpiryLot:
      description: Kiriman ber-ED versi pemilik.
      allOf:
        - $ref: "#/components/schemas/StaffExpiryLot"
        - type: object
          required: [lossValue]
          properties:
            lossValue:
              type: integer
              nullable: true
              description: round_half_up(estimateQtyBase × cost.amount ÷ cost.qtyBase) dari HPP sekarang; null bila HPP belum ada.
    OwnerExpiryEvent:
      description: Log kedaluwarsa versi pemilik.
      allOf:
        - $ref: "#/components/schemas/ExpiryEvent"
        - type: object
          required: [lossValue]
          properties:
            lossValue:
              type: integer
              nullable: true
              description: Nilai yang dikeluarkan dari HPP saat kejadian (K28, tidak dihitung ulang); null untuk ubah_ed atau tanpa HPP.
    OwnerExpiryList:
      type: object
      required: [soonDays, lots, recent, expiredLossValue]
      properties:
        soonDays:
          type: integer
        lots:
          type: array
          items:
            $ref: "#/components/schemas/OwnerExpiryLot"
        recent:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/OwnerExpiryEvent"
        expiredLossValue:
          type: integer
          description: Perkiraan kerugian = Σ lossValue yang diketahui pada kiriman tahap lewat.
    ExpiryRemovalInput:
      type: object
      required: [id, receiptId, lineId, qtyBase]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 64
          description: ID dari HP (idempotensi).
        receiptId:
          type: string
        lineId:
          type: string
        qtyBase:
          type: integer
          minimum: 1
          description: Jumlah dalam satuan dasar; paling banyak capacityQtyBase kiriman itu.
    ExpiryDateInput:
      type: object
      required: [expiryDate]
      properties:
        expiryDate:
          type: string
          format: date
    StaffLowStockItem:
      type: object
      description: Barang menipis untuk orang toko; tanpa angka sisa stok (J7).
      required: [productId, productName, unitName, unitSize, isCurah, minQtyBase]
      properties:
        productId:
          type: string
        productName:
          type: string
        unitName:
          type: string
          description: Satuan eceran.
        unitSize:
          type: integer
          minimum: 1
        isCurah:
          type: boolean
        minQtyBase:
          type: integer
          description: Batas menipis (minStock) dalam satuan dasar.
    ExpiryAttention:
      type: object
      description: Jumlah barang berbeda yang punya ≥ 1 kiriman di tahap lewat / segera (K19).
      required: [expiredCount, soonCount, soonDays]
      properties:
        expiredCount:
          type: integer
        soonCount:
          type: integer
        soonDays:
          type: integer
    OpnameFlag:
      type: object
      description: Sesi opname bertanda selisih besar yang belum ditinjau.
      required: [sessionId, scope, finishedAt, totalValue]
      properties:
        sessionId:
          type: string
        scope:
          $ref: "#/components/schemas/OpnameScope"
        finishedAt:
          type: integer
          format: int64
        totalValue:
          type: integer
