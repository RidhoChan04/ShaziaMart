        items:
          type: array
          items:
            $ref: "#/components/schemas/SaleItem"
        total:
          type: integer
        payments:
          type: array
          items:
            $ref: "#/components/schemas/PaymentInput"
        cashReceived:
          type: integer
          description: Uang tunai diterima; 0 bila penjualan tanpa bagian tunai.
        change:
          type: integer
          description: Kembalian; 0 bila penjualan tanpa bagian tunai.
        customerId:
          type: string
