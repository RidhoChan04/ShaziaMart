      summary: Atur limit kasbon pelanggan
      description: |
        Limit = batas peringatan, bilangan bulat ≥ 0; boleh di bawah saldo sekarang (kasbon baru di
        kasir yang melewati limit tetap boleh dengan alasan wajib).
      security:
