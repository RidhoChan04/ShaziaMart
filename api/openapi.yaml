              $ref: "#/components/schemas/CreditLimitInput"
      responses:
        "200":
          description: Limit disimpan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerCustomer"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
