          type: string
          nullable: true
        saleNumber:
          type: string
          nullable: true
        kasirName:
          type: string
          nullable: true
        payment:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/CreditPaymentInfo"
        cancelled:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/CreditCancel"
    OwnerCustomer:
      description: Detail kasbon pelanggan untuk pemilik.
