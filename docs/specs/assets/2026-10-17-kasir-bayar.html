<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mockup Jendela bayar</title><style>
  :root {
    --bg: #fbfaf7; --surface: #ffffff; --text: #1d1f21; --muted: #5d6368;
    --border: #e3e0d8; --accent: #2f7a4d; --accent-soft: #e6f2ea;
    --warn: #a3621a; --warn-soft: #fbf0e1; --code: #f2f0ea;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #151719; --surface: #1d2023; --text: #e8e6e1; --muted: #a0a6ab;
      --border: #33383c; --accent: #6cc28f; --accent-soft: #1f3328;
      --warn: #e2a65a; --warn-soft: #3a2d1b; --code: #262a2d;
    }
  }
  :root[data-theme="dark"] {
    --bg: #151719; --surface: #1d2023; --text: #e8e6e1; --muted: #a0a6ab;
    --border: #33383c; --accent: #6cc28f; --accent-soft: #1f3328;
    --warn: #e2a65a; --warn-soft: #3a2d1b; --code: #262a2d;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 960px; margin: 0 auto; padding: 40px 16px 80px; }
  h1 { font-size: 2rem; line-height: 1.2; margin: 0 0 4px; }
  .meta { color: var(--muted); font-size: .9rem; margin-bottom: 24px; }
  h2 { font-size: 1.35rem; margin: 48px 0 12px; padding-top: 16px; border-top: 1px solid var(--border); }
  h3 { font-size: 1.05rem; margin: 24px 0 8px; }
  p { margin: 0 0 12px; }
  ul, ol { padding-left: 22px; margin: 0 0 12px; }
  li { margin-bottom: 4px; }
  a { color: var(--accent); }
  code { background: var(--code); padding: 1px 5px; border-radius: 4px; font-size: .88em; font-family: ui-monospace, Consolas, monospace; }
  pre { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; overflow-x: auto; font-size: .85rem; line-height: 1.5; margin: 0 0 16px; }
  pre code { background: none; padding: 0; }
  nav.toc { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 18px; margin-bottom: 8px; }
  nav.toc ol { margin: 0; columns: 2; column-gap: 32px; }
  nav.toc a { color: var(--text); text-decoration: none; }
  .table-wrap { overflow-x: auto; margin: 0 0 16px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); }
  table { border-collapse: collapse; width: 100%; font-size: .92rem; }
  th, td { text-align: left; vertical-align: top; padding: 9px 12px; border-bottom: 1px solid var(--border); }
  th { font-weight: 600; background: var(--code); white-space: nowrap; }
  tr:last-child td { border-bottom: none; }
  .callout { background: var(--accent-soft); border-left: 3px solid var(--accent); padding: 12px 16px; border-radius: 6px; margin: 0 0 16px; }
  .note { color: var(--muted); font-size: .9rem; }
  figure { margin: 8px 0 20px; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  figure .frame { overflow-x: auto; }
  figcaption { color: var(--muted); font-size: .88rem; padding: 8px 12px; background: var(--surface); border-top: 1px solid var(--border); }
  @media (max-width: 600px) { nav.toc ol { columns: 1; } h1 { font-size: 1.6rem; } }
 body{margin:0;padding:0;background:transparent} .frame{margin:0}</style></head><body><div class="frame">
<div style="padding:24px;background:rgba(28,36,33,.45);font-family:Inter,system-ui,sans-serif;color:#1c2421;font-size:12px">
  <div style="max-width:520px;margin:0 auto;background:#fff;border-radius:12px;overflow:hidden">
    <div style="display:flex;justify-content:space-between;align-items:baseline;padding:14px 18px;border-bottom:1px solid #eef1ef"><span style="color:#5e6b65">TOTAL BELANJA · 6 barang</span><span style="font-size:24px;font-weight:700">Rp361.500</span></div>
    <div style="display:flex;gap:6px;padding:12px 18px 0">
      <span style="background:#1f7a4d;color:#fff;border-radius:6px;padding:8px 16px;font-weight:600">Tunai</span>
      <span style="border:1px solid #e3e7e4;border-radius:6px;padding:8px 16px">QRIS</span>
      <span style="border:1px solid #e3e7e4;border-radius:6px;padding:8px 16px">Kasbon</span>
      <span style="border:1px solid #e3e7e4;border-radius:6px;padding:8px 16px">Campuran</span>
    </div>
    <div style="padding:12px 18px">
      <div style="color:#5e6b65;font-size:11px;margin-bottom:4px">UANG DITERIMA</div>
      <div style="border:2px solid #1f7a4d;border-radius:8px;padding:8px 12px;font-size:22px;font-weight:700">Rp400.000</div>
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px;text-align:center">
        <span style="border:1px solid #e3e7e4;border-radius:6px;padding:9px">Uang pas</span>
        <span style="border:1px solid #e3e7e4;border-radius:6px;padding:9px">370.000</span>
        <span style="background:#e6f2ea;border:1px solid #1f7a4d;color:#1f7a4d;border-radius:6px;padding:9px;font-weight:600">400.000</span>
        <span style="border:1px solid #e3e7e4;border-radius:6px;padding:9px">500.000</span>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;background:#f0f8f3;border-radius:8px;padding:12px 14px;margin-top:12px"><span style="font-weight:600;color:#1f7a4d">KEMBALIAN</span><span style="font-size:32px;font-weight:800;color:#1f7a4d">Rp38.500</span></div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px"><span style="color:#5e6b65">☑ Cetak struk</span><span style="background:#1f7a4d;color:#fff;border-radius:8px;padding:12px 28px;font-weight:700;font-size:14px">Selesai</span></div>
    </div>
  </div>
</div>
</div></body></html>
